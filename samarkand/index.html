/* Layout: one-screen app — map fills, route panel docks right (desktop) or below (phone); player bar at the bottom. */
:root {
  --bg: #f6f3ee; --panel: #fffdf9; --fg: #1f1b16; --muted: #6e655a; --line: #e4ddd2;
  --day1: #b4472a; --day2: #12708f; --day3: #6b4fa0; --day4: #c0397a; --day5: #2f7d4f; --sk: #1f6fb2;
  --food: #c98a12; --dessert: #d6589a; --fast: #3b3a46; --drink: #7b4a2a; --hist: #7a5c2e; --opt: #8a8176; --chip: #efe8dd; --me: #1a73e8;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16130f; --panel: #1e1a15; --fg: #f1ebe2; --muted: #a79d90; --line: #332d25;
  --day1: #e2714f; --day2: #3fa9c9; --day3: #a58ad8; --day4: #e568a3; --day5: #5bb07f; --sk: #5aa2e0;
  --food: #e0a93a; --dessert: #e77bb2; --fast: #5a5966; --drink: #b07a55; --hist: #c9a46a; --opt: #9b9285; --chip: #2a251e; --me: #5b9cff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16130f; --panel: #1e1a15; --fg: #f1ebe2; --muted: #a79d90; --line: #332d25;
  --day1: #e2714f; --day2: #3fa9c9; --day3: #a58ad8; --day4: #e568a3; --day5: #5bb07f; --sk: #5aa2e0;
  --food: #e0a93a; --dessert: #e77bb2; --fast: #5a5966; --drink: #b07a55; --hist: #c9a46a; --opt: #9b9285; --chip: #2a251e; --me: #5b9cff; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto minmax(0, 1fr) auto; }
.app > * { min-width: 0; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0; font: 700 18px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
h1 small { display: block; font: 400 12px/1.4 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 3px; }
h1 a { color: inherit; text-decoration: none; }
.tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; min-width: 0; }
.tabs button, .btn { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--chip); color: var(--fg); padding: 7px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
#map { min-height: 0; background: #e8e2d8; }
aside { min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 4px 16px 24px; }
.day { padding-top: 14px; }
.day h2 { margin: 0 0 4px; font: 500 14px/1.3 var(--display); display: flex; align-items: center; gap: 8px; }
.day .meta { color: var(--muted); font-size: 12px; line-height: 1.45; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.stops { list-style: none; margin: 0; padding: 0; }
.stop details { border-radius: 8px; }
.stop details[open] { background: var(--chip); }
.stop summary { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 6px; border-radius: 8px; cursor: pointer; list-style: none; }
.stop summary::-webkit-details-marker { display: none; }
.stop summary:hover { background: var(--chip); }
.num { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 600 11px/24px var(--body); text-align: center; }
.num.food { border-radius: 6px; background: var(--food); }
.num.hist { background: var(--hist); font-style: italic; font-family: Georgia, serif; font-size: 13px; }
.stop .name { line-height: 1.35; font-weight: 500; }
.stop.history .name { font-weight: 400; font-style: italic; }
.stop .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stop.played .name::after { content: " ✓"; color: var(--muted); font-weight: 400; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; font-size: 12px; line-height: 1; display: grid; place-items: center; }
.play:hover { border-color: var(--fg); }
.play.on { background: var(--fg); color: var(--panel); }
.body { padding: 0 10px 10px 42px; font-size: 13px; line-height: 1.5; }
.body .hook { font-style: italic; margin: 0 0 6px; }
.body ul { margin: 0 0 6px; padding-left: 18px; }
.body li { margin-bottom: 4px; }
.body .lbl { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.body .warn { color: var(--muted); font-size: 12px; }
.body a, .note a { color: var(--me); }
.block { padding: 12px 6px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
.block .bt { font: 500 12px/1.3 var(--display); letter-spacing: 0.02em; }
.block .bs { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 2px; }
.move { color: var(--muted); font-size: 11.5px; padding: 0 0 2px 42px; }
.intro { margin: 2px 0 8px; }
.tag { display: inline-block; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 4px; vertical-align: 1px; font-weight: 500; font-style: normal; }
details[open] .tag { background: var(--panel); }
.tag.unesco { color: var(--day2); }
.tag.inter { color: var(--day3); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; padding: 12px 0 0; border-top: 1px solid var(--line); margin-top: 14px; }
.legend svg { vertical-align: middle; margin-right: 4px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dishes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.dishes li { font-size: 13px; line-height: 1.45; }
.dishes b { font-weight: 600; }
.player { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); }
.player .t { min-width: 0; }
.player .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .hint { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player input[type=range] { width: 100%; accent-color: var(--fg); margin: 4px 0 0; }
.player .big { width: 44px; height: 44px; font-size: 16px; }
.player .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; color: #fff; font: 600 11px/22px var(--body); text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); box-sizing: border-box; }
.pin.food { border-radius: 7px; background: var(--food); width: 22px; height: 22px; line-height: 18px; }
.pin.hist { width: 20px; height: 20px; line-height: 16px; background: var(--hist); font: italic 600 12px/16px Georgia, serif; }
.pin.home { font-size: 14px; background: #1f1b16; }
.pin.opt { width: 18px; height: 18px; line-height: 14px; font-size: 9px; background: var(--opt); }
.pin.optfood { width: 18px; height: 18px; line-height: 14px; font-size: 9px; background: var(--food); border-radius: 5px; opacity: .85; }
.pin.fi { background: var(--food); color: #000; border: 2px solid #fff; border-radius: 50%; width: 100%; height: 100%; box-sizing: border-box; font: 13px/1 system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; display: grid; place-items: center; padding: 0; box-shadow: 0 1px 5px rgba(0,0,0,.45); }
.pin.fi.small { font-size: 11px; border-width: 1.5px; }
.num.fi { width: 24px; height: 24px; background: var(--food); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.12); box-sizing: border-box; font: 12px/20px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
.fi { position: relative; overflow: visible; }
.fi .lg { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: #e0241b; color: #fff; border: 1.5px solid #fff; font: 800 9px/10px system-ui, sans-serif; text-align: center; box-sizing: border-box; }
.fi.dessert { background: var(--dessert); } .fi.fast { background: var(--fast); } .fi.drink { background: var(--drink); }
.pin.eve { width: 22px; height: 22px; line-height: 18px; font-size: 11px; background: #1f1b16; }
.me { width: 18px; height: 18px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25); box-sizing: border-box; }
.locate { width: 34px; height: 34px; display: grid; place-items: center; background: #fff; color: #1f1b16; border: 0; cursor: pointer; font-size: 18px; }
.locate.on { color: #1a73e8; }
.leaflet-popup-content { font: 13px/1.45 var(--body); margin: 12px 14px; max-width: 280px; }
.leaflet-popup-content b { font-weight: 600; }
.leaflet-popup-content a { color: #12708f; }
.leaflet-popup-content .play { display: inline-grid; vertical-align: middle; margin-right: 6px; background: #fff; color: #1f1b16; border-color: #ccc; }
.leaflet-container { font-family: var(--body); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 45% minmax(0, 1fr) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { margin-left: 0; overflow-x: auto; flex-wrap: nowrap; max-width: 100%; }
  .tabs button { flex: none; }
  .player .time { display: none; }
}
@media (prefers-reduced-motion: reduce) { .leaflet-fade-anim .leaflet-popup, .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style></head><body>
<div class="app">
  <header>
    <h1>Самарканд за день<small>Среда, 4 ноября · от вокзала до вокзала · ▶ — рассказ</small></h1>

<script>
const PLAN = {"city": "Samarkand", "version": 1, "start": "08:23", "home": {"id": "sk_station", "name": "Вокзал Самарканда", "lat": 39.68596, "lon": 66.929, "kind": "home"}, "days": [{"id": "sk", "order": 1, "title": "Самарканд за день", "short": "Самарканд", "date": "2026-11-04", "color": "#1f6fb2", "summary": "Поезд 06:09 → Шахи-Зинда в утреннем свете → завтрак: горячий нон с каймаком в чайхане Сиаба → Хазрет-Хызр → Афрасиаб (росписи VII века) → гробница Даниила → обсерватория Улугбека → самаркандский плов → делаешь бумагу в Конигиле → Сиаб за сладостями → Биби-Ханым → Регистан на закате → Гур-Эмир в подсветке → ужин → поезд 20:24.", "stops": [{"id": "sk_station", "name": "Вокзал Самарканда", "lat": 39.68596, "lon": 66.929, "kind": "home", "move": null, "stay": null, "when": "08:23 — приезд поездом 778Ж", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": null, "facts": [], "look": [], "order": null, "caution": null, "note": "Yandex Go до Шахи-Зинды ~10–15 мин (~6,7 км). Запасной транспорт: трамвай №2 «вокзал — Сиабский базар».", "food_near": null, "alt": null}, {"id": "sk_h_zarafshan", "name": "В пути: река, рассыпающая золото", "lat": 39.669614, "lon": 66.964901, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": "Самарканд вырастила река, чьё имя значит «рассыпающая золото».", "facts": ["Зеравшан (перс. «рассыпающая золото»: в песках верховий находили золото) — 877 км, начинается с Зеравшанского ледника в горах Таджикистана.", "У Курция Руфа и Страбона — Политимет, «многочтимая». В древности приток Амударьи, теперь не доходит до неё: воду разбирают на орошение.", "Выше Самарканда от реки отходит древний канал Даргом; через город течёт речка Сиаб (20–23 км) — у неё стоит мельница Мерос, по ней назван базар."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"id": "sk_shahizinda", "name": "Шахи-Зинда — аллея мавзолеев", "lat": 39.66248, "lon": 66.98781, "kind": "sight", "move": "taxi", "stay": 50, "when": "08:45", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "«Живой царь»: по легенде, обезглавленный проповедник взял свою голову и ушёл в колодец — и живёт там до сих пор.", "facts": ["«Шахи-Зинда» — «живой царь». Связан с Кусамом ибн Аббасом, двоюродным братом пророка Мухаммеда, «первым проповедником ислама в Средней Азии». Легенда: обезглавлен во время молитвы, поднял голову и ушёл в глубокий колодец.", "Аллея мавзолеев (гробниц-зданий под куполами) ~200 м по склону Афрасиаба: больше 20 сооружений XI–XIX вв., лучшие — времён Тимура, завоевателя XIV века. Он хоронил здесь родных: сестру Ширин-бика-ака (1385–86), племянницу Шади-Мульк-ака (1372), жену Туман-ака (1405).", "Майолика (расписная глазурованная плитка) Шади-Мульк-ака почти не потребовала реставрации — зазоры между плитками крошечные. На мавзолее Ширин-бика-ака, по словам гидов, есть цитата из Сократа.", "Резная дверь мазара Кусама (1404–05) подписана мастером Юсуфом Ширази; главные ворота построены при Улугбеке в 1434–35.", "Поверье «лестница грехов»: посчитай ступени вверх и вниз — если не совпало, грехи надо отмолить. Местные говорят: три паломничества сюда равны хаджу (паломничеству в Мекку)."], "look": ["Зазоры между плитками на мавзолее Шади-Мульк-ака (второй слева после лестницы).", "Резную дверь мазара Кусама в конце аллеи.", "Синий коридор средней группы с утра, пока нет групп."], "order": null, "caution": "С 07:00 до ~19:00; ~80 000 сум (иностранцы, 2026). Действующее место паломничества: закрытые плечи и колени, не садиться на надгробия. На аллею — 50 минут, потом завтрак.", "note": null, "food_near": null, "alt": null, "gq": "Shah-i-Zinda"}, {"id": "sk_breakfast", "name": "Завтрак в чайхане Сиабского базара — горячий нон с каймаком", "lat": 39.66211, "lon": 66.98094, "kind": "food", "move": "walk", "stay": 30, "when": "09:45", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Первая еда с пяти утра — горячая самаркандская лепёшка, которую бухарский эмир так и не смог повторить у себя.", "facts": ["Классический самаркандский завтрак на базаре — горячая лепёшка с каймаком (густыми сливками) и чай; с этого начинают утро гастроэкскурсии по Сиабу (putevka.com «Вкусный Самарканд»).", "Чайхана — чайная: сидят на тапчанах (широких деревянных помостах) и пьют чай из пиал. По OSM чайхана на территории базара работает круглосуточно.", "Самаркандский нон — из тандыра (глиняной печи), тонкий в центре и пышный по краю.", "Легенда: эмир Бухары увёз самаркандского пекаря, привозил муку, потом воду — не то. Пекарь сказал: не хватает воздуха Самарканда. Пекаря отпустили домой."], "look": ["Горки лепёшек с узором в центре в хлебных рядах.", "Тапчаны в чайхане."], "order": "Горячий самаркандский нон, каймак, чайник зелёного чая. Если каймака нет — нон с халвой из соседних рядов.", "caution": "Часы чайханы — по OSM 24/7, не проверено. Каймак привозят не каждый день (отзывы гастротуров). Платят наличными.", "note": "Точка — чайхана «Choyxona» на территории базара (OSM way 235763875: 24/7, ~100 мест, есть места на улице). От Шахи-Зинды ~700 м пешком, до Хазрет-Хызра — через дорогу.", "food_near": null, "alt": "Если чайхана закрыта — купи нон в хлебных рядах и сядь с чаем в Bibikhanum Teahouse у мечети (часы не проверял) или в Labi G'or у Регистана (с 07:00 по OSM, далеко).", "gq": "Siab Bazaar", "ic": "🫓", "ig": "meal"}, {"id": "sk_khizr", "name": "Мечеть Хазрет-Хызр — терраса с видом", "lat": 39.66344, "lon": 66.98332, "kind": "sight", "move": "walk", "stay": 20, "when": "10:20", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Мечеть покровителя путешественников стоит там, где, по преданию, белая птица спасла осаждённый город.", "facts": ["Хызр — вечный странник мусульманских преданий, хранитель «живой воды», покровитель путников.", "Легенда: после взятия Самарканда арабами (712) они перегородили канал, чтобы затопить крепость, но огромная белая птица разрушила плотину. В память о чуде мечеть поставили на месте зороастрийского храма (храма огнепоклонников, чья вера была здесь до ислама) у Железных ворот.", "Разрушена монголами в 1220-м; нынешнее здание — 1854 года на старом фундаменте; портал и минарет добавил мастер Абдукадыр Бакиев в 1919-м.", "С 2018 года рядом — мавзолей первого президента Узбекистана Ислама Каримова."], "look": ["Расписной потолок и резные колонны айвана (крытой террасы).", "Вид с террасы на купола Биби-Ханым."], "order": null, "caution": "Вход может быть платным (не проверено). Действующая мечеть.", "note": null, "food_near": null, "alt": null, "gq": "Hazrat Khizr Mosque"}, {"id": "sk_h_maracanda", "name": "Минутка истории: Мараканда и Александр", "lat": 39.666303, "lon": 66.990647, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": null, "facts": ["Афрасиаб — древний Самарканд, >200 га руин; у греков — Мараканда, столица Согдианы (страны в долине Зеравшана).", "329 до н. э. — Александр Македонский берёт город; согдиец Спитамен громит его отряд у Зеравшана; на пиру в Мараканде Александр убивает друга Клита.", "Дальше — согдийские цари, арабы, персидская династия Саманидов. 1220 — Чингисхан берёт город после трёхдневной осады; холм заброшен, город уходит южнее, к нынешнему Регистану. Название «Афрасиаб» — с XVII в., по мифическому царю Турана из персидской поэмы «Шахнаме»."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"id": "sk_afrasiab", "name": "Музей Афрасиаба — зал «Послов» VII века", "lat": 39.66941, "lon": 66.99334, "kind": "sight", "move": "walk", "stay": 35, "when": "10:55", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "За шестьсот лет до Марко Поло в одном зале самаркандского дворца нарисовали Китай, Корею, Индию и степь.", "facts": ["Росписи найдены в 1965 году на городище (месте древнего города); VII век, клеевые краски по глиняной штукатурке, панели выше 2 м. Это живопись согдийцев — древних хозяев Самарканда.", "Царь Самарканда Вархуман принимает иностранных послов — его имя названо в согдийской надписи.", "Процессия: фигура на белом слоне (принцесса), три всадницы — одна в коротком красном платье, жёлтых шароварах и чёрных сапожках, — мужчины на верблюдах с длинными мечами. Похоже на свадебное шествие.", "На другой стене — китайская сцена с женщинами в лодке; среди послов, по одной из версий, корейцы (перья на шапках)."], "look": ["Всадницу в красном платье и жёлтых шароварах.", "Фигуры с перьями на головных уборах.", "Принцессу на белом слоне."], "order": null, "caution": "Обычные витрины можно пропустить — иди сразу в главный зал. Часы: OSM 09:00–18:00, по дирекции с сентября 2026 до 23:00. Цену не нашёл.", "note": null, "food_near": null, "alt": null, "gq": "Afrasiyab Museum"}, {"id": "sk_h_sogd", "name": "В пути: согдийцы, купцы Шёлкового пути", "lat": 39.672557, "lon": 66.997071, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": "Люди с росписей — согдийцы, «финикийцы Средней Азии», чей алфавит дошёл до Монголии и Маньчжурии.", "facts": ["Согдийцы — древний иранский народ долины Зеравшана, от Бухары до Худжанда; Бартольд называл их «финикийцами Центральной Азии».", "В IV–VIII вв. держали торговлю Востока и Запада на Шёлковом пути (сети караванных дорог через Азию); колонии — до восточного Китая; согдийский — общий язык торговли на большей части пути.", "Документы найдены в Турфане и Дуньхуане (Китай) и в крепости Муг (Таджикистан) — архив согдийского царя Деваштича.", "Согдийское письмо → староуйгурское → старомонгольское (им до сих пор пишут во Внутренней Монголии) → маньчжурское. Потомок языка — ягнобский, в горах Таджикистана."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"id": "sk_daniel", "name": "Мавзолей Даниила (Ходжа Даниёр)", "lat": 39.6734, "lon": 66.99456, "kind": "sight", "move": "walk", "stay": 20, "when": "11:45", "extra": true, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Восемнадцатиметровый саркофаг, который, по легенде, растёт сам.", "facts": ["По преданию — гробница библейского пророка Даниила, которого бросили в ров ко львам; почитают мусульмане, христиане и иудеи.", "Главной гробницей Даниила учёные считают древний город Сузы в Иране; в Самарканде рассказывают, что мощи привёз Тимур, чтобы они хранили его столицу.", "Надгробие — около 18 м; легенда говорит, что оно растёт.", "Внизу у склона — источник, воду считают целебной. Рассказывают, что засохшая фисташка рядом ожила после молитвы Патриарха Алексия II (главы Русской православной церкви) в 1996 году."], "look": ["Длину надгробия — пройди вдоль него.", "Фисташковое дерево у мавзолея.", "Источник внизу по лестнице."], "order": null, "caution": "Действующее место паломничества; вход может быть платным.", "note": null, "food_near": null, "alt": null, "gq": "Mausoleum of Saint Daniel Samarkand"}, {"id": "sk_h_ulugbek", "name": "В пути: Улугбек, учёный на троне", "lat": 39.672675, "lon": 66.99862, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": "Внук Тимура правил Самаркандом сорок лет, любил звёзды больше войны — и был убит по приказу собственного сына.", "facts": ["Улугбек родился 22 марта 1394 в Султании (Иран) во время похода деда; отец — Шахрух, младший сын Тимура, правивший из Герата.", "В 1409 году, в 15 лет, стал правителем Самарканда и правил 40 лет. По преданию, в детстве видел развалины обсерватории в Мараге.", "Строил медресе (исламские школы) в Самарканде, Бухаре и Гиждуване; на бухарском — хадис «Стремление к знанию есть обязанность каждого мусульманина и мусульманки».", "1447 — смерть Шахруха и смута; в октябре 1449 войско Улугбека разбито сыном Абд ал-Латифом. По Мирхонду, вечером у огня искра прожгла ему плащ — «ты тоже узнал»; убит по приказу сына."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"id": "sk_observatory", "name": "Обсерватория Улугбека", "lat": 39.67521, "lon": 67.00554, "kind": "sight", "move": "walk", "stay": 40, "when": "12:25", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "На мраморной дуге каждый градус длиной в семьдесят сантиметров — так здесь измерили звёздный год с ошибкой меньше минуты.", "facts": ["Построена Улугбеком на холме Кухак в 1424–1428: трёхэтажный цилиндр ~30 м высотой, диаметр ~46 м.", "Внутри — секстант (гигантский угломер) радиусом ~40 м по линии север—юг; на мраморе деления, 70 см на градус. Подземная часть дуги сохранилась.", "К 1437 году — каталог 1018 звёзд; звёздный год 365 д 6 ч 10 мин 8 с (ошибка меньше минуты); наклон оси Земли 23,52°.", "После гибели Улугбека ученик Али Кушчи увёз рукописи и закончил труды в Константинополе (Стамбуле); в Европе таблицы напечатали в 1650-м.", "Здание разобрали на кирпичи в XVI в.; нашёл его в 1908 г. учитель и археолог-самоучка Василий Вяткин по старой дарственной; Вяткин похоронен здесь же."], "look": ["Мраморные бортики дуги с делениями.", "Могилу Вяткина у входа.", "Памятник Улугбеку с книгой."], "order": null, "caution": "~75 000 сум (иностранцы). Музей при обсерватории — по желанию.", "note": null, "food_near": null, "alt": null, "gq": "Ulugh Beg Observatory"}, {"id": "sk_oshqand", "name": "Oshqand — самаркандский плов на обед", "lat": 39.66602, "lon": 67.01243, "kind": "food", "move": "taxi", "stay": 45, "when": "13:15", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "В Самарканде плов не перемешивают: рис, морковь и мясо лежат на блюде слоями, как в казане.", "facts": ["Самаркандский плов собирают слоями и не перемешивают ни в казане, ни при подаче: на ляган (большое блюдо) — рис, морковь, сверху крупные куски мяса.", "Жёлтую морковь почти не жарят, а тушат. Традиционное масло — зигир (льняное); такой плов — «зигир-ош», местная гордость.", "По сравнению с более жирным ташкентским — суше, рассыпчатее, с выраженным вкусом мяса (Gazeta.uz).", "Легенда: подавать плов не перемешивая велел Тимур.", "Oshqand открыт в феврале 2024; казаны к 11:00 (обеденный плов кончается к ~15:00) и вечерний 18:00–20:30."], "look": ["Как ошпаз выкладывает плов слоями, не мешая."], "order": "Полпорции самаркандского плова (~45 000 сум) + чалоп (холодный суп на кислом молоке с зеленью) + анзур (маринованный лук) + чай. Спроси, есть ли зигир-ош (на льняном масле).", "caution": "Плов — обеденное блюдо: после 15:00 может не остаться.", "note": null, "food_near": null, "alt": "Samarqand osh markazi №1 (с 2009, ул. Ибн Сино, 12, ближе к Афрасиабу): зигир-плов 40 000 и плов с бараниной 42 000 за полпорции. Или Super osh (Афродита), ул. Орзу Махмудова, 6 — казаны в 11:00 и 13:00.", "gq": "Oshqand Samarkand", "ic": "🍚", "ig": "meal"}, {"id": "sk_meros", "name": "Бумажная мельница «Мерос», Конигил — сделай лист сам", "lat": 39.6665, "lon": 67.03394, "kind": "sight", "move": "taxi", "stay": 60, "when": "14:10", "extra": false, "interactive": true, "unesco": false, "optional": false, "approx": false, "hook": "Тысячу лет назад самаркандская бумага вытеснила египетский папирус — а здесь её снова делают руками, и ты можешь отлить свой лист.", "facts": ["Арабский писатель ас-Саалиби (X–XI вв.): самаркандская бумага «вытесняет бумагу Египта и кожу… очень красивая, нежная, тонкая».", "Легенда: секрет принесли китайские мастера, взятые в плен после Таласской битвы 751 года (арабы против китайской армии). Историки осторожнее: бумагу знали раньше через согдийских купцов, а своё производство появилось в середине VIII века.", "Мастерскую основали братья Зариф и Ислом Мухтаровы в 1996 году; по их словам, ~10 лет восстанавливали технологию по рукописям.", "Процесс: кора годовалых побегов тутовника (шелковицы) → варка часами → кашица → черпают ситом → пресс → сушка → полировка камнем на мраморе до блеска.", "На этой бумаге реставрируют старинные рукописи; в саду — водяное колесо чархпалак с кувшинами и чайхана у реки Сиаб."], "look": ["Водяное колесо с кувшинами.", "Полировку листа камнем на мраморной доске.", "Попроси сито — и отлей лист сам."], "order": null, "caution": "Часы: зимой ~09:00–17:00 (Homo Faber), вход ~20 000–40 000 сум (отзывы). Гиды советуют ~1,5 ч, у тебя час: сначала попроси сито и отлей лист, потом смотри остальное.", "note": null, "food_near": "Чайхана в саду мастерской (плов на льняном масле, фрукты).", "alt": null, "gq": "Meros paper mill Konigil"}, {"id": "sk_h_age", "name": "В пути: имя и возраст города", "lat": 39.661351, "lon": 66.987855, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": "Самарканд — ровесник Рима, а его имя, возможно, значит «тучный город».", "facts": ["По археологическим данным город основан в середине VIII в. до н. э. — ровесник Рима; в 1970 году отмечали 2500-летие.", "Название: по одной версии — согдийское «асмара» (камень) + «канд» (крепость, город); по другой — тюркское «семиз кент», «тучный город» (так объясняли китайские хроники и Бируни).", "В XI веке ко двору караханидского правителя пригласили Омара Хайяма; здесь он написал главный труд по алгебре.", "2001 — ЮНЕСКО: «Самарканд — перекрёсток культур». Сегодня третий по населению город Узбекистана, ~882 тыс. (предварительно, перепись 2026)."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"id": "sk_siab", "name": "Сиабский базар — нон, халва, сухофрукты", "lat": 39.66279, "lon": 66.98053, "kind": "food", "move": "taxi", "stay": 20, "when": "15:20", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Второй заход на главный базар города, названный по речке «чёрная вода», — теперь за халвой, наватом и лепёшкой домой.", "facts": ["Крупнейший и старейший базар Самарканда, больше 7 га; «Сиаб» — «чёрная вода», по речке Сиаб.", "Самаркандский нон везут в подарок по всей стране; в 2022 году по Узбекистану пекли ~15 000 таких лепёшек в день.", "Сладости: нават — сахар, выращенный крупными кристаллами, к чаю; парварда — тягучие подушечки из сахара с мукой. Сухофрукты: урюк (абрикос с косточкой), кишмиш (мелкий изюм без косточек), миндаль.", "С сентября 2026 базар работает до полуночи."], "look": ["Ряды халвы, навата и сухофруктов под крышей.", "Хлебные ряды — взять нон домой."], "order": "Самаркандский нон домой, халва, нават, парварда, урюк, кишмиш, миндаль. Пробовать можно, торговаться нужно.", "caution": "Платят наличными.", "note": null, "food_near": null, "alt": null, "gq": "Siab Bazaar", "ic": "🫓", "ig": "meal"}, {"kind": "sight", "move": "walk", "extra": true, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Маленький купольный мавзолей через улицу от гигантской мечети — внутри расписные сталактитовые своды.", "facts": ["Внутри несколько надгробий: по одним источникам пять, по другим три саркофага. По одной из версий, построен для матери жены Тимура; атрибуция спорная.", "Билет отдельный от мечети: ~40 000–50 000 сум по отзывам 2024–2025 годов."], "look": ["Сталактитовые своды под куполом."], "order": null, "caution": "Если времени мало — хватит посмотреть снаружи, 2 минуты. Lonely Planet считает вход переоценённым.", "note": null, "food_near": null, "alt": null, "id": "sk_bibitomb", "name": "Мавзолей Биби-Ханым — напротив мечети", "lat": 39.66039, "lon": 66.98228, "stay": 10, "when": "15:40", "gq": "Bibi-Khanym Mausoleum Samarkand"}, {"id": "sk_bibikhanym", "name": "Мечеть Биби-Ханым", "lat": 39.66069, "lon": 66.98006, "kind": "sight", "move": "walk", "stay": 35, "when": "15:50", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "Тимур счёл портал своей мечети слишком низким — велел казнить надсмотрщика и строить заново.", "facts": ["Соборная (главная пятничная) мечеть Тимура. Заложена в мае 1399 года после похода в Индию; придворный историк: 200 каменотёсов на стройке, 500 в горах и 95 слонов из Индии.", "Во дворе молились 10 000 человек; галерея на 400 каменных колоннах; ворота из сплава семи металлов звенели при открытии.", "Сентябрь 1404: Тимур разгневан низким порталом (парадной аркой входа) — надзиравшего вельможу казнить, портал разобрать. Испанский посол Клавихо видел, как рабочим в яму бросали варёное мясо и деньги.", "Землетрясение 1897 года превратило мечеть в руины; нынешний облик — в основном реставрация конца XX века.", "Легенда: жена Тимура Биби-Ханым строила мечеть к его возвращению; зодчий потребовал поцелуй, след остался на щеке — Тимур казнил зодчего и велел женщинам закрывать лица."], "look": ["Огромную мраморную подставку для Корана во дворе: по преданию, для Корана халифа Османа, что теперь хранится в Ташкенте; поверье — бездетная женщина, проползшая под ней, родит.", "Высоту портала — сравни с людьми у входа.", "Через дорогу — восьмигранный мавзолей Биби-Ханым."], "order": null, "caution": "~75 000 сум (блоги 2025); с сентября 2026 открыта до ~23:00.", "note": null, "food_near": "Bibikhanum Teahouse прямо у мечети — чай, самса, плов; обслуживание неспешное.", "alt": null, "gq": "Bibi-Khanym Mosque"}, {"kind": "sight", "move": "walk", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Главный пешеходный коридор старого города: за спиной купола Биби-Ханым, впереди Регистан.", "facts": ["Около 750 м от Биби-Ханым до Регистана; по пути купола медресе и сувенирные лавки. Не бери такси — пешком 10–12 минут."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null, "id": "sk_tashkent_st", "name": "Пешком по Ташкентской улице к Регистану", "lat": 39.65666, "lon": 66.97805, "stay": 10, "when": "16:25", "gq": "Tashkent Street Samarkand"}, {"id": "sk_h_timur", "name": "Минутка истории: Тимур и его столица", "lat": 39.655428, "lon": 66.977259, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": null, "facts": ["Тимур родился в 1336 году у Кеша (Шахрисабз); с 1370 года Самарканд — столица его империи от Индии до Малой Азии.", "Окрестным сёлам он дал имена Багдад, Шираз, Дамаск, Миср (Каир) — мол, это лишь пригороды Самарканда. Мастеров из завоёванных земель переселяли силой.", "Испанский посол Клавихо (1404): на базарах товары из Китая, Индии и Золотой Орды.", "1405 — Тимур умер в Отраре (юг нынешнего Казахстана) в начале похода на Китай."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"kind": "sight", "move": "walk", "extra": true, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Шестигранный купол на перекрёстке дорог: торговали здесь ещё в XV веке, а нынешнее здание 1785 года.", "facts": ["«Чорсу» — «четыре воды», то есть перекрёсток. Построен при эмире Шахмураде; в 2005 году отреставрирован, сняли трёхметровый слой грунта, вернув зданию высоту. Внутри — галерея Академии художеств.", "Галерея открыта ежедневно 10:00–18:00 (uzbekistan.travel); снаружи достаточно 5 минут."], "look": ["Купол Чорсу рядом с порталом Шердора."], "order": null, "caution": null, "note": null, "food_near": null, "alt": null, "id": "sk_chorsu", "name": "Торговый купол Чорсу (1785)", "lat": 39.65539, "lon": 66.97694, "stay": 8, "when": "16:37", "gq": "Chorsu Samarkand"}, {"id": "sk_registan", "name": "Регистан на закате", "lat": 39.65478, "lon": 66.97576, "kind": "sight", "move": "walk", "stay": 45, "when": "16:45", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "Северо-восточный минарет медресе Улугбека в 1932 году выпрямил тот самый Шухов, что построил башню на Шаболовке.", "facts": ["«Регистан» — по-персидски «место, покрытое песком»: главная площадь, торг, указы; по преданию, и казни. Вокруг — три медресе (исламские школы с кельями вокруг двора).", "Медресе Улугбека (1417–1420) — один из лучших университетов Востока XV века; лекции читали Кази-заде Руми, аль-Каши и сам Улугбек.", "1932 — по проекту инженера В. Г. Шухова (автора Шуховской башни на Шаболовке) и М. Ф. Мауэра выпрямлен северо-восточный минарет; операция «имела резонанс во всём мире». В 1965-м выпрямили юго-восточный.", "Шердор («украшенный львами», 1619–1636, при самаркандском правителе Ялангтуше Бахадуре): на портале полосатые «львы» гонятся за ланями, на спинах солнце с человеческим лицом; символ льва и солнца — от тюркской династии сельджуков.", "Тилля-Кари («позолоченное», 1646–1660) было главной пятничной мечетью до 1920-х; плоский потолок расписан золотом так, что кажется куполом."], "look": ["Северо-восточный минарет Улугбека — тот, что выпрямили.", "Солнце с лицом над тиграми на Шердоре.", "Потолок-«купол» Тилля-Кари.", "Как загорается подсветка в сумерках (закат ~17:25)."], "order": null, "caution": "100 000 сум (иностранцы), один вход — заходи один раз и оставайся до сумерек. Открыт до 24:00 (сезон до 20 ноября). На минареты официально не пускают — неофициальный подъём за деньги лучше не брать.", "note": "Музыкальное шоу заявлено ежедневно в 21:00 (с сентября 2026), свето-звуковая панорама могла не работать из-за ремонта. С поездом 20:24 не успеть — смотрим подсветку.", "food_near": null, "alt": null, "gq": "Registan"}, {"kind": "sight", "move": "walk", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": "С площадки у южной стороны все три медресе видны целиком — и на твоих глазах загорится подсветка.", "facts": ["4 ноября закат в 17:28, гражданские сумерки до 17:56: подсветка уже горит, а небо ещё синее.", "Площадка бесплатная. Билет внутрь ансамбля (100 000 сум) — на один вход, поэтому сначала медресе, потом площадка.", "Свето-лазерное шоу (registon.uz) приостановлено на ремонт, музыкальное — в 21:00: с поездом 20:24 его не увидеть."], "look": ["Порталы Улугбека, Шердора и Тилля-Кари в подсветке."], "order": null, "caution": null, "note": null, "food_near": null, "alt": null, "id": "sk_registan_view", "name": "Смотровая площадка Регистана — закат и синий час", "lat": 39.6538, "lon": 66.9757, "stay": 25, "when": "17:30–17:55", "gq": "Registan viewing platform Samarkand"}, {"id": "sk_h_babur", "name": "В пути: после Тимуридов", "lat": 39.65221, "lon": 66.970057, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": "Потомок Тимура трижды брал Самарканд, трижды терял — и ушёл основывать империю в Индии.", "facts": ["Бабур из Андижана, потомок Тимура в пятом колене, брал Самарканд в 1497 (14 лет, после семимесячной осады), в 1500 и в 1511 году — и каждый раз терял.", "Его вытеснил Шейбани-хан, вождь кочевых узбеков; Бабур ушёл в Кабул, в 1526 году разбил делийского султана при Панипате и основал империю Великих Моголов. Автор мемуаров «Бабур-наме».", "При Шейбанидах столицу в 1533 году перенесли в Бухару, но ханы Бухары короновались в Самарканде на каменном троне времён Тимура.", "1720-е — войны, саранча, голод; к 1735 году город почти опустел: среди руин семь лет жил один суфий по прозвищу «Шах сов». Возрождение — со второй половины XVIII века."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"id": "sk_guremir", "name": "Гур-Эмир в подсветке", "lat": 39.64846, "lon": 66.96909, "kind": "sight", "move": "walk", "stay": 20, "when": "18:00", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "Гроб Тимура открыли 19 июня 1941 года — через три дня началась война.", "facts": ["«Гур-Эмир» — «гробница эмира (правителя)». Построен в 1403–1404 для внука и наследника Мухаммад-Султана; в 1405 здесь похоронили самого Тимура, хотя он хотел лежать в родном Кеше.", "Лежат: Тимур, сыновья Шахрух и Мираншах, внуки Мухаммад-Султан и Улугбек, учитель Мир Сеид Береке. Надгробия в зале — кенотафы (символические надгробия), могилы в склепе под ними.", "Тёмно-зелёная глыба нефрита на могиле Тимура привезена Улугбеком; расколота — по преданию, Надир-шах пытался вывезти её в 1740-м.", "1941: антрополог Герасимов (восстанавливал лица по черепам) подтвердил хромоту Тимура (рост ~172 см) и отсечённую голову Улугбека. Гроб Тимура открыли 19 июня, война началась 22-го. «Проклятие Тамерлана» — миф, его автор — присутствовавший при вскрытии кинооператор Малик Каюмов.", "Перезахоронили по исламскому обряду 20 декабря 1942 — армия Паулюса под Сталинградом уже была в окружении. Мавзолей стал образцом для гробницы Хумаюна и Тадж-Махала, построенных Великими Моголами — потомками Бабура."], "look": ["Нефритовое надгробие Тимура и трещину на нём.", "Золото и оникс в главном зале.", "Ребристый купол в ночной подсветке."], "order": null, "caution": "75 000 сум; открыт до ~23:00 (2026). Место поклонения — закрытые плечи и колени.", "note": null, "food_near": null, "alt": null, "gq": "Gur-e-Amir"}, {"kind": "sight", "move": "walk", "extra": true, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Снаружи глухой кирпичный куб, внутри — стены и купол в росписи кундаль: рельеф, краски и много золота.", "facts": ["Датируют 1470-ми годами. В крипте неопознанные погребения — по одной гипотезе там внук Тимура Абд аль-Латиф. Консервация 1924–1925, реставрация 2007.", "В 95 м за Гур-Эмиром. По отзывам открыт примерно до 19:00, вход ~10 000 сум; если ворота закрыты — позови сторожа."], "look": [], "order": null, "caution": "Часы противоречивы: бывает закрыт на реставрацию. Если закрыто — потеряешь 3 минуты.", "note": null, "food_near": null, "alt": null, "id": "sk_aksaray", "name": "Мавзолей Ак-Сарай — роспись кундаль, если открыт", "lat": 39.64796, "lon": 66.96999, "stay": 10, "when": "18:20", "gq": "Ak Saray Mausoleum Samarkand"}, {"id": "sk_rukhabad", "name": "Мавзолей Рухабад", "lat": 39.65085, "lon": 66.96819, "kind": "sight", "move": "walk", "stay": 5, "when": "18:32", "extra": false, "interactive": false, "unesco": true, "optional": false, "approx": false, "hook": "Тимур спешивался с коня каждый раз, проезжая мимо этой скромной гробницы.", "facts": ["«Рухабад» — «обитель духа». Построен по приказу Тимура ок. 1380 над могилой шейха (духовного наставника) Бурханеддина Сагарджи.", "Марокканский путешественник Ибн Баттута называл шейха главой мусульманской общины в Пекине; он был влиятелен при дворе монгольских императоров Китая (Юань) и женат на «китайской принцессе», завещал похоронить себя в Самарканде.", "Тимур всегда спешивался, проезжая мимо. Легенда: в куполе замурована медная шкатулка с семью волосками из бороды пророка."], "look": ["Простой кирпичный объём без изразцов — Самарканд до «синей» эпохи.", "Мечеть рядом (1880-е) в «китайском» стиле."], "order": null, "caution": null, "note": null, "food_near": null, "alt": null, "gq": "Rukhobod Mausoleum"}, {"id": "sk_h_russia", "name": "Минутка истории: русский Самарканд и первая столица УзССР", "lat": 39.650062, "lon": 66.965625, "kind": "history", "move": "walk", "stay": null, "when": null, "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": true, "hook": null, "facts": ["2 мая 1868 — войска туркестанского генерал-губернатора Кауфмана входят в Самарканд. В июне, пока армия воюет с бухарским эмиром, гарнизон шесть дней держит цитадель; контратаки водит художник Верещагин (орден Св. Георгия, картины «Пусть войдут!» и «Вошли!»).", "1888 — Закаспийская железная дорога доходит до Самарканда; рядом со старым городом растёт новый, с бульварами.", "1925–1930 — Самарканд столица Узбекской ССР (правительство Файзуллы Ходжаева); 1927 — первый светский вуз, будущий университет; в 1930-м столицу переносят в Ташкент."], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}, {"kind": "sight", "move": "walk", "extra": true, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Широкий бульвар с платанами заложили в 1871 году, чтобы отделить старый город от нового, европейского.", "facts": ["Заложен при первом русском губернаторе Абрамове и раньше назывался Абрамовским. Вдоль него здания царского времени: Русско-Китайский банк (1896, теперь администрация университета), женская гимназия (1904), бывшая резиденция губернатора, теперь хокимият.", "В начале бульвара — памятник Амиру Тимуру; в конце, у хокимията, — собор святителя Алексия, последний православный храм Самарканда имперских времён."], "look": ["Контраст: имперские фасады после тимуридских куполов."], "order": null, "caution": "Отсюда до «Платана» ~1,2 км — такси 5 минут. Если ужин важнее, иди прямо от Рухабада к «Платану», мимо памятника Тимуру.", "note": null, "food_near": null, "alt": null, "id": "sk_university", "name": "Русский Самарканд: памятник Тимуру и Университетский бульвар", "lat": 39.64678, "lon": 66.9612, "stay": 15, "when": "18:40", "gq": "University Boulevard Samarkand"}, {"id": "sk_platan", "name": "Ужин в «Платане»", "lat": 39.65757, "lon": 66.95574, "kind": "food", "move": "taxi", "stay": 50, "when": "19:05", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": "Ресторан в саду, в старой «русской» части города — по пути на вокзал.", "facts": ["Ул. Пушкина, 2, в бывшем русском квартале. TripAdvisor ~4,0 при ~1000 отзывов, долго в тройке ресторанов города; узбекская и европейская кухня, сад.", "Свежие отзывы смешанные — выбирай простое местное: шашлык, лагман, плов."], "look": [], "order": "Шашлык из баранины, самаркандский нон, салат ачичук (помидоры с луком), зелёный чай с наватом. Если в обед плова не досталось — спроси плов.", "caution": "10:00–23:00 (Advantour). Лучше забронировать. Такси на вокзал ~10 мин — выйди не позже 19:55 (на вокзале досмотр).", "note": null, "food_near": null, "alt": "Если обратно поезд 709Ф в 19:23 — быстрый ужин в Labi G'or между Регистаном и Гур-Эмиром (по OSM 07:00–23:00; отзывы не проверял) и такси на вокзал в 18:55.", "gq": "Platan restaurant Samarkand", "ic": "🍢", "ig": "meal"}, {"id": "sk_station_b", "name": "Вокзал Самарканда — поезд домой", "lat": 39.68596, "lon": 66.929, "kind": "home", "move": "taxi", "stay": null, "when": "20:24 — поезд 715Ф Nasaf, в Ташкенте 23:54", "extra": false, "interactive": false, "unesco": false, "optional": false, "approx": false, "hook": null, "facts": [], "look": [], "order": null, "caution": null, "note": null, "food_near": null, "alt": null}], "blocks": [{"title": "Утро у Шахи-Зинды", "from": "sk_station", "summary": "Такси с вокзала к аллее мавзолеев, пока свет мягкий и нет групп, и первый завтрак в чайхане Сиаба."}, {"title": "Афрасиаб: древний город", "from": "sk_khizr", "summary": "Холм, где стоял древний Самарканд: мечеть Хызра, согдийские росписи VII века и гробница пророка Даниила."}, {"title": "Улугбек и звёзды", "from": "sk_observatory", "summary": "Мраморная дуга, которой внук Тимура измерил звёздный год."}, {"title": "Плов и бумага Конигила", "from": "sk_oshqand", "summary": "Самаркандский плов слоями и свой лист шёлковой бумаги на старой мельнице."}, {"title": "Сиаб и Биби-Ханым", "from": "sk_siab", "summary": "Сладости домой, маленький мавзолей Биби-Ханым и огромная мечеть Тимура."}, {"title": "Регистан на закате", "from": "sk_registan", "summary": "Ташкентской улицей мимо купола Чорсу к трём медресе; закат и подсветка со смотровой площадки."}, {"title": "Гур-Эмир и домой", "from": "sk_guremir", "summary": "Гробница Тимура в огнях, роспись Ак-Сарая, бульвар русского Самарканда, ужин и поезд."}]}], "evening": [{"id": "sk_ev_show", "name": "Музыкальное шоу на Регистане", "when": "ежедневно 21:00 (заявлено дирекцией с сентября 2026)", "lat": 39.65478, "lon": 66.97576, "note": "С поездом 20:24 не успеть. Свето-звуковая панорама и 3D-лазер одно время не работали из-за ремонта — данные противоречивы. Если вдруг взял 777М (20:01) — тоже не успеть; подсветку видно с ~17:45.", "gq": "Registan"}, {"id": "sk_ev_eternal", "name": "Вечный город (Boqiy Shahar) вечером", "when": "до ~22:00–23:00, рестораны до полуночи", "lat": 39.65384, "lon": 67.06128, "note": "Новодел 2022 года к саммиту ШОС: 50+ мастерских, рестораны, чайхана, винный зал, амфитеатр. Вход свободный, после заката красиво. ~12 км от вокзала — только если останешься на ночь или поедешь ночным поездом.", "gq": "Eternal City Samarkand"}, {"id": "sk_ev_oshqand", "name": "Вечерний плов в Oshqand", "when": "18:00–20:30", "lat": 39.66602, "lon": 67.01243, "note": "Если в обед не успел — второй казан вечером. Далековато от центра (восток).", "gq": "Oshqand Samarkand", "ic": "🍚", "ig": "meal"}], "optional": [{"id": "sk_opt_osh1", "name": "Samarqand osh markazi №1 (с 2009)", "lat": 39.676, "lon": 66.974, "kind": "food", "approx": true, "note": "Ул. Ибн Сино, 12. Зигир-плов и плов с бараниной, три казана в день; местные идут к полудню. Координата примерная.", "gq": "Samarqand osh markazi", "ic": "🍚", "ig": "meal"}, {"id": "sk_opt_superosh", "name": "Super osh (Афродита)", "lat": 39.636, "lon": 66.956, "kind": "food", "approx": true, "note": "Ул. Орзу Махмудова, 6. Ошпаз Олим Хамидов ~15 лет; казаны 11:00 и 13:00; 50 000 за полпорции с салатом, чалопом и чаем.", "gq": "Super Osh Samarkand", "ic": "🍚", "ig": "meal"}, {"id": "sk_opt_bibitea", "name": "Bibikhanum Teahouse — чай у мечети", "lat": 39.65963, "lon": 66.97996, "kind": "food", "note": "Двор с видом на Биби-Ханым: чай, самса, плов. Медленное обслуживание.", "gq": "Bibikhanum Teahouse", "ic": "🫖", "ig": "drink"}, {"id": "sk_opt_labigor", "name": "Labi G'or — у Регистана", "lat": 39.65308, "lon": 66.97383, "kind": "food", "note": "Между Регистаном и Гур-Эмиром, по OSM 07:00–23:00. Запасной ужин при поезде 19:23. Отзывы не проверял.", "gq": "Labi G'or Samarkand", "ic": "🍽️", "ig": "meal"}, {"id": "sk_opt_khovrenko", "name": "Винзавод и музей виноделия им. Ховренко", "lat": 39.65366, "lon": 66.94955, "kind": "sight", "interactive": true, "note": "Дегустации (7 вин, 3 коньяка, ликёр) через туроператоров, $60–120. Часы в 2026 не нашёл — звони заранее. Рядом с «Платаном».", "gq": "Khovrenko winery Samarkand"}, {"id": "sk_opt_eternal", "name": "Вечный город днём — после Конигила", "lat": 39.65384, "lon": 67.06128, "kind": "sight", "note": "2 км от Мероса. Новодел, но 50+ живых мастерских (керамика, ковры, резьба). Вход свободный. Лучше вечером.", "gq": "Eternal City Samarkand"}, {"id": "sk_opt_bukhari", "name": "Комплекс Имама аль-Бухари (25 км)", "lat": 39.7869, "lon": 66.869, "kind": "sight", "approx": true, "note": "Главная святыня суннитов-хадисоведов; платный вход с мая 2026. Не помещается в день — на другой раз.", "gq": "Imam al-Bukhari Memorial Complex"}], "dishes": [{"name": "Самаркандский плов", "fact": "Не перемешивают ни в казане, ни на блюде: слоями рис — морковь — крупные куски мяса. Жёлтую морковь тушат, а не жарят. Суше и рассыпчатее ташкентского."}, {"name": "Зигир-ош", "fact": "Плов на масле зигир (из семян льна) — гордость Самарканда. Joni osh готовит только его; в Osh markazi №1 — на выбор зигир или с бараниной."}, {"name": "Самаркандский нон", "fact": "Лепёшка из тандыра (глиняной печи): тонкая в центре, пышная по краю. Легенда: бухарский эмир увёз пекаря, привозил муку и воду — не хватило «воздуха Самарканда». Везут в подарок по всей стране. Утром — горячий с каймаком (густыми сливками)."}, {"name": "Чалоп", "fact": "Холодный суп на кислом молоке с зеленью и огурцом — его подают к плову."}, {"name": "Нохат шурак", "fact": "Нут с мясом. В кафе Noxat (круглосуточно, 3 филиала) костный мозг «илик» подают отдельно на лягане (большом блюде), бульон — в косушке (миске)."}, {"name": "Халиса", "fact": "Одно из древнейших узбекских блюд: пшеница или перловка с мясом, луком и зирой часами томятся в казане на огне."}, {"name": "Манты «Мультён»", "fact": "Огромные домашние манты с бараниной, луком и курдюком у Облокул-бобо (ул. Агахи, 8)."}, {"name": "Сладости Сиаба", "fact": "Халва; нават — сахар, выращенный крупными кристаллами, к чаю; парварда — тягучие подушечки из сахара с мукой; урюк (сушёный абрикос с косточкой), кишмиш (мелкий изюм без косточек), миндаль. Пробовать можно, торговаться нужно."}], "train": {"out": "Ср 4 ноября: 778Ж «Jaloliddin Manguberdi», Ташкент-Северный 06:09 → Самарканд 08:23 (2 ч 14 мин). На 2 ноября 00:03 — 9 мест, только класс 1В, 709 000 сум. Все утренние «Афросиабы» (06:33, 07:30, 07:55, 08:30) распроданы. Запасной: 710Ф «Sharq» 08:37 → 11:46 (300 560 сум). Еды до ~09:45 не будет: купи с вечера перекус и воду в поезд. В составе Jaloliddin Manguberdi на фото Advantour/Orexca есть бистро, но работает ли оно на рейсе 06:09 — не проверено, не рассчитывай.", "back": "715Ф «Nasaf», Самарканд 20:24 → Ташкент-Северный 23:54 (33 места; 2В 200 060 / 1С 300 560 / 1В 566 450 сум). Запасной: 709Ф «Sharq» 19:23 → 23:06 (97 мест). 767Ф «Afrosiyob» 17:40 — последнее место, но уезжаешь до заката.", "tickets": "Официально: eticket.railway.uz (теперь перенаправляет на eticket.uzrailpass.uz), официальное приложение железной дороги или касса Ташкент-Северный. Нужен паспорт. Купить СЕГОДНЯ.", "note": "Лови возвраты: 777М 20:01 → 22:16, 765Ф 18:15, 763Ф 18:49 — места часто всплывают за день или за часы. Продажа на «Афросиаб» открывается за 60 дней. Из дома (Нукус 39) выезжать ~05:20, вокзал в ~2 км, на входе досмотр."}};

const AUDIO = {"sk_afrasiab": {"file": "audio/sk_afrasiab.mp3?v=f658157b", "duration": 83.5, "bytes": 500976}, "sk_aksaray": {"file": "audio/sk_aksaray.mp3?v=eb89fafe", "duration": 36.1, "bytes": 216864}, "sk_bibikhanym": {"file": "audio/sk_bibikhanym.mp3?v=155112c9", "duration": 103.6, "bytes": 621504}, "sk_bibitomb": {"file": "audio/sk_bibitomb.mp3?v=e52a9a58", "duration": 27.9, "bytes": 167328}, "sk_breakfast": {"file": "audio/sk_breakfast.mp3?v=a7af16d1", "duration": 52.7, "bytes": 316224}, "sk_chorsu": {"file": "audio/sk_chorsu.mp3?v=8c507afb", "duration": 37.8, "bytes": 227088}, "sk_daniel": {"file": "audio/sk_daniel.mp3?v=c3a1c691", "duration": 59.8, "bytes": 358992}, "sk_guremir": {"file": "audio/sk_guremir.mp3?v=fe5c9788", "duration": 99.4, "bytes": 596448}, "sk_h_age": {"file": "audio/sk_h_age.mp3?v=8a54c2c5", "duration": 68.4, "bytes": 410112}, "sk_h_babur": {"file": "audio/sk_h_babur.mp3?v=ba9315cb", "duration": 80.0, "bytes": 480096}, "sk_h_maracanda": {"file": "audio/sk_h_maracanda.mp3?v=dff0a9bb", "duration": 63.6, "bytes": 381888}, "sk_h_russia": {"file": "audio/sk_h_russia.mp3?v=c9122a49", "duration": 65.6, "bytes": 393696}, "sk_h_sogd": {"file": "audio/sk_h_sogd.mp3?v=85305dfb", "duration": 71.3, "bytes": 427824}, "sk_h_timur": {"file": "audio/sk_h_timur.mp3?v=437835cf", "duration": 63.1, "bytes": 378864}, "sk_h_ulugbek": {"file": "audio/sk_h_ulugbek.mp3?v=a0dda45b", "duration": 85.8, "bytes": 514800}, "sk_h_zarafshan": {"file": "audio/sk_h_zarafshan.mp3?v=112fb18b", "duration": 58.3, "bytes": 349776}, "sk_intro": {"file": "audio/sk_intro.mp3?v=376e5111", "duration": 54.1, "bytes": 324432}, "sk_khizr": {"file": "audio/sk_khizr.mp3?v=22ec6aab", "duration": 77.8, "bytes": 466992}, "sk_meros": {"file": "audio/sk_meros.mp3?v=4da5bb84", "duration": 91.6, "bytes": 549792}, "sk_observatory": {"file": "audio/sk_observatory.mp3?v=1d5fbb0a", "duration": 87.8, "bytes": 526608}, "sk_oshqand": {"file": "audio/sk_oshqand.mp3?v=f05986cc", "duration": 64.4, "bytes": 386496}, "sk_platan": {"file": "audio/sk_platan.mp3?v=9a1ae819", "duration": 51.6, "bytes": 309312}, "sk_registan": {"file": "audio/sk_registan.mp3?v=dacb221e", "duration": 103.6, "bytes": 621792}, "sk_registan_view": {"file": "audio/sk_registan_view.mp3?v=9d30ed97", "duration": 37.3, "bytes": 223632}, "sk_rukhabad": {"file": "audio/sk_rukhabad.mp3?v=f9a16c1d", "duration": 57.2, "bytes": 343296}, "sk_shahizinda": {"file": "audio/sk_shahizinda.mp3?v=0a1e5514", "duration": 101.2, "bytes": 607392}, "sk_siab": {"file": "audio/sk_siab.mp3?v=d6ed681a", "duration": 45.9, "bytes": 275472}, "sk_tashkent_st": {"file": "audio/sk_tashkent_st.mp3?v=1f4b8aa5", "duration": 27.5, "bytes": 165168}, "sk_university": {"file": "audio/sk_university.mp3?v=d519dfd4", "duration": 49.8, "bytes": 298800}};
const CFG = {"title": "Самарканд за день", "key": "samarkand", "public": true, "offline": true, "audioBase": "../audio/", "sw": "../sw.js", "links": "<a href=\"../tashkent/\">Ташкент пешком</a>"};

const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dayColor = id => css("--" + id) || css("--day1");
// Search the place name around its coordinates: Google opens the place card (reviews, photos, hours), not a bare pin.
const gmaps = s => s.gq ? `https://www.google.com/maps/search/${encodeURIComponent(s.gq)}/@${s.lat},${s.lon},17z` : `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MODE = { walk: "пешком", metro: "метро", taxi: "такси", train: "поезд" };
const DASH = { walk: null, metro: "1 9", taxi: "10 8", train: "1 9" };
const fmtKm = m => (m / 1000).toFixed(1).replace(".", ",");
const fmtT = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "";
const audioUrl = id => AUDIO[id] ? (CFG.audioBase || "") + AUDIO[id].file.replace(/^audio\//, "") : null;
const played = new Set(store.get("played", []));

const bounds = L.latLngBounds([BASE.south, BASE.west], [BASE.north, BASE.east]);
const wide = BASE_WIDE ? L.latLngBounds([BASE_WIDE.south, BASE_WIDE.west], [BASE_WIDE.north, BASE_WIDE.east]) : bounds;
const map = L.map("map", { maxBounds: wide.pad(0.3), minZoom: 11, maxZoom: 18, zoomSnap: 0.5 });
if (BASE_WIDE) L.imageOverlay("basemap-wide.jpg", wide).addTo(map);
L.imageOverlay(BASEMAP, bounds, { attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);

/* ---------- content ---------- */
const byId = {};
PLAN.days.forEach(d => d.stops.forEach((s, i) => { byId[s.id] = { s, day: d, i }; }));
function tags(s) {
  return (s.unesco ? '<span class="tag unesco">ЮНЕСКО</span>' : "") + (s.interactive ? '<span class="tag inter">интерактив</span>' : "") +
    (s.optional ? '<span class="tag">по желанию</span>' : s.extra ? '<span class="tag">доп.</span>' : "");
}
const playBtn = id => audioUrl(id) ? `<button class="play" data-play="${id}" aria-label="Слушать">▶</button>` : "";
function storyHtml(s, { short = false } = {}) {
  const out = [];
  if (s.hook) out.push(`<p class="hook">${esc(s.hook)}</p>`);
  if (s.order) out.push(`<div class="lbl">Что заказать</div><div>${esc(s.order)}</div>`);
  if (!short && s.facts?.length) out.push(`<div class="lbl">${s.kind === "history" ? "Коротко" : "Рассказать"}</div><ul>${s.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`);
  if (!short && s.look?.length) out.push(`<div class="lbl">Посмотри на</div><ul>${s.look.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`);
  if (s.food_near) out.push(`<div class="lbl">Поесть рядом</div><div>${esc(s.food_near)}</div>`);
  if (s.alt) out.push(`<div class="lbl">Вариант</div><div>${esc(s.alt)}</div>`);
  if (s.note) out.push(`<div class="warn">${esc(s.note)}</div>`);
  if (s.caution) out.push(`<div class="warn">⚠ ${esc(s.caution)}</div>`);
  if (s.approx && s.kind !== "history") out.push(`<div class="warn">Координата примерная.</div>`);
  if (s.kind !== "history") out.push(`<a href="${gmaps(s)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a>`);
  return out.join("");
}
function popupHtml(s) {
  const meta = [s.when, s.stay ? `~${s.stay} мин` : null, s.list ? `№${s.list} из списка` : null].filter(Boolean).join(" · ");
  return `${playBtn(s.id)}<b>${esc(s.name)}</b>${meta ? `<br><span style="color:#6e655a">${meta}</span>` : ""}<div style="margin-top:6px">${storyHtml(s, { short: true })}</div>`;
}
function pin(cls, text, color, size = 26) {
  return L.divIcon({ className: "", html: `<div class="pin ${cls}" style="${color ? `background:${color}` : ""}">${text}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
}

const foodPin = (s, size = 26) => pin(`fi ${s.ig || "meal"}${size < 26 ? " small" : ""}`, (s.ic || "🍽️") + (s.lg ? '<b class="lg">!</b>' : ""), null, size);
const foodBadge = (s, style = "") => `<span class="num fi ${s.ig || "meal"}" style="${style}">${s.ic || "🍽️"}${s.lg ? '<b class="lg">!</b>' : ""}</span>`;
const layers = {}, markers = {};
const FOODCAT = { cult: "Культовые места", dessert: "Десерты и сладости", bakery: "Пекарни и выпечка", fastfood: "Местный фастфуд", breakfast: "Завтраки", night: "Поздно вечером и ночью" };
const FOOD = (PLAN.food || []).filter(f => wide.contains([f.lat, f.lon]));
const foodNote = f => [f.why && `Почему: ${f.why}`, f.order && `Что взять: ${f.order}`, f.hours, f.caution && `⚠ ${f.caution}`].filter(Boolean).join("<br>");
const foodMarker = f => (markers[f.id] = L.marker([f.lat, f.lon], { icon: foodPin(f, 22), title: f.name, zIndexOffset: f.lg ? 0 : -200 })
  .bindPopup(`<b>${esc(f.name)}</b>${f.hook ? `<br><i>${esc(f.hook)}</i>` : ""}<br>${foodNote(f)}<br><a href="${gmaps(f)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a>`, { maxWidth: 300 }));
function drawDay(day) {
  const g = L.featureGroup(), color = dayColor(day.id);
  LEGS[day.id].forEach(l => {
    if (!l.coords || l.coords.length < 2) return;
    const ll = l.coords.map(([x, y]) => [y, x]);
    L.polyline(ll, { color: "#fff", weight: 8, opacity: 0.8, dashArray: DASH[l.mode] }).addTo(g);
    L.polyline(ll, { color, weight: 4.5, opacity: 0.95, dashArray: DASH[l.mode], lineCap: "round" }).addTo(g);
  });
  let n = 0;
  day.stops.forEach((s, i) => {
    if (s.kind === "home") return;
    const food = s.kind === "food", hist = s.kind === "history";
    if (!food && !hist) s._n = ++n;
    const icon = food ? foodPin(s) : hist ? pin("hist", "i", null, 20) : pin("", s._n, color);
    markers[s.id] = L.marker([s.lat, s.lon], { icon, title: s.name, riseOnHover: true, zIndexOffset: food && s.lg ? 50 : food || hist ? -100 : 0 }).bindPopup(popupHtml(s), { maxWidth: 300 }).addTo(g);
  });
  FOOD.filter(f => (f.near_days || {})[day.id]).forEach(f => foodMarker(f).addTo(g));
  layers[day.id] = g;
}
PLAN.days.forEach(drawDay);
const home = PLAN.home;
const homeMarker = home ? L.marker([home.lat, home.lon], { icon: pin("home", "⌂"), zIndexOffset: 1000, title: home.name }).bindPopup(`<b>${esc(home.name)}</b>`).addTo(map) : null;
const extras = (PLAN.evening || []).map(e => ({ ...e, _eve: true })).concat(PLAN.optional || []).filter(o => wide.contains([o.lat, o.lon]));
layers.extra = L.featureGroup(extras.map(o => {
  const m = L.marker([o.lat, o.lon], { icon: o._eve ? pin("eve", "♪", null, 22) : o.kind === "food" ? foodPin(o, 22) : pin("opt", "+", null, 18), title: o.name })
    .bindPopup(`${playBtn(o.id)}<b>${esc(o.name)}</b>${o.when ? `<br>${esc(o.when)}` : ""}<br>${esc(o.note || "")}<br><a href="${gmaps(o)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a>`, { maxWidth: 300 });
  markers[o.id] = m; return m;
}).concat(FOOD.filter(f => !Object.keys(f.near_days || {}).length).map(foodMarker)));

function panel() {
  let html = "";
  PLAN.days.forEach(day => {
    const legs = LEGS[day.id];
    const walk = legs.filter(l => l.mode === "walk").reduce((a, l) => a + (l.distance_m || 0), 0);
    const intro = `${day.id}_intro`;
    html += `<section class="day" data-day="${day.id}"><h2><span class="dot" style="background:${dayColor(day.id)}"></span>${esc(day.title)}</h2>
      <div class="meta">${esc(day.summary)}<br>Пешком ≈ ${fmtKm(walk)} км${PLAN.start ? ` · старт ${esc(PLAN.start)}` : ""}</div>
      ${audioUrl(intro) ? `<div class="intro"><button class="btn" data-play="${intro}">▶ Вступление</button></div>` : ""}<ol class="stops">`;
    const blockAt = Object.fromEntries((day.blocks || []).map((b, k) => [b.from, { ...b, n: k + 1 }]));
    day.stops.forEach((s, i) => {
      const blk = blockAt[s.id];
      if (blk) html += `<li class="block"><div class="bt">${blk.n}. ${esc(blk.title)}</div>${blk.summary ? `<div class="bs">${esc(blk.summary)}</div>` : ""}</li>`;
      if (i > 0) {
        const l = legs[i - 1];
        if (l && s.kind !== "history") html += `<li class="move">↓ ${MODE[l.mode] || l.mode}${l.distance_m ? ` · ${fmtKm(l.distance_m)} км, ~${Math.round(l.duration_s / 60)} мин` : ""}</li>`;
      }
      if (s.kind === "home") {
        html += `<li class="stop"><details data-key="home"><summary><span class="num" style="background:var(--fg)">⌂</span><div><div class="name">${esc(s.name)}</div>${s.note || s.when ? `<div class="sub">${esc(s.when || s.note)}</div>` : ""}</div></summary></details></li>`;
        return;
      }
      const food = s.kind === "food", hist = s.kind === "history";
      const sub = hist ? "минутка истории, пока идёшь" : [s.when, s.stay ? `~${s.stay} мин` : "", s.list ? `№${s.list} из списка` : ""].filter(Boolean).join(" · ");
      html += `<li class="stop ${hist ? "history" : ""} ${played.has(s.id) ? "played" : ""}" data-stop="${s.id}"><details data-key="${s.id}"><summary>
        ${food ? foodBadge(s) : `<span class="num ${hist ? "hist" : ""}" style="${hist ? "" : `background:${dayColor(day.id)}`}">${hist ? "i" : s._n}</span>`}
        <div><div class="name">${esc(s.name)}${tags(s)}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${playBtn(s.id)}</summary>
        <div class="body">${storyHtml(s)}</div></details></li>`;
      FOOD.filter(f => ((f.near_days || {})[day.id] || {}).stop === s.id).forEach(f => {
        const m = f.near_days[day.id].m, dist = m < 150 ? "рядом" : m < 1000 ? `${Math.round(m / 50) * 50} м` : `${(m / 1000).toFixed(1).replace(".", ",")} км`;
        html += `<li class="stop"><details data-key="${f.id}"><summary>${foodBadge(f, "opacity:.85")}<div><div class="name" style="font-weight:400">${esc(f.name)}</div><div class="sub">поесть · ${dist} · ${esc(FOODCAT[f.cat] || "")}</div></div></summary><div class="body">${f.hook ? `<p class="hook">${esc(f.hook)}</p>` : ""}${foodNote(f)}<br><a href="${gmaps(f)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a></div></details></li>`;
      });
    });
    html += "</ol></section>";
  });
  if (PLAN.train) {
    const t = PLAN.train;
    html += `<section class="day"><h2><span class="dot" style="background:var(--fg)"></span>Поезд</h2><div class="meta">${[t.out && `Туда: ${esc(t.out)}`, t.back && `Обратно: ${esc(t.back)}`, t.tickets && `Билеты: ${esc(t.tickets)}`, t.note && esc(t.note)].filter(Boolean).join("<br>")}</div></section>`;
  }
  if ((PLAN.evening || []).length) {
    html += `<section class="day extra"><h2><span class="dot" style="background:var(--fg)"></span>Вечером</h2><ol class="stops">`;
    PLAN.evening.forEach(e => {
      html += `<li class="stop"><details data-key="${e.id}"><summary><span class="num" style="background:var(--fg)">♪</span><div><div class="name">${esc(e.name)}</div><div class="sub">${esc(e.when || "")}</div></div>${playBtn(e.id)}</summary><div class="body"><div>${esc(e.note || "")}</div><a href="${gmaps(e)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a></div></details></li>`;
    });
    html += `</ol></section>`;
  }
  if ((PLAN.optional || []).length) {
    html += `<section class="day extra"><h2><span class="dot" style="background:var(--opt)"></span>Если останется время</h2><ol class="stops">`;
    PLAN.optional.forEach(o => {
      const food = o.kind === "food";
      html += `<li class="stop"><details data-key="${o.id}"><summary>${food ? foodBadge(o) : `<span class="num" style="background:var(--opt)">+</span>`}<div><div class="name">${esc(o.name)}${tags(o)}</div>${o.list ? `<div class="sub">№${o.list} из списка</div>` : ""}</div></summary><div class="body">${o.note ? `<div>${esc(o.note)}</div>` : ""}<a href="${gmaps(o)}" target="_blank" rel="noopener">${wide.contains([o.lat, o.lon]) ? "Google Maps: отзывы и фото" : "За городом — Google Maps: отзывы и фото"}</a></div></details></li>`;
    });
    html += `</ol></section>`;
  }
  if ((PLAN.food || []).length) {
    html += `<section class="day extra"><h2><span class="dot" style="background:var(--food)"></span>Где поесть</h2>`;
    Object.entries(FOODCAT).forEach(([cat, label]) => {
      const items = PLAN.food.filter(f => (f.cat || "cult") === cat); if (!items.length) return;
      html += `<div class="meta" style="margin-top:8px">${label}</div><ol class="stops">`;
      items.forEach(f => {
        const near = f.near && byId[f.near] ? `рядом: ${byId[f.near].s.name}` : "";
        html += `<li class="stop"><details data-key="${f.id}"><summary>${foodBadge(f)}<div><div class="name">${esc(f.name)}</div>${near ? `<div class="sub">${esc(near)}</div>` : ""}</div></summary><div class="body">${f.hook ? `<p class="hook">${esc(f.hook)}</p>` : ""}${f.why ? `<div class="lbl">Почему сюда</div><div>${esc(f.why)}</div>` : ""}${f.order ? `<div class="lbl">Что взять</div><div>${esc(f.order)}</div>` : ""}${f.hours ? `<div class="warn">${esc(f.hours)}</div>` : ""}${f.caution ? `<div class="warn">⚠ ${esc(f.caution)}</div>` : ""}${f.approx ? `<div class="warn">Координата примерная.</div>` : ""}<a href="${gmaps(f)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a></div></details></li>`;
      });
      html += `</ol>`;
    });
    html += `</section>`;
  }
  if ((PLAN.dishes || []).length || (PLAN.desserts || []).length) {
    html += `<section class="day"><h2><span class="dot" style="background:var(--food)"></span>Что попробовать</h2><ul class="dishes">
      ${(PLAN.dishes || []).concat(PLAN.desserts || []).map(d => `<li><b>${esc(d.name)}.</b> ${esc(d.fact)}</li>`).join("")}</ul></section>`;
  }
  const mb = Object.values(AUDIO).reduce((a, t) => a + (t.bytes || 0), 0) / 1e6;
  html += `<div class="legend">
      <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="3"/></svg>пешком</span>
      <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round"/></svg>метро</span>
      <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="3" stroke-dasharray="7 5"/></svg>такси</span>
      <span><span class="num fi meal" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">🍜</span>еда</span>
      <span><span class="num fi dessert" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">🍦</span>десерты</span>
      <span><span class="num fi fast" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">🌯</span>фастфуд</span>
      <span><span class="num fi meal" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:6px">🍚<b class="lg">!</b></span>легендарное — не пропусти</span>
      <span><span class="num fi drink" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">☕</span>кофе, чай</span>
      <span><span class="num hist" style="display:inline-block;width:14px;height:14px;line-height:14px;font-size:10px;vertical-align:middle;margin-right:4px">i</span>минутка истории</span>
    </div>
    <div class="tools">${CFG.offline ? `<button class="btn" id="dl">Скачать аудио для офлайна${mb ? ` (${Math.round(mb)} МБ)` : ""}</button>` : ""}<button class="btn" id="reset">Сбросить «прослушано»</button></div>
    <p class="note" id="dlnote"></p>
    <p class="note">Нажми на точку — раскроется история, ▶ — включит рассказ. Кнопка ◎ на карте показывает, где ты, и подсказывает, когда ты рядом с точкой.${CFG.links ? " " + CFG.links : ""}</p>`;
  document.getElementById("panel").innerHTML = html;
}
panel();

/* ---------- audio player ---------- */
const audio = new Audio();
audio.preload = "none";
let current = null;
const $ = id => document.getElementById(id);
function nextAfter(id) {
  const ref = byId[id]; if (!ref) return null;
  return ref.day.stops.slice(ref.i + 1).find(s => audioUrl(s.id)) || null;
}
function titleOf(id) {
  if (byId[id]) return byId[id].s.name;
  const d = PLAN.days.find(d => `${d.id}_intro` === id); if (d) return `Вступление · ${d.title}`;
  const e = (PLAN.evening || []).find(e => e.id === id); return e ? e.name : id;
}
function play(id) {
  const url = audioUrl(id); if (!url) return;
  if (current === id) { audio.paused ? audio.play() : audio.pause(); return; }
  current = id; audio.src = url; audio.play().catch(() => {});
  $("player").hidden = false; $("ptitle").textContent = titleOf(id);
  const nx = nextAfter(id); $("phint").textContent = nx ? `Дальше: ${nx.name}` : "";
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: titleOf(id), artist: CFG.title || "Аудиогид", album: byId[id]?.day.title || "" });
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("nexttrack", () => { const n = nextAfter(current); n && play(n.id); });
  }
  map.invalidateSize();
}
function syncButtons() {
  document.querySelectorAll("[data-play]").forEach(b => { const on = b.dataset.play === current && !audio.paused; b.classList.toggle("on", on); if (b.classList.contains("btn")) return; b.textContent = on ? "❚❚" : "▶"; });
  $("pp").textContent = audio.paused ? "▶" : "❚❚";
  $("pp").setAttribute("aria-label", audio.paused ? "Играть" : "Пауза");
}
audio.addEventListener("play", syncButtons);
audio.addEventListener("pause", syncButtons);
audio.addEventListener("timeupdate", () => {
  if (audio.duration) { $("pseek").value = (audio.currentTime / audio.duration) * 100; $("ptime").textContent = `${fmtT(audio.currentTime)} / ${fmtT(audio.duration)}`; }
});
audio.addEventListener("ended", () => {
  played.add(current); store.set("played", [...played]);
  document.querySelector(`[data-stop="${current}"]`)?.classList.add("played");
  const nx = nextAfter(current); $("phint").textContent = nx ? `Готово. Дальше: ${nx.name} — нажми ⏭, когда дойдёшь` : "Готово.";
  syncButtons();
});
$("pp").addEventListener("click", () => current && (audio.paused ? audio.play() : audio.pause()));
$("pnext").addEventListener("click", () => { const n = nextAfter(current); n && play(n.id); });
$("pseek").addEventListener("input", e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-play]"); if (!b) return;
  e.preventDefault(); e.stopPropagation(); play(b.dataset.play);
}, true);
$("reset")?.addEventListener("click", () => { played.clear(); store.set("played", []); document.querySelectorAll(".played").forEach(x => x.classList.remove("played")); });

/* ---------- offline ---------- */
if (CFG.offline && "serviceWorker" in navigator) navigator.serviceWorker.register(CFG.sw || "../sw.js").catch(() => {});
$("dl")?.addEventListener("click", async () => {
  const note = $("dlnote");
  if (!("caches" in window)) { note.textContent = "Этот браузер не умеет сохранять для офлайна."; return; }
  const urls = Object.keys(AUDIO).map(audioUrl);
  const cache = await caches.open("audio-v1");
  let done = 0;
  for (const u of urls) {
    try { if (!(await cache.match(u))) await cache.add(u); } catch (_) {}
    note.textContent = `Сохранено ${++done} из ${urls.length}…`;
  }
  note.textContent = `Готово: ${done} треков сохранены, рассказы будут играть без интернета.`;
});

/* ---------- geolocation ---------- */
let meMarker = null, meCircle = null, watchId = null, firstFix = true;
const dismissed = new Set();
const Locate = L.Control.extend({ options: { position: "topleft" }, onAdd() {
  const b = L.DomUtil.create("button", "locate leaflet-bar"); b.id = "locate"; b.title = "Где я"; b.setAttribute("aria-label", "Показать, где я"); b.textContent = "◎";
  L.DomEvent.on(b, "click", e => { L.DomEvent.stop(e); toggleLocate(); }); return b; } });
map.addControl(new Locate());
function toggleLocate() {
  const b = $("locate");
  if (watchId !== null) { if (meMarker) map.flyTo(meMarker.getLatLng(), Math.max(map.getZoom(), 16)); return; }
  if (!("geolocation" in navigator)) { hint("Геолокация недоступна в этом браузере."); return; }
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    hint(err.code === 1 ? "Нет доступа к геолокации: разреши её для сайта в настройках браузера." : "Не удалось определить местоположение.");
    navigator.geolocation.clearWatch(watchId); watchId = null; b.classList.remove("on");
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  b.classList.add("on");
}
function hint(text, playId) {
  $("player").hidden = false;
  if (!current) { $("ptitle").textContent = text; $("phint").textContent = ""; }
  else $("phint").textContent = text;
  if (playId) { $("phint").innerHTML = `${esc(text)} <button class="btn" data-play="${playId}" style="padding:2px 10px;margin-left:6px">▶ Слушать</button>`; }
  map.invalidateSize();
}
function onPos(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  if (!meMarker) {
    meCircle = L.circle(ll, { radius: p.coords.accuracy, color: "#1a73e8", weight: 1, fillOpacity: 0.08 }).addTo(map);
    meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000, interactive: false }).addTo(map);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(p.coords.accuracy); }
  if (firstFix) { firstFix = false; map.flyTo(ll, 16); }
  const here = L.latLng(ll);
  let best = null, bestD = Infinity;
  PLAN.days.forEach(d => { if (!map.hasLayer(layers[d.id])) return; d.stops.forEach(s => {
    if (s.kind === "home" || !audioUrl(s.id) || played.has(s.id) || dismissed.has(s.id) || s.id === current) return;
    const dist = here.distanceTo([s.lat, s.lon]); if (dist < bestD) { bestD = dist; best = s; } }); });
  const radius = best && best.kind === "history" ? 80 : 60;
  if (best && bestD <= Math.max(radius, Math.min(p.coords.accuracy, 120))) {
    dismissed.add(best.id);
    hint(`Ты рядом: ${best.name}`, best.id);
    if (navigator.vibrate) navigator.vibrate(120);
  }
}

/* ---------- tabs & focus ---------- */
document.getElementById("panel").addEventListener("toggle", e => {
  const d = e.target; if (!d.open || !d.dataset) return;
  const key = d.dataset.key;
  if (key === "home") { homeMarker && map.flyTo(homeMarker.getLatLng(), 16); return; }
  const m = markers[key]; if (!m) return;
  const ref = byId[key];
  if (ref && !map.hasLayer(layers[ref.day.id])) show(ref.day.id, false);
  map.flyTo(m.getLatLng(), 17);
}, true);

const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = (PLAN.days.length > 1 ? `<button data-show="all" aria-pressed="true">Всё</button>` : "") +
  PLAN.days.map(d => `<button data-show="${d.id}" aria-pressed="false"><span class="dot" style="background:${dayColor(d.id)}"></span>${esc(d.short)}</button>`).join("");
function show(which, fit = true) {
  PLAN.days.forEach(d => {
    const on = which === "all" || which === d.id;
    on ? layers[d.id].addTo(map) : layers[d.id].remove();
    document.querySelector(`section[data-day="${d.id}"]`).hidden = !on;
  });
  which === "all" ? layers.extra.addTo(map) : layers.extra.remove();
  document.querySelectorAll("section.extra").forEach(sec => { sec.hidden = which !== "all" && PLAN.days.length > 1; });
  tabsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.show === which)));
  if (fit) {
    const fg = which === "all" ? L.featureGroup(PLAN.days.map(d => layers[d.id])) : layers[which];
    const bb = fg.getBounds(); if (homeMarker) bb.extend(homeMarker.getLatLng());
    map.fitBounds(bb, { padding: [24, 24] });
  }
  store.set(CFG.key + "-tab", which);
}
tabsEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => show(b.dataset.show)));
let start = store.get(CFG.key + "-tab", PLAN.days.length > 1 ? "all" : PLAN.days[0].id);
const hashDay = location.hash.slice(1);
if (layers[hashDay]) start = hashDay;
if (start !== "all" && !layers[start]) start = PLAN.days.length > 1 ? "all" : PLAN.days[0].id;
show(start);
</script>
</body></html>
