 хаким (правитель).", "С конца XVI века до 1723 года городом владело Казахское ханство, затем — время нашествий джунгар, кочевого народа.", "В 1784 году Юнус-ходжа, сын хакима Шейхантаура, победил соперников в бою у канала Бозсу (место прозвали Джангоб, «ручей битвы») и объединил город.", "Независимое Ташкентское владение просуществовало до 1808 года, когда город занял Коканд — ханство из Ферганской долины."], "kind": "history", "approx": true, "move": "walk", "lon": 69.253388, "lat": 41.309702}, {"id": "sheikhantaur", "name": "Шейхантаур и мавзолей Калдыргачбия", "lat": 41.32288, "lon": 69.25897, "kind": "sight", "move": "taxi", "stay": 25, "hook": "Внутри мавзолея Шейхантаур стоит высохший ствол до самого купола — по легенде смотрителя, это последнее дерево, посаженное воинами Александра Македонского.", "facts": ["Шейх Ховенди ат-Тахур — суфий (мусульманский мистик) XIV века, его имя носит весь район. Нынешний мавзолей — конец XVIII века.", "Калдыргачбий — «хозяин ласточки»: так прозвали казахского бия (родового правителя) Толе би, правившего Ташкентом в 1743–1749 годах. При нашествии джунгар он не ушёл из дома, потому что под порогом свила гнездо ласточка, и тронутый этим джунгарский командир его пощадил.", "Рядом мавзолей Юнус-хана (1415–1487) — правителя Ташкента XV века и деда Бабура, основателя империи Великих Моголов."], "caution": "Комплекс на территории Исламского университета, часы не найдены.", "when": "ближе к вечеру", "gq": "Sheikhantaur Mausoleum"}, {"id": "h_showcase", "day": "day2", "after": "sheikhantaur", "name": "Минутка истории: Витрина Востока", "hook": "В январе 1966 года на Ташкент смотрел весь мир: здесь при посредничестве СССР мирили Индию и Пакистан после войны 1965 года.", "facts": ["10 января 1966 года премьер-министр Индии Лал Бахадур Шастри и президент Пакистана Айюб Хан при посредничестве советского премьера Алексея Косыгина подписали Ташкентскую декларацию, подведшую черту под войной 1965 года.", "11 января 1966 года Шастри умер в Ташкенте (официально — сердечный приступ); в городе есть улица и памятник Шастри.", "Советский Ташкент задумывали как витрину для Азии и Африки: кинофестиваль стран Азии и Африки прошёл впервые в 1958 году, регулярно — с 1968-го; с 1976 года — и Латинской Америки; до 1988 года.", "В 2021 году фестиваль возрождён под названием «Жемчужина Шёлкового пути»."], "kind": "history", "approx": true, "move": "walk", "lon": 69.259785, "lat": 41.324765}, {"id": "anhor_wheel", "name": "Колесо «Звезда Анхора» — Ташкент сверху, по желанию", "lat": 41.32486, "lon": 69.26601, "kind": "sight", "optional": true, "interactive": true, "move": "walk", "stay": 30, "hook": "72 метра над каналом Анхор: в закрытой кабине видно весь центр, Анхор и башни Tashkent City.", "facts": ["Открыто 22 декабря 2018 года в парке «Анхор-Локомотив»: 72 м, 48 закрытых кабин (8 VIP), оборот около 12 минут (Afisha, 2018). Ночью колесо переливается разными цветами.", "Билет в 2023 году — около 20 000 сум, VIP — около 30 000; часы 10:00–23:00 по справочникам, цены 2026 года не подтверждены."], "look": ["Башни Tashkent City на закате — туда идём дальше."], "caution": "В ноябре аттракционы могут работать по сокращённому графику. Крюк ~1,3 км туда и обратно от Шейхантаура.", "gq": "Anhor Lokomotiv Park Ferris wheel Tashkent"}, {"id": "panorama", "name": "Дворец кино «Панорама» (снаружи)", "lat": 41.31944, "lon": 69.25959, "kind": "sight", "extra": true, "unesco": true, "move": "walk", "stay": 10, "hook": "Дворец кино «Панорама» — бетонный цилиндр из вертикальных колец — пережил землетрясение 1966 года без единой трещины.", "facts": ["1964 год; самый большой панорамный экран Средней Азии на 2 300 мест. В списке ЮНЕСКО с 2026 года."], "gq": "Panorama cinema palace"}, {"id": "h_new_uzbekistan", "day": "day2", "after": "panorama", "name": "Минутка истории: Новый Узбекистан", "hook": "После смерти первого президента Ислама Каримова в 2016 году страна за десять лет отпустила курс национальной валюты, сума, отменила визы и избавила хлопок от принудительного труда.", "facts": ["Ислам Каримов, правивший с 1991 года, умер в 2016 году (смерть объявлена 2 сентября); 4 декабря 2016 года президентом избран Шавкат Мирзиёев.", "5 сентября 2017 года — либерализация валюты: сум стал свободно обмениваемым, официальный курс — с 4210 до 8100 сумов за доллар, исчез чёрный рынок валюты.", "2018–2019 — безвизовый режим для граждан десятков стран; 2019 — закрыта печально известная тюрьма Жаслык.", "2022 — Международная организация труда (МОТ) признала хлопок свободным от системного детского и принудительного труда (раньше на сбор сгоняли студентов, учителей, врачей); мировые бренды сняли бойкот."], "kind": "history", "approx": true, "move": "walk", "lon": 69.259934, "lat": 41.31691}, {"id": "pakhtakor", "name": "Стадион «Пахтакор» (снаружи)", "lat": 41.31555, "lon": 69.25888, "kind": "sight", "extra": true, "move": "walk", "stay": 5, "hook": "Главный стадион Ташкента с 1956 года; «Пахтакор» значит «хлопкороб».", "facts": ["Открыт 11 августа 1956 года, архитектор Митхат Булатов; на открытии больше 50 тысяч зрителей, сейчас около 35 тысяч мест.", "11 августа 1979 года 17 членов команды погибли в столкновении самолётов над Днепродзержинском; у стадиона — памятник «Пахтакор-79».", "Полтора года был закрыт; снова открыт в феврале 2026. Ближайший домашний матч — вс 8 ноября, 18:15, против «Коканда»."], "look": ["Памятник «Пахтакору-79» у стадиона."], "gq": "Pakhtakor Central Stadium"}, {"id": "conservatory", "name": "Консерватория (снаружи) — колоннада и балконы музыкантов", "lat": 41.31424, "lon": 69.25529, "kind": "sight", "extra": true, "move": "walk", "stay": 5, "hook": "На открытых балконах консерватории часто репетируют музыканты — иногда концерт слышно прямо с улицы.", "facts": ["Новое здание — 2002 год, проект института «Ташгипрогор»: полукруглый навес на колоннах, большие боковые балконы, концертный зал в цилиндре с колоннадой; внутри четыре зала, один органный (tashkent.uz)."], "look": ["Балконы — прислушайся, не играет ли кто."], "gq": "State Conservatory of Uzbekistan Tashkent"}, {"id": "tc_towers", "name": "Tashkent City: небоскрёбы, Nest One и бульвар", "lat": 41.3121, "lon": 69.2515, "kind": "sight", "extra": true, "move": "walk", "stay": 30, "hook": "Самый «стеклянный» кусок Ташкента: на месте снесённых махаллей — старых соседских кварталов — за несколько лет вырос деловой квартал с небоскрёбами.", "facts": ["Nest One — самое высокое здание Узбекистана; рядом Hilton, Tashkent City Mall и бульвар-променад между семиэтажными домами с кафе и ресторанами.", "Проект Tashkent City занимает 80 гектаров; что было здесь до стройки — у озера в парке (следующая точка)."], "look": ["Вечернюю подсветку башен с бульвара."], "when": "вечер, подсветка", "gq": "Nest One Tashkent"}, {"id": "tcity", "name": "Парк Tashkent City — фонтан и огни", "lat": 41.3165, "lon": 69.2484, "kind": "sight", "move": "walk", "stay": 40, "hook": "Под озером и небоскрёбами Tashkent City лежат две снесённые махалли — старые соседские кварталы Укчи и Олмазор.", "facts": ["Расселение с 2015 года, стройка с 2017-го: 521 домовладение, жителям предложили квартиры в 7–8 км. Снесли и Республиканский Дом кино 1982 года, и Дворец пионеров.", "Парк открыт в 2019-м: озеро и музыкальный фонтан длиной 200 метров (шоу ~18:30, 19:30, 20:30, 21:30 — в ноябре может отличаться).", "Внутри стеклянного квартала уцелели мечеть Орифжонбой начала XX века и мавзолей династии Эшонзода."], "look": ["Старую мечеть посреди стекла."], "food_near": "Afsona (Tashkent City, в 300 м): тыквенные манты, ханум; английское меню.", "caution": "Сезон фонтанов в Ташкенте открывается 1 мая и обычно идёт до осени — в начале ноября шоу, скорее всего, уже нет. Проверь на месте.", "when": "вечер", "gq": "Tashkent City Park"}, {"id": "h_cotton", "day": "day2", "after": "tcity", "name": "В пути: Хлопок на гербе", "hook": "Почему на гербе Узбекистана рядом с пшеницей — ветки хлопка, и как Туркестан стал хлопковой базой империи.", "facts": ["Герб Узбекистана (1992): птица Хумо в венке — справа колосья пшеницы, слева ветки хлопка с раскрытыми коробочками; хлопок был и на гербе Узбекской ССР.", "При генерал-губернаторе Кауфмане агрономов посылали в Америку за семенами американского хлопчатника; в Ташкенте устроили опытную ферму.", "Волокна из американских семян: 10 тысяч пудов в 1884 году — около 4 миллионов в 1898–1899 годах (пуд — 16 кг).", "К 1914 году Средняя Азия давала, по разным оценкам, от 43–58% до более чем половины хлопка российских фабрик."], "kind": "history", "approx": true, "move": "walk", "lon": 69.247556, "lat": 41.310071}, {"id": "seoulmun", "name": "Набережная Seoul Mun — фонтаны над каналом Бурджар", "lat": 41.29873, "lon": 69.24549, "kind": "sight", "move": "walk", "stay": 30, "hook": "«Seoul Mun» значит «Сеульские ворота»: набережная канала Бурджар на улице, которую переименовали в Сеульскую в честь дружбы с Кореей.", "facts": ["Строили с 2021 года, открыли в июне 2023-го: около 650 м вдоль канала Бурджар, кафе и магазины в три яруса, маяк высотой около 30 м с лифтом — символ проекта, мосты через канал (Afisha 22.09.2023, Spot 06.03.2024).", "Цветомузыкальные фонтаны тянутся по обе стороны канала; напротив — деревянные ступени-трибуны в четыре ряда. Шоу ежедневно 17:00–22:15 (WE Project, 14.09.2026); в программе есть и корейские треки."], "look": ["Лифт-маяк на пристани.", "Фонтаны с трибун напротив."], "caution": "Сезон фонтанов в 2025 году закончился к концу ноября; в начале ноября 2026 шоу может уже не идти. Подсветка набережной, маяка и мостов работает и без фонтанов.", "when": "вечер, после Tashkent City", "gq": "Seoul Mun Tashkent"}, {"id": "home2b", "name": "Финиш", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "move": "taxi", "note": "~5 км от Seoul Mun — такси, ~10 мин"}]}, {"id": "day3", "title": "Часть 2B — Храмы, север и закат на телебашне", "short": "2B · север и закат", "date": "2026-11-05", "color": "#6b4fa0", "summary": "Успенский собор → самса на Мирабадском базаре → паровозы → костёл → Алайский базар → «Мужество» → самса у Минора → мечеть Минор → Японский сад → мемориал Шахидлар → плов в Besh Qozon → закат на телебашне → ужин на гастроулице Шевченко.", "blocks": [{"title": "Собор и паровозы", "from": "uspensky", "summary": "Православный собор, завтрак на Мирабадском базаре, вокзальная площадь, сталинский ДКЖ и музей паровозов под открытым небом."}, {"title": "Костёл и Алайский базар", "from": "kostel", "summary": "Неоготический «польский» костёл, листопад в парке Бабура, лютеранская кирха 1899 года и базар на стыке двух городов."}, {"title": "Землетрясение 1966 года", "from": "courage", "summary": "Монумент «Мужество» и рассказ о том, как Ташкент отстроили заново."}, {"title": "Вдоль Анхора", "from": "minor_somsa", "summary": "Эталонная самса, белая мечеть Минор над каналом, по желанию гондола по Анхору и Японский сад."}, {"title": "Память и плов", "from": "shahidlar", "summary": "Мемориал жертв репрессий и главный плов-центр города."}, {"title": "Телебашня на закате", "from": "tvtower", "summary": "Смотровая на 97 метрах — весь Ташкент в закатном свете."}, {"title": "Ужин на Шевченко", "from": "shevchenko", "summary": "Гастроулица с ночной жизнью и прогулка домой."}], "stops": [{"id": "home3", "name": "Старт", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "when": "~11:00"}, {"id": "h_faiths", "day": "day3", "after": "home3", "name": "В пути: Церкви в мусульманском городе", "hook": "Утром у нас православный собор и католический костёл: откуда в Ташкенте церкви и что с ними стало.", "facts": ["Туркестанская православная епархия учреждена в 1871 году с кафедрой в городе Верном (ныне Алматы); перенос кафедры в Ташкент утверждён в декабре 1916 года.", "Лютеранская кирха (архитектор А. Л. Бенуа, освящена в конце 1890-х): закрыта в 1937-м, склад, с 1977 года — органный зал консерватории, в 1993-м возвращена общине.", "Католиков в Туркестане к 1917 году было, по распространённой оценке, около 11 тысяч: поляки, литовцы, немцы, чехи.", "В советские годы почти все храмы закрыли: Успенский собор был санитарным складом, костёл — складом, общежитием и больницей."], "kind": "history", "approx": true, "move": "walk", "lon": 69.276797, "lat": 41.291193}, {"id": "uspensky", "name": "Свято-Успенский собор", "lat": 41.2908, "lon": 69.2788, "kind": "sight", "extra": true, "move": "walk", "stay": 20, "hook": "Собор вырос из церкви святого Пантелеимона — целителя: её поставили при военном госпитале, устроенном здесь во время туркестанских походов — завоевания края Россией в 1860-х.", "facts": ["Первую церковь освятили в 1871 году; улица называлась Госпитальной. Генерал-губернатор Кауфман дал на церковь 3 000 рублей, колокольню в основном оплатил купец Дмитрий Захо.", "С 1933 года храм был санитарным складом Среднеазиатского военного округа; в декабре 1945-го его вернули верующим и освятили в честь Успения.", "В 1996 году здесь служил патриарх Алексий II; в 2010-м поставили новую колокольню."], "caution": "~8:00–19:00, вход свободный, дресс-код.", "gq": "Holy Assumption Cathedral Tashkent"}, {"id": "mirabad_bazaar", "name": "Мирабадский базар — самса и горячая лепёшка", "lat": 41.2911, "lon": 69.2765, "kind": "food", "move": "walk", "stay": 30, "approx": true, "when": "через ~45 мин после выхода", "order": "Самса из тандыра (с мясом, иногда с тыквой) и горячая лепёшка-нон; к ним чай. Наличные.", "hook": "Мирабадский базар — рынок старого «русского» района Ташкента, в двух шагах от собора: здесь завтракают тем же, чем весь город, — самсой прямо из тандыра.", "facts": ["Тандыр — глиняная печь-кувшин: самсу лепят прямо на её раскалённую внутреннюю стенку, поэтому низ хрустит, а курдюк делает начинку сочной.", "Узор в центре лепёшки ставят чекичем — штампом с иглами, чтобы середина не вздувалась. Лепёшку ломают руками, а не режут."], "caution": "Конкретные лавки не проверены — бери там, где очередь и тандыр топится прямо при тебе.", "legend": false, "gq": "Mirabad Bazaar", "ic": "🥧", "ig": "meal"}, {"id": "h_railway", "day": "day3", "after": "mirabad_bazaar", "name": "Минутка истории: Железная дорога приходит в Ташкент", "hook": "Железную дорогу от Каспийского моря до Ташкента строили почти двадцать лет, и с ней край изменился навсегда.", "facts": ["Закаспийскую железную дорогу — от берега Каспия вглубь Средней Азии — начали строить в ноябре 1880 года; в мае 1888 года открыто движение до Самарканда.", "В 1899 году от станции Урсатьевская (ныне Хаваст) проложили ветки на Ташкент и Андижан; движение Ташкент — Красноводск (порт на Каспии, оттуда паромом в Баку) официально открыто 1 мая 1899 года; в том же году построен ташкентский вокзал.", "В январе 1906 года открыта прямая дорога Оренбург — Ташкент.", "Управление Среднеазиатской железной дороги разместилось в Ташкенте."], "kind": "history", "approx": true, "move": "walk", "lon": 69.283537, "lat": 41.291211}, {"id": "tash_station", "name": "Центральный вокзал «Ташкент» — площадь", "lat": 41.29122, "lon": 69.28685, "kind": "sight", "extra": true, "move": "walk", "stay": 5, "hook": "Первый вокзал 1898 года был с куполом, а над входом в 1905-м повесили первые в городе уличные часы.", "facts": ["Первое здание — 1898, архитектор Георгий Сваричевский. Новое модернистское — 1961, проект Евгения Сепетого: ленточные окна, консольные козырьки, бирюзовая керамика. Путевой корпус 1967–1971 — брутализм, мотивы которого потом повторила «Панорама».", "Честно: «оригинальный облик утрачен в ходе перестроек 2006 и 2010-х годов» (ru.wikipedia) — сейчас это скорее площадь и история."], "gq": "Tashkent railway station"}, {"id": "dkzh", "name": "Дворец культуры железнодорожников (1938)", "lat": 41.29539, "lon": 69.28636, "kind": "sight", "extra": true, "move": "walk", "stay": 3, "hook": "Сталинский дворец 1938 года, к которому относятся и парк железнодорожников, и музей паровозов.", "facts": ["Проект А. И. Павлова, 1938 год; реконструкция 1979–1980, В. И. Пискарёв (ru.wikipedia)."], "look": ["Колоннаду фасада."], "gq": "Дворец культуры железнодорожников Ташкент"}, {"id": "railway", "name": "Музей железнодорожной техники — паровозы", "lat": 41.29592, "lon": 69.29117, "kind": "sight", "extra": true, "interactive": true, "move": "walk", "stay": 50, "hook": "В Музее железнодорожной техники под открытым небом — 13 паровозов, и почти в каждую кабину машиниста можно залезть.", "facts": ["Открыт в 1989 году к 100-летию Среднеазиатской железной дороги: 13 паровозов, 17 тепловозов, 3 электровоза, вагоны.", "Паровоз «Овечка» попал на марку Узбекистана 1999 года; есть немецкий военный ТЭ-52 и двухэтажный вагон 1965 года со смотровым куполом."], "caution": "9:00–18:00, обед 13–14; понедельник выходной. Во вторник закрыт вагон-музей, площадка открыта.", "gq": "Tashkent Museum of Railway Techniques"}, {"id": "h_pow", "day": "day3", "after": "railway", "name": "В пути: Пленные Первой мировой", "hook": "Костёл, к которому ты идёшь, помогали строить пленные австро-венгерские солдаты — их в Туркестане были десятки тысяч.", "facts": ["В Первую мировую в Туркестан отправили, по разным оценкам, от 90 до 200 тысяч военнопленных, почти все из Австро-Венгрии; лагерей в крае было больше тридцати, один из крупных — Троицкий под Ташкентом.", "В лагерях свирепствовали тиф, малярия и холера; офицеров селили и в городе (например, в доме Половцова).", "1 мая 1918 года Ташкентский совет освободил пленных; многие ушли в Красную армию «интернационалистами» — в начале Гражданской войны бывшие пленные, в основном венгры, составляли около половины красных войск Туркестана."], "kind": "history", "approx": true, "move": "walk", "lon": 69.290308, "lat": 41.299448}, {"id": "kostel", "name": "Католический костёл Святейшего Сердца", "lat": 41.30554, "lon": 69.29596, "kind": "sight", "extra": true, "move": "walk", "stay": 30, "hook": "Этот неоготический католический храм — «польский костёл» — строили 88 лет: с 1912 по 2000 год.", "facts": ["Деньги собирал литовский священник Юстинас Пранайтис, опекавший католиков Туркестана, проект — поляк Людвик Панчакевич. Строили солдаты-католики царской армии и военнопленные Первой мировой из лагеря под Ташкентом.", "Недостроенный храм советская власть отобрала в 1924 году: склад, общежитие, больница. Отец Иосиф Совинский тайно служил мессы до 1937 года — потом его арестовали и расстреляли.", "В 1992-м храм вернули католикам, освятили в 2000-м. Орган подарили прихожане из Бонна — здесь впервые в Узбекистане прозвучал «Мессия» Генделя."], "look": ["Витражи — лучше ближе к вечеру."], "caution": "Понедельник — закрыт для посетителей. Плечи и колени закрыты.", "gq": "Sacred Heart Cathedral Tashkent"}, {"id": "babur_park", "name": "Эко-парк им. Бабура — листопадом к кирхе", "lat": 41.30982, "lon": 69.29562, "kind": "sight", "extra": true, "move": "walk", "stay": 5, "hook": "Парк на месте старого ташкентского зоопарка — в начале ноября здесь разгар листопада.", "facts": ["12 га, открыт 10 июня 2017 года на месте зоопарка, переехавшего в 1990-х (UzDaily); вход бесплатный, аттракционов нет."], "gq": "Bobur Eco Park Tashkent"}, {"id": "kirha", "name": "Лютеранская кирха (1899, Бенуа)", "lat": 41.31089, "lon": 69.2924, "kind": "sight", "extra": true, "move": "walk", "stay": 10, "hook": "Красная кирпичная неоготика посреди Ташкента: кирха 1899 года, которую в советское время сделали складом, а потом оперной студией.", "facts": ["Первая служба — 3 октября 1899 года, проект А. Л. Бенуа (orexca). В советское время склад, с конца 1970-х — оперная студия консерватории, после независимости храм вернули лютеранской общине.", "Службы на русском и немецком — отсюда «немецкая кирха»."], "look": ["Стрельчатые окна и кирпичный декор — сравни с костёлом, который только что видел."], "caution": "По OSM открыта ежедневно 9:00–13:00 (не проверено, тел. +998 71 233-82-46); снаружи — всегда. Отсюда такси до Алайского базара.", "gq": "Lutheran Church Tashkent"}, {"id": "alay", "name": "Алайский базар", "lat": 41.3188, "lon": 69.2851, "kind": "sight", "list": 35, "move": "taxi", "stay": 40, "order": "Самса в угловом ларьке Milliy Taomlar, корейские салаты, сухофрукты и орехи домой.", "hook": "Самый «интеллигентный» базар Ташкента — на границе старого города и русских кварталов, выросших в XIX веке.", "facts": ["Название — от холма Олой. В XIX веке базар стоял на стыке колониальных кварталов и старого города и считался самым престижным.", "Ряды из белого кирпича построены в 1950-х; сейчас около 2000 мест. Корейские салаты на прилавках — наследие корё-сарам, советских корейцев, депортированных сюда в 1937 году."], "caution": "Понедельник выходной.", "gq": "Alay Bazaar"}, {"id": "h_rashidov", "day": "day3", "after": "alay", "name": "Минутка истории: Рашидов и хлопковое дело", "hook": "Шараф Рашидов четверть века руководил советским Узбекистаном и отстраивал Ташкент после землетрясения 1966 года, а после смерти из-за «хлопкового дела» его прах убрали из могилы в центре города.", "facts": ["Шараф Рашидов — первый секретарь ЦК Компартии Узбекистана, то есть фактический руководитель республики, с 15 марта 1959 года до смерти 31 октября 1983 года; ещё и писатель.", "В 1976 году Рашидов заявлял о сборе 4 млн тонн хлопка и обещал 5 млн; часть урожая существовала только на бумаге — это были приписки.", "Расследование приписок Политбюро поручило в феврале 1983 года; «хлопковое дело» — около 800 уголовных дел, более 4000 осуждённых (следственную группу возглавляли Тельман Гдлян и Николай Иванов).", "В 1984 году прах Рашидова перенесли из центра Ташкента на кладбище Чигатай; в независимом Узбекистане ему ставят памятники, его имя носят улицы."], "kind": "history", "approx": true, "move": "walk", "lon": 69.282, "lat": 41.322136}, {"id": "courage", "name": "Монумент «Мужество» (землетрясение 1966)", "lat": 41.3239, "lon": 69.2724, "kind": "sight", "list": 29, "move": "walk", "stay": 15, "hook": "Магнитуда ташкентского землетрясения 1966 года была всего около пяти, но очаг лежал прямо под центром города — на глубине нескольких километров.", "facts": ["26 апреля 1966 года, 5:23 утра; в эпицентре 8–9 баллов, трясло 10–12 секунд. Без крова остались больше 300 тысяч человек.", "Как город отстраивали после землетрясения — «В пути: Город, который отстроила вся страна» (следующий отрезок).", "Памятник 1976 года, скульптор Дмитрий Рябичев — он же автор головы Маркса, стоявшей в сквере Темура. Перед фигурами мужчины, заслоняющего женщину с ребёнком, — чёрный куб, расколотый трещиной, с циферблатом."], "look": ["Трещину через куб и стрелки на циферблате."], "gq": "Courage Monument Tashkent"}, {"id": "h_rebuild", "day": "day3", "after": "courage", "name": "В пути: Город, который отстроила вся страна", "hook": "После землетрясения 1966 года каждая республика строила в Ташкенте свои кварталы — на домах Чиланзара до сих пор написано «Киев — Ташкенту!».", "facts": ["Без крова остались больше 300 тысяч человек — примерно каждый пятый житель полуторамиллионного города. Постановлением от 14 июня 1966 года только РСФСР должна была построить 660 тысяч м² жилья.", "Приехали больше 25 тысяч строителей со всего СССР; москвичи строили микрорайоны Ц-1, 2, 4, 5, 6, Ц-7 — «украинский квартал».", "В Чиланзаре сохранились дома с надписями «Киев — Ташкенту!», «Саратов — Ташкенту!», «Сибирь — Ташкенту!», белорусские, литовские, эстонские, таджикские дома; проспект Бунёдкор тогда назывался проспектом Дружбы народов.", "К 1969 году построили больше 60 тысяч квартир; город восстановили примерно за три с половиной года."], "kind": "history", "approx": true, "move": "walk", "lon": 69.274345, "lat": 41.32892}, {"id": "minor_somsa", "name": "Minor Somsa №1 — самса из тандыра", "lat": 41.3357, "lon": 69.2775, "kind": "food", "move": "walk", "stay": 25, "order": "Самса из тандыра (рубленое мясо, лук, курдюк) + лимонный чай с наватом. 07:30–24:00.", "hook": "Ради самсы — пирожков из тандыра — сюда едут через весь город: 10 тысяч отзывов и рейтинг 5,0.", "facts": ["Та же самса из тандыра, что утром на Мирабадском базаре, — здесь её считают эталонной: рубленое мясо, лук и курдюк (бараний жир).", "Нават — кристаллы сахара, выращенные на виноградном соке; их кладут в чай вместо сахара."], "alt": "Солиднее — Lali (в 700 м южнее, первый узбекский проект ресторатора Аркадия Новикова): нарын (тонкая лапша с кониной), «праздничный» плов 11:00–18:00.", "legend": true, "gq": "Minor Somsa", "ic": "🥧", "ig": "meal", "lg": true}, {"id": "minor", "name": "Мечеть Минор («Белая мечеть»)", "lat": 41.33545, "lon": 69.27504, "kind": "sight", "list": 31, "move": "walk", "stay": 20, "hook": "Мечеть Минор в народе зовут Белой мечетью — и её построили всего примерно за 15 месяцев.", "facts": ["Стройка с лета 2013 года, открытие 1 октября 2014-го, накануне Курбан-хайита — праздника жертвоприношения.", "Белый мрамор, бирюзовый купол, два минарета; зал на 2400 человек; тёплые полы.", "Стоит на набережной канала Анхор; «минор» и значит «минарет»."], "gq": "Minor Mosque"}, {"id": "h_water", "day": "day3", "after": "minor", "name": "В пути: Вода Ташкента", "hook": "Ташкент — оазис: Чирчик, древний канал Бозсу и Анхор решили, где быть городу и где прошла граница между старым и новым Ташкентом.", "facts": ["Чирчик рождается при слиянии Чаткала и Пскема, длина 155 км, — крупнейший правый приток Сырдарьи.", "Бозсу — древний канал, отведённый от Чирчика, один из старейших в оазисе: 138–159 км, питает 23–25 каналов, в черте Ташкента орошает около 19 тысяч гектаров.", "Анхор («большой канал») — ветка Бозсу длиной около 23 км; в конце XIX — начале XX века граница: старый город на правом берегу, русский — на левом.", "Каналов в Ташкенте около 412 км, не считая мелких арыков — оросительных канавок вдоль улиц."], "kind": "history", "approx": true, "move": "walk", "lon": 69.274894, "lat": 41.336675}, {"id": "anhor_boat", "name": "Гондолы на Анхоре (Anhor Cruises), по желанию", "lat": 41.337957, "lon": 69.275831, "kind": "sight", "optional": true, "interactive": true, "move": "walk", "stay": 25, "hook": "По каналу, который полтора века делил Ташкент на старый и русский город, можно проплыть на гондоле.", "facts": ["Точка катания Anhor Cruises (2GIS: 4,0 по 73 оценкам): по отзывам 60 000 сум с человека, катание 7–10 минут — до моста и обратно.", "Анхор — ветка древнего канала Бозсу; в конце XIX — начале XX века по нему шла граница: старый город на правом берегу, русский — на левом."], "look": ["Белую мечеть Минор с воды."], "caution": "2GIS: ежедневно 09:00–23:00, но в отзывах бывает «закрыты на ремонт» и «сегодня выходной»; ноябрьский сезон не подтверждён. Позвони +998 99 789 00 77 или проверь @anhorcruise. Кататься лучше до заката.", "gq": "Anhor Cruises Tashkent"}, {"id": "japan", "name": "Японский сад", "lat": 41.339, "lon": 69.282, "kind": "sight", "list": 32, "move": "walk", "stay": 30, "hook": "Японский сад — знак дружбы и примирения в городе, где после Второй мировой японские военнопленные строили театр Навои.", "facts": ["Открыт 25 августа 2001 года, к 10-летию независимости, при участии посольства Японии; пруд с карпами, мостики, чайный павильон, сад камней.", "Связка с театром Навои: там в 1945–1947 годах работали пленные японские солдаты Квантунской армии, а здесь — сад дружбы."], "caution": "10:00–22:00, ~30 000 сум.", "gq": "Japanese Garden Tashkent"}, {"id": "h_repressions", "day": "day3", "after": "japan", "name": "Минутка истории: Тридцать восьмой год", "hook": "За две недели октября 1938 года, в разгар сталинских репрессий, в Ташкенте приговорили к расстрелу около пятисот человек: от поэтов до министров.", "facts": ["В марте 1938 года на показательном процессе в Москве вместе с видным большевиком Николаем Бухариным осуждены и расстреляны Файзулла Ходжаев (глава правительства Узбекской ССР, ранее — Бухарской народной республики, сменившей эмират) и Акмаль Икрамов (первый секретарь компартии республики).", "4–15 октября 1938 года в Ташкенте выездная коллегия Верховного суда СССР приговорила к расстрелу около 500 человек.", "Писатель Абдулла Кадыри (автор первого узбекского романа), учёный и драматург Фитрат и поэт Чулпан расстреляны 4 октября 1938 года; Чулпан — у реки Бозсу.", "Фитрат реабилитирован в 1956-м, Кадыри — в 1957-м, Ходжаев — в 1966 году."], "kind": "history", "approx": true, "move": "walk", "lon": 69.285488, "lat": 41.340644}, {"id": "shahidlar", "name": "Мемориал «Шахидлар хотираси» (сад и ротонда)", "lat": 41.34742, "lon": 69.28799, "kind": "sight", "list": 34, "move": "walk", "stay": 15, "hook": "Тихий парк у телебашни — место расстрелов 1920–30-х годов. Здесь погибли писатели Абдулла Кадыри, Фитрат и Чулпан, классики узбекской литературы.", "facts": ["С 1920-х до войны здесь расстреливали; на территории три места захоронений. Кадыри, Фитрата и Чулпана расстреляли 4 октября 1938 года.", "Мемориал «Память шахидов» (мучеников) создан в 2000 году; 31 августа стало Днём памяти жертв репрессий. Музей внутри обычный — смотрим сад и бирюзовую ротонду."], "look": ["Бирюзовый купол-ротонду."], "gq": "Shahidlar Xotirasi memorial"}, {"id": "beshqozon", "name": "Besh Qozon — Центр плова (флагман)", "lat": 41.3476, "lon": 69.2852, "kind": "food", "list": 33, "move": "walk", "stay": 45, "order": "Чайханский плов на тёмном рисе девзира — для сравнения со свадебным из части 1; ачичук (салат из помидоров с луком), сюзьма (густой кислый творог). ~53 000 сум.", "hook": "В Центре плова Besh Qozon («пять казанов») каждый казан рассчитан на 50 килограммов риса, и плов варят под открытым небом.", "facts": ["Все пять казанов видно примерно с 11 до 15 часов; к вечеру работает один. Если хочешь шоу — меняй порядок и иди сюда раньше.", "Начинался во дворе, теперь двухэтажный зал примерно на 500 мест."], "caution": "Все пять казанов видно примерно до 15:00; ближе к вечеру работает один — плов будет, шоу меньше.", "legend": true, "gq": "Besh Qozon Central Asian Plov Centre", "ic": "🍚", "ig": "meal", "lg": true}, {"id": "tvtower", "name": "Ташкентская телебашня — смотровая", "lat": 41.3456, "lon": 69.2847, "kind": "sight", "list": 30, "move": "walk", "stay": 45, "hook": "Телебашню высотой 375 метров построили в сейсмической зоне — через 12 лет после того, как землетрясение 1966 года разрушило город.", "facts": ["Строили с 1978 года, открыта 15 января 1985-го; 220 метров из 375 — металлическая антенна. Третья по высоте в СССР после Останкино и Киева.", "Смотровая площадка — около 97 метров, лифт поднимается за 21 секунду.", "Вращающийся ресторан «Коинот» — оборот примерно за 45 минут; отзывы — «привет из 90-х», ночью из-за бликов вида почти нет."], "caution": "Нужен паспорт. Цена для иностранцев ~100 000 сум; часы 10–20 (уточни: +998 71 202 35 70). Закат около 17:00.", "when": "к закату (~17:00)", "look": ["После заката — подсвеченную башню снизу, от Японского сада или у Besh Qozon."], "gq": "Tashkent TV Tower"}, {"id": "h_aral", "day": "day3", "after": "tvtower", "name": "Минутка истории: Шевченко, Арал и белое золото", "hook": "Украинский поэт Тарас Шевченко, в честь которого названа улица, где ты ужинаешь, рисовал Аральское море, когда оно ещё было морем.", "facts": ["Шевченко, в 1847 году сосланный солдатом в Оренбургский край, участвовал в экспедиции Алексея Бутакова на шхуне «Константин» (1848–1849) и делал зарисовки Арала.", "В 1960 году Арал — около 68 тысяч кв. км, четвёртое по площади озеро мира; с 1960-х питавшие его Амударью и Сырдарью разобрали на орошение хлопка — «белого золота».", "К 2007 году осталось около 10% площади; в 2014 году восточная чаша высохла, на дне — новая пустыня Аралкум; порт Муйнак (около 30 тысяч рабочих мест в рыбной отрасли) теперь в 30–90 км от воды.", "Плотина Кокарал (2005) подняла уровень Малого (Северного) Арала в Казахстане на 12 м к 2008 году."], "kind": "history", "approx": true, "move": "walk", "lon": 69.279933, "lat": 41.3129}, {"id": "shevchenko", "name": "Гастроулица Тараса Шевченко — ужин и вечерняя прогулка", "lat": 41.2996, "lon": 69.278, "kind": "food", "move": "taxi", "stay": 90, "when": "вечер", "order": "Выбирай по настроению: второй зал Afsona (Шевченко, 28/30 — тыквенные манты, ханум), Tim's Coffee & Roastery (Шевченко, 40), десерты.", "hook": "Улица Тараса Шевченко стала первой в Ташкенте гастрономической улицей: кафе вынесли столы на тротуар, и город начал жить ночью.", "facts": ["Запущена в октябре 2024 года в Мирабадском районе; дальше по её образцу открыли гастроулицу на Бунёдкоре (июль 2025, 90 заведений) и задумали семикилометровую в Алмазаре на 250 мест.", "Идея гастроулиц — ночная экономика: заведения работают допоздна, часть круглосуточно."], "legend": false, "gq": "Taras Shevchenko street Tashkent", "ic": "🍽️", "ig": "meal"}, {"id": "h_plov", "day": "day3", "after": "shevchenko", "name": "В пути: Утренний плов", "hook": "ЮНЕСКО внесло в список наследия не рецепт плова, а обычаи вокруг него — главный из них плов на рассвете.", "facts": ["В 2016 году «Культура и традиции плова» Узбекистана внесены в Репрезентативный список нематериального наследия ЮНЕСКО.", "Нахорги ош — утренний плов к свадьбе или поминкам: накануне соседи-мужчины вместе режут морковь (сабзи тўграр), огонь разводят после полуночи, гостей зовут на рассвете после утренней молитвы — к 7 утра всё заканчивается.", "Классический плов — семь составляющих: лук, морковь, мясо, жир, соль, вода, рис. Хрустящую корку со дна казана по обычаю отдают ошпазу (повару) и его помощникам.", "Легенда: пловом угощали Александра Македонского на свадьбе с Роксаной."], "kind": "history", "approx": true, "move": "walk", "lon": 69.279049, "lat": 41.292783}, {"id": "home3b", "name": "Финиш", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "move": "walk", "note": "~1,7 км пешком или такси"}]}, {"id": "day4", "order": 4, "title": "Часть 3 — Magic Safari и Magic City", "short": "3 · сафари и Magic City", "date": "2026-11-03", "color": "#c0397a", "summary": "Пешком в легендарную лагманную «на Заводской» → такси на юг в Magic Safari: автобус среди жирафов и антилоп, львы, лемуры, шоу птиц → такси к Комсомольскому озеру на закате → сталинские «ворота» Бешагача → Magic City: замок и улицы столиц, океанариум с тоннелем, перевёрнутый дом и зеркальный лабиринт → замок в огнях и музыкальный фонтан → ужин в Afsona → такси домой.", "blocks": [{"title": "Лагман на Заводской", "from": "home4", "summary": "Полчаса пешком и легендарный лагман — плотно поешь: в сафари только перекус."}, {"title": "Magic Safari", "from": "d5_safari", "summary": "Сафари-автобус среди жирафов и антилоп, львы, остров лемуров, шоу птиц."}, {"title": "Озеро на закате", "from": "d4_lake", "summary": "Замок Magic City над Комсомольским озером и сталинские «ворота» Бешагача."}, {"title": "Magic City", "from": "d4_magic", "summary": "Улицы столиц, акулы над головой в тоннеле, перевёрнутый дом — и замок в огнях над музыкальным фонтаном."}, {"title": "Ужин и домой", "from": "d4_afsona", "summary": "Узбекская классика в Afsona среди башен Tashkent City и такси домой."}], "stops": [{"id": "home4", "name": "Старт", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "when": "~11:00"}, {"id": "h_d5_silk", "day": "day4", "after": "home4", "name": "В пути: Шелкопряд и тутовник", "hook": "Самое маленькое домашнее животное Узбекистана — тутовый шелкопряд: страна третья в мире по шёлку после Китая и Индии.", "facts": ["Тутовый шелкопряд одомашнен в Китае около 5000 лет назад; бабочка почти не летает и не ест; гусеница 26–32 дня ест только листья шелковицы (тутовника), четырежды линяет и вьёт кокон из одной нити длиной 300–900 м; из 100 кг коконов — около 9 кг нити (ru.wikipedia «Тутовый шелкопряд»).", "Узбекистан — третий в мире производитель шёлка после Китая и Индии; коконы выращивают сельские семьи, цикл 30–40 дней (economist.kg, март 2026; kun.uz).", "К 2030 году производство планируют почти утроить и за четыре года посадить 200 млн шелковиц (economist.kg, 2026)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.256322, "lat": 41.280541}, {"id": "d5_zavodskaya", "name": "Лагманная «на Заводской» — поздний обед", "lat": 41.27, "lon": 69.2599, "kind": "food", "approx": true, "move": "walk", "stay": 50, "when": "~11:30, полчаса пешком — плотный обед: в сафари только перекус", "order": "Лагман (наваристый бульон, щедрые порции) + шашлык; зелёный чай.", "hook": "Эту лагманную на улице Бабура знает каждый ташкентец — по старому народному названию «Заводская».", "facts": ["Ташкентский городской онлайн-журнал WE Project в августе 2026 года включил её в список «18 легендарных заведений Ташкента»: сюда приходят за лагманом, в меню также шашлык.", "Лагман — уйгурская тянутая лапша: один кусок теста вытягивают и складывают, пока он не превратится в пучок тонких нитей."], "note": "ул. Бабура, 78 — 1,9 км от дома; ~10 км от сафари, такси 20–25 мин.", "caution": "Часы и цены не найдены; точка — по адресу дома, а не по входу в кафе.", "alt": "Пловная сети Besh Qozon «Сергели» (махалля — квартал-община — Сохибкирон) — ближе к сафари, но это был бы третий Besh Qozon за поездку; точный адрес не найден.", "legend": true, "gq": "Лагман на Заводской", "ic": "🍜", "ig": "meal", "lg": true}, {"id": "h_d5_tigers", "day": "day4", "after": "d5_zavodskaya", "name": "В пути: Свои тигры", "hook": "До африканских львов сафари у этих мест были свои большие кошки: в 1883 году на тигров охотились между Ташкентом и Чиназом.", "facts": ["Туранский (каспийский) тигр жил в Средней Азии, Иране, Закавказье; его дом — тугаи, заросли тростника вдоль рек; добыча — кабаны и косули.", "1883 — по просьбе местных жителей русские военные устроили облаву на тигров между Ташкентом и Чиназом; причины исчезновения — охота и распашка пойм; последних тигров в Узбекистане видели в 1948 году в дельте Амударьи и у Термеза (по Н. Красильникову; ru.wikipedia «Туранский тигр»).", "2009 — генетики показали близкое родство с амурским тигром. Казахстан: Иле-Балхашский заповедник (2018); в конце июля 2026 года выпущена на волю амурская тигрица Умит («надежда») — первый вольный тигр в стране за 70 с лишним лет (Mongabay, Astana Times, август 2026)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.225292, "lat": 41.261905}, {"id": "h_d4_chilla", "day": "day4", "after": "d5_zavodskaya", "name": "В пути: Чилля, сорок дней жары", "hook": "Летом в Ташкенте бывает за сорок — у самого пекла даже есть своё имя, чилля, «сорок дней».", "facts": ["Климат резко континентальный: средняя температура июля 28,3 °C (средний дневной максимум 35,9), января +2,3 °C; рекорд жары +44,6 °C — 18 июля 1997 года, рекорд холода −29,5 °C — 20 декабря 1930 года (ru.wikipedia «Ташкент»).", "Чилля (перс. «сорок») — около сорока самых жарких дней, обычно с 25 июня по 3 августа; есть и зимняя чилля — около сорока холодных дней.", "От жары прятались в чиллахонах — глинобитных куполах, почти целиком под землёй; у суфиев чилля — сорокадневное уединение для молитвы и поста (ru.wikipedia «Чилля»)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.189958, "lat": 41.23729}, {"id": "d5_zangiata", "name": "Мемориальный комплекс Зангиата", "lat": 41.1974, "lon": 69.1579, "kind": "sight", "list": 37, "move": "taxi", "stay": 45, "when": "~11:40", "hook": "Здесь похоронен суфийский шейх Занги-ата — «чёрный отец», а мавзолей над его могилой велел построить сам Тимур (Амир Темур), завоеватель и создатель империи XIV века.", "facts": ["Занги-ата — шейх Ай-Ходжа, суфий (мусульманский мистик) XII–XIII веков (умер в 1258 году), пятый преемник Ходжи Ахмеда Ясави (о нём — интерлюдия «В пути: Учитель из Туркестана»). «Занги» по-арабски значит «темнокожий».", "Мавзолей возвели по приказу Амира Темура в 1390-х, при его внуке Улугбеке (начало XV века) его украсили; портал и купола чинили в XVI–XVII веках. Медресе (исламская школа) и мечеть рядом появились в XIX веке, новый минарет — в 2014 году.", "Рядом мавзолей его жены Анбар-биби — покровительницы материнства и плодородия; к ней приходят женщины, которые молятся о детях. По преданию, она была дочерью Ибрахима Богра-хана из тюркской династии Караханидов."], "look": ["Портал с цветной мозаикой и арабскими надписями — работа времён Улугбека.", "Надгробие Анбар-биби: его выложили кусочками майолики, снятыми с купола мавзолея мужа."], "note": "~7 км в сторону от сафари — сегодня пропускаем, если не хочется сократить сафари.", "caution": "Действующая святыня: закрытые плечи и колени, женщинам — платок. Часы и плата за вход не проверены (обычно свободно). Можно пропустить, если хочется больше времени на сафари.", "alternative": true, "optional": true, "gq": "Zangiata Mausoleum"}, {"id": "d5_safari", "name": "Magic Safari — сафари-парк", "lat": 41.1992, "lon": 69.2313, "kind": "sight", "interactive": true, "move": "taxi", "stay": 195, "when": "~12:45–16:00", "order": "Билет на сафари-автобус (взрослый 125 000 сум; пешком 75 000). Full Pass 299 000 — автобус, лемуры, птицы, мини-зоо и кормление. Корм отдельно: 25 000–50 000 сум за порцию.", "hook": "Magic Safari — первый тематический сафари-парк Центральной Азии: он открылся в 2025 году на месте заброшенного парка в Сергели, на юго-западной окраине Ташкента.", "facts": ["Открыт 15 мая 2025 года: около 20 гектаров, больше десяти зон вокруг озера; старые деревья бывшего Green Park сохранили.", "Сафари-автобус едет прямо по территории среди копытных; водитель одновременно и гид. Пешком полный круг — 1–2 часа.", "По карте парка: львы, сетчатые жирафы, антилопы гну, канны и ситатунги, кенгуру, страусы, верблюды, ламы и альпаки, фламинго; больше 400 животных.", "Остров лемуров в стиле Мадагаскара, родины лемуров, — кормление группами до восьми человек; контактный мини-зоопарк Zoo-Zoo с сурикатами и пони; в 2026 году открыли террариум.", "За животными ухаживают смотрители из стран, откуда эти животные родом. После 19:00 включается Loonaland — вечерняя зона с подсветкой, арт-инсталляциями и фотозонами."], "look": ["Ситатунгу — болотную антилопу с длинными растопыренными копытами: она умеет ходить по топкому берегу.", "Узор сетчатого жирафа: тёмные многоугольники, разделённые светлыми линиями, — у каждого жирафа свой.", "Шоу птиц с попугаями ара и шоу «Африка» — в октябре 2026 шли в 15:00/17:00 и 16:00/18:00/19:00."], "food_near": "В парке одно кафе: хот-доги, пицца, вафли, напитки — только перекус. Можно устроить пикник у озера-лагуны со своей едой (без стекла).", "note": "~13–15 км от дома; Яндекс Карты 4,8 (почти 4000 оценок). Будни спокойнее выходных.", "caution": "Сегодня вторник: по FAQ сайта вт–пт 09:00–19:00, последний вход за 90 минут; сайт и Яндекс пишут 10:00–22:00. Цены по данным 2025–2026 гг., ноябрьского расписания шоу нет — позвони +998 98 333 33 73 или проверь @magicsafari.uz. Всё под открытым небом — оденься теплее.", "gq": "Magic Safari Tashkent"}, {"id": "h_d5_weil", "day": "day4", "after": "d5_safari", "name": "В пути: Марк Вайль", "hook": "Основателя «Ильхома» Марка Вайля убили накануне премьеры «Орестеи» — а премьера всё равно состоялась на следующий день.", "facts": ["Марк Вайль (1952, Ташкент) учился режиссуре в Ташкентском театрально-художественном институте; в 1976 году с молодыми выпускниками основал «Ильхом» — первый в СССР профессиональный негосударственный театр; первый спектакль «Масхарабоз-76» — импровизация в духе узбекского уличного театра.", "Ставил в театре имени Моссовета, в Болгарии, Югославии, США; спектакли «Ильхома» ездили на международные фестивали.", "Вечером 6 сентября 2007 года после генеральной репетиции «Орестеи» на него напали в подъезде дома; он умер во время операции; премьера прошла 7 сентября. В 2010 году осуждены трое (13, 17 и 20 лет); нападение связывают со спектаклем «Подражание Корану». Театр возглавил ученик Вайля Борис Гафуров (ru.wikipedia «Вайль, Марк Яковлевич»)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.237892, "lat": 41.265266}, {"id": "h_d4_canal", "day": "day4", "after": "d5_safari", "name": "В пути: Стройки всем миром", "hook": "Комсомольское озеро копали хашаром — а в 1939 году тем же способом около 160 тысяч колхозников прокопали Большой Ферганский канал.", "facts": ["Хашар — традиционная общая бесплатная работа махалли; в 1930-х советская власть сделала его методом больших строек, им копали и Комсомольское озеро.", "Большой Ферганский канал (1939): около 160 000 колхозников, длина около 350 км, на всей стройке 14 экскаваторов; план — за месяц, сдан 31 декабря 1939 года; орошает около 500 тыс. га.", "Канал носил имя Сталина, в 1966 году назван в честь Усмана Юсупова; Эйзенштейн задумывал фильм «Ферганский канал», но проект не прошёл цензуру (ru.wikipedia «Большой Ферганский канал»)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.251366, "lat": 41.290633}, {"id": "d4_lake", "name": "Комсомольское озеро (парк «Милий бог»)", "lat": 41.30126, "lon": 69.24159, "kind": "sight", "move": "taxi", "stay": 15, "hook": "Комсомольское озеро в 1930-х выкопали вручную комсомольцы и горожане на месте глиняного карьера кирпичного завода — а в 2022 году его осушили и сделали заново.", "facts": ["В 1939 году парк открыли как парк культуры и отдыха имени Сталина; с 1961 года — имени Ленинского комсомола (комсомол — коммунистический союз молодёжи), отсюда «Комсомольское озеро». С 1991-го, к 550-летию поэта, — Национальный парк имени Алишера Навои.", "Озеро копали хашаром — бесплатным общим трудом добровольцев; эту стройку запечатлел художник Николай Карахан на картине «Строительство Комсомольского озера» (1940).", "В 2017 году по постановлению правительства парк закрыли на реконструкцию; около 21 гектара из 65 ушли под Magic City (подробности сделки — в интерлюдии «В пути: Кому достался парк»). В 2022-м озеро осушили, дно покрыли новым покрытием, посадили больше тысячи деревьев и около двухсот тысяч кустов. Нынешнее озеро — около 4 гектаров, чуть меньше прежнего."], "look": ["Замок парка развлечений Magic City за водой — он стоит на бывшей части того же парка."], "food_near": null, "when": "~16:30, до заката (≈17:10)", "gq": "Milliy bog park lake"}, {"id": "h_d4_park_deal", "day": "day4", "after": "d4_lake", "name": "В пути: Кому достался парк", "hook": "Около 21 гектара народного парка в 2017 году отдали в аренду на 49 лет под частный парк развлечений — и спор об этом не утих до сих пор.", "facts": ["Сентябрь 2017: постановление Кабмина № 694 о «современном высокотехнологичном парке»; парк закрыли, часть зданий снесли, часть деревьев убрали.", "20,79–21 га из 65 взяла в аренду на 49 лет компания Stargate Systems — тогда часть группы Akfa бывшего хокима (мэра) Ташкента Джахонгира Артыкходжаева; обязательство по инвестициям — 55 млн $ (его слова, Spot 2024) или 60 млн $ (Qalampir 2025).", "Артыкходжаев говорит, что продал парк своим менеджерам; по данным Spot (2024) и Qalampir (2025), владелец — Алишер Абдувахитов через ООО Tashkent Aquarium. Qalampir (2025): дельфинарий на 4 дельфина, две американские горки и волновой бассейн так и не построили.", "Tashkent Times (24.04.2024): «любимый народом Национальный парк превратили в гротескный Magic City»; другие горожане рады новым развлечениям."], "kind": "history", "approx": true, "move": "walk", "lon": 69.240288, "lat": 41.298061}, {"id": "navoi_park", "name": "Национальный парк им. Алишера Навои (ротонда)", "lat": 41.3038, "lon": 69.2412, "kind": "sight", "list": 14, "move": "taxi", "stay": 15, "hook": "Над парком под кружевным куполом стоит Алишер Навои — поэт XV века, который доказал, что тюркский язык не хуже персидского.", "facts": ["Памятник Навои поставили в 1991 году — год 550-летия поэта и год независимости Узбекистана.", "Навои (1441–1501) жил в Герате, был визирем (советником) султана Хусейна Байкары, с которым учился в одной школе. Тюркские стихи подписывал «Навои» («мелодичный»), персидские — «Фани».", "В трактате «Суд двух языков» (1499) он доказывал, что тюркский (чагатайский) язык годится для высокой поэзии не хуже персидского — поэтому его зовут отцом узбекской литературы."], "look": ["Ажурный купол-ротонду над фигурой.", "Голубой купол парламента (Олий Мажлис) за деревьями.", "Вниз от памятника начинается Аллея литераторов."], "alternative": true, "optional": true, "note": "По желанию: памятник Навои в ~300 м от озера.", "gq": "Alisher Navoi National Park"}, {"id": "d4_alley", "name": "Аллея литераторов в Национальном парке", "lat": 41.30296, "lon": 69.23914, "kind": "sight", "extra": true, "move": "walk", "stay": 20, "hook": "Два десятка бронзовых узбекских писателей и поэтов — и у многих из них судьба страшнее любого романа: самых известных расстреляли в сталинские репрессии.", "facts": ["Аллею создали указом президента Узбекистана в 2017 году; она начинается у мемориала Алишеру Навои, и собрала памятники более чем двадцати узбекским писателям, поэтам и учёным.", "Здесь Абдулла Кадыри — автор «Минувших дней», первого узбекского романа, — и поэт Чулпан; обоих арестовали в 1937 году в ходе сталинских репрессий и расстреляли в Ташкенте в октябре 1938-го. Рядом Бехбуди, автор первой узбекской пьесы «Отцеубийца».", "Есть и Абдулла Арипов — автор слов гимна Узбекистана, и Александр Файнберг — ташкентский поэт, писавший по-русски, народный поэт Узбекистана."], "look": ["Найди Кадыри и Чулпана — они стоят в нескольких шагах друг от друга.", "Александра Файнберга — ташкентского поэта, писавшего по-русски."], "caution": "Состав памятников взят по OpenStreetMap; таблички на узбекском.", "alternative": true, "optional": true, "gq": "Alley of Writers Navoi Park"}, {"id": "d4_gates", "name": "Бешагачские «ворота» — сталинские дома-пропилеи", "lat": 41.30448, "lon": 69.24708, "kind": "sight", "move": "walk", "stay": 10, "hook": "На площади Бешагач два дома с колоннадами поставили так, чтобы улица входила в парк, как через парадные ворота.", "facts": ["Четырёхэтажные дома начала 1950-х, архитекторы Митхат Булатов и Леонид Караш — классика сталинского ампира (парадного советского классицизма) с ташкентских открыток.", "«Беш» по-узбекски — пять, «ёгоч» — дерево; Бешагач — одна из четырёх даха (частей) старого Ташкента. За правым домом был Бешагачский базар — сейчас он не работает.", "В 2024 году площадь реконструировали; в 2025-м эскизы многоэтажного комплекса за историческими домами вызвали протест жителей."], "look": ["Колоннады верхних этажей — они «смотрят» точно на вход в Magic City."], "when": "~16:50"}, {"id": "h_d4_castle", "day": "day4", "after": "d4_gates", "name": "В пути: Король, который строил сказку", "hook": "Оригинал замка Magic City — баварский Нойшванштайн: король Людвиг II прожил в нём всего 172 дня, а замок так и не достроили.", "facts": ["Первый камень заложен 5 сентября 1869 года; Людвиг II сам утверждал каждый эскиз. Расходы на замок стали одним из доводов, чтобы в июне 1886 года объявить короля недееспособным; в том же месяце он умер.", "Замок не достроен: нет главной башни высотой 90 м и парка с фонтаном. Король прожил в нём 172 дня.", "Через шесть недель после смерти короля замок открыли для платных посещений, чтобы покрыть долги (выплачены к 1899 году). Прообраз замка Спящей красавицы у Disney; с 2025 года — в списке всемирного наследия ЮНЕСКО (ru.wikipedia «Нойшванштайн»)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.242959, "lat": 41.309343}, {"id": "d4_kamolon", "name": "Kamolon Osh «Дружба» — плов на Бешагаче", "lat": 41.30783, "lon": 69.23742, "kind": "food", "move": "walk", "stay": 45, "when": "плов — днём; к вечеру его может не остаться", "order": "Сет-дегустация из пяти пловов на двоих (свадебный, зигир на льняном масле, чайханский, чунгара, оши софи) — или порция свадебного либо зигир-плова ~53 000 сум; к нему ачичук (салат из помидоров с луком) и зелёный чай.", "hook": "В пловной «Камолон» варят сразу пять видов плова — и их можно сравнить на одной тарелке.", "facts": ["Рейтинг в Яндекс Картах 5,0 почти по восьми тысячам оценок, в 2GIS — 4,9; ташкентский городской онлайн-журнал WE Project включил «Камолон» в топ-15 пловных Ташкента (2025).", "Зигир-ош готовят на льняном масле («зигир» по-узбекски — лён) — оно даёт ореховую горчинку; свадебный плов светлее и «классичнее», чайханский — жирнее.", "Лучшие порции разбирают к полудню: плов в Ташкенте — дневное блюдо, к вечеру его может не остаться."], "look": ["Сравни цвет риса: у зигир-плова и чайханского он темнее."], "caution": "Часы не подтверждены (сайт: телефон 09:00–06:00; Яндекс показывает до 23:00). Очереди в обед; приходи к 11:30. Тел. +998 55 500-16-61.", "alt": "Рядом (200 м) — Tarnov «Дружба»: шашлык, лагман, уйгурская кухня; рейтинг 5,0 в Яндексе, плов пн–сб 11:00–15:00.", "legend": false, "alternative": true, "optional": true, "gq": "Kamolon Osh", "ic": "🍚", "ig": "meal"}, {"id": "d4_icecity", "name": "Ice City — крытый каток и настоящий снег", "lat": 41.29643, "lon": 69.24735, "kind": "sight", "interactive": true, "optional": true, "extra": true, "move": "walk", "stay": 60, "hook": "В городе, где летом за сорок, Ice City круглый год держит зиму под крышей.", "facts": ["Открыт 2 февраля 2019 года: каток Frozen Lake из натурального льда на 1 800 м², снежная площадка, склон для лыж и сноуборда длиной 46 м.", "Тюбинг (спуск на надувной «ватрушке») Ice Vertigo, бобслей Bob Mountain, ладьи викингов Viking River, воздушные шары под потолком — всего 11 аттракционов."], "order": "Каток 30 минут + пара спусков на тюбинге или бобе.", "caution": "Ежедневно 10:00–22:00 (WE Project, дек. 2025). Обязательна карта клиента (5–10 тыс. сум). Каток 50–55 тыс. сум за 30 мин, горки 15–20 тыс. Внутри прохладно — возьми свитер. Ул. Бабура 6/4, у ТРК Next.", "alternative": true, "gq": "Ice City Tashkent"}, {"id": "d4_magic", "name": "Magic City — замок и улицы столиц", "lat": 41.30356, "lon": 69.24502, "kind": "sight", "interactive": true, "move": "walk", "stay": 40, "hook": "Magic City — парк развлечений «в стиле Диснейленда»: баварский замок, лондонский Биг-Бен и самаркандский Регистан в одном квартале — на земле старого советского парка.", "facts": ["Открыт частично 1 июня 2021 года, в День защиты детей, на 21 гектаре бывшего Национального парка (аренда и владельцы — в интерлюдии «В пути: Кому достался парк»).", "Замок по образцу Нойшванштайна — баварского замка короля Людвига II (его история — в интерлюдии «В пути: Король, который строил сказку»); башни около 60 м. 11 улиц-стилизаций под мировые столицы, амфитеатр-«Колизей» примерно на 600 мест.", "Бренд придумало российское агентство TUTKOVBUDKOV, здания проектировала австралийская Sanderson Group; у парка есть маскот Фаникл со своим мультсериалом.", "У входа — «кричащий фонтан»: чем громче кричишь и хлопаешь, тем выше вода. Бесплатно."], "look": ["Копии Биг-Бена, Тауэрского моста и Регистана на «улицах столиц».", "Кричащий фонтан у входа — попробуй."], "food_near": "Qo'shni внутри парка (уйгурская и узбекская кухня, 2GIS 4,4); фуд-корт с корейской, узбекской, турецкой кухней.", "caution": "Вход в парк бесплатный. Часы: 10:00–22:00 (по другим данным до 23:00). Зимой многие уличные аттракционы закрыты «до весны» — в начале ноября часть может уже не работать. Расхождение: высота замка 57 или 60 м.", "when": "~17:00", "gq": "Magic City Tashkent"}, {"id": "d4_aquarium", "name": "Magic Aquarium — океанариум с тоннелем", "lat": 41.30298, "lon": 69.24604, "kind": "sight", "interactive": true, "move": "walk", "stay": 60, "hook": "В Magic Aquarium акулы проплывают прямо над головой — в стране, откуда до любого моря нужно пересечь минимум две границы.", "facts": ["Первый океанариум Узбекистана; 20-метровый подводный тоннель, глубина бассейна 3,8 м, больше 100 видов: акулы, скаты, медузы, змеи, насекомые.", "По данным ташкентского портала Afisha.uz (2022): 12 тематических залов — Арал, Амазонка, затонувший корабль «Арго», подводная лодка, зал медуз с лазерами; главный аквариум держит 1 022 т воды за стеклом толщиной 22 см и весом 6,5 т; животные съедают ~40 кг корма в день. Дельфинов нет.", "Есть отдельная зона с капибарами и выдрами."], "look": ["Скатов снизу в тоннеле.", "Зал «Арал» — об Аральском море, которое почти высохло."], "caution": "Билет 120 000 сум (от 12 лет), капибары и выдры +50 000 (Aviasales, апр. 2026). «Крупнейший в Азии вдали от моря» — рекламное утверждение.", "when": "~17:40", "gq": "Magic Aquarium Tashkent"}, {"id": "d4_magic_museum", "name": "Magic Museum — перевёрнутый дом, зеркала, иллюзии", "lat": 41.30337, "lon": 69.24344, "kind": "sight", "interactive": true, "move": "walk", "stay": 45, "hook": "В Magic Museum можно погулять по люстрам и стать вдвое выше друга.", "facts": ["Четыре интерактивные зоны: перевёрнутый дом (пол и потолок поменялись местами), зеркальный лабиринт, комнаты оптических иллюзий и ещё одна зона.", "Иллюзии построены на перспективе и зеркалах: в одной комнате ты кажешься вдвое выше друга, в другой будто исчезаешь в стене."], "look": ["Сфотографируйся «на потолке» в перевёрнутом доме и переверни снимок."], "caution": "Комбо-билет 190 000 сум на 4 зоны (по Aviasales, включает и океанариум — уточни в кассе, чтобы не платить дважды). Зеркальный лабиринт отдельно ~20 000. Музей восковых фигур источники путают с Tashkent City — не рассчитывай.", "when": "~18:40", "gq": "Magic Museum Tashkent"}, {"id": "d4_magic_night", "name": "Замок в огнях и шоу фонтанов", "lat": 41.30337, "lon": 69.24439, "kind": "sight", "move": "walk", "stay": 40, "when": "~19:30, замок в огнях и фонтан (шоу 18:00–22:00)", "hook": "Самый большой музыкальный фонтан Ташкента — почти гектар воды — пляшет под музыку на фоне подсвеченного замка Magic City.", "facts": ["Музыкальный фонтан площадью 8 500 м² — самый большой в Ташкенте; шоу с музыкой, лазером, иногда с салютом.", "Шоу «Magic City на воде» шло каждый вечер даже в декабре 2025 — январе 2026, так что фонтан, скорее всего, работает и в ноябре."], "look": ["Замок с площади перед озером, когда загораются башни."], "caution": "Шоу 18:00–22:00 по FAQ (Aviasales, апр. 2026); ноябрьское расписание не подтверждено — проверь @magiccityuz или +998 71 205 20 50. Темнеет около 17:00.", "note": "В ~1 км к юго-западу — набережная Seoul Mun с фонтанами (17:00–22:15): точка 24 во вкладке 2A.", "gq": "Magic City Tashkent"}, {"id": "d4_seoulmun", "name": "Набережная Seoul Mun — фонтаны, по желанию", "lat": 41.29873, "lon": 69.24549, "kind": "sight", "move": "walk", "stay": 30, "hook": "«Seoul Mun» значит «Сеульские ворота»: набережная канала Бурджар на улице, которую переименовали в Сеульскую в честь дружбы с Кореей.", "facts": ["Строили с 2021 года, открыли в июне 2023-го: около 650 м вдоль канала Бурджар, кафе и магазины в три яруса, маяк высотой около 30 м с лифтом — символ проекта, мосты через канал (Afisha 22.09.2023, Spot 06.03.2024).", "Цветомузыкальные фонтаны тянутся по обе стороны канала; напротив — деревянные ступени-трибуны в четыре ряда. Шоу ежедневно 17:00–22:15 (WE Project, 14.09.2026); в программе есть и корейские треки."], "look": ["Лифт-маяк на пристани.", "Фонтаны с трибун напротив."], "caution": "Сезон фонтанов в 2025 году закончился к концу ноября; в начале ноября 2026 шоу может уже не идти. Подсветка набережной, маяка и мостов работает и без фонтанов.", "when": "после замка в огнях, шоу 17:00–22:15", "optional": true, "alternative": true, "note": "~1 км от Magic City пешком (≈15 мин); оттуда до Afsona ~2 км — лучше такси. Та же точка, что №24 во вкладке 2A.", "gq": "Seoul Mun Tashkent"}, {"id": "d4_afsona", "name": "Afsona в Tashkent City — ужин", "lat": 41.3153, "lon": 69.2451, "kind": "food", "move": "walk", "stay": 75, "when": "~20:15", "order": "Тыквенные манты, ханум (рулет из тонкого теста с мясом на пару), чайханский плов; для вегетарианцев — фруктовый плов.", "hook": "Afsona переосмысливает узбекскую классику «под сегодняшний день»: те же манты и плов, но с открытой кухней и английским меню.", "facts": ["Один из самых удобных для приезжего ресторанов национальной кухни: хороший сервис, официанты говорят по-английски.", "Второй зал — на гастроулице Шевченко."], "caution": "11:00–23:00. От Magic City ~1,3 км пешком.", "legend": false, "alt": "Не хочешь идти 1,3 км — Qo'shni прямо в Magic City (уйгурская и узбекская кухня, 2GIS 4,4) или фуд-корт.", "gq": "Afsona restaurant Tashkent City", "ic": "🥟", "ig": "meal"}, {"id": "h_d4_humo", "day": "day4", "after": "d4_afsona", "name": "В пути: Птица Хумо", "hook": "Тень сказочной птицы Хумо, по поверьям, приносит счастье — а саму птицу ты видел весь день: она на гербе Узбекистана и в силуэте «Хумо Арены».", "facts": ["Хумо — мифическая птица иранских преданий и тюркской традиции, птица счастья; толкователи Саади писали, что её тень дарит всему, на что упадёт, царственность и бессмертие; Бунин вспоминает легенду в рассказе «Тень птицы». Навои считал Хумо самой доброй из живых существ.", "Герб Узбекистана утверждён 2 июля 1992 года: в центре птица Хумо с раскрытыми крыльями; солнце, реки Амударья и Сырдарья, горы и долины, колосья пшеницы и коробочки хлопка, сверху восьмиугольник с полумесяцем и звездой (ru.wikipedia «Герб Узбекистана»).", "Силуэт «Хумо Арены», по замыслу проектировщиков, напоминает птицу Хумо."], "kind": "history", "approx": true, "move": "walk", "lon": 69.265587, "lat": 41.303247}, {"id": "home4b", "name": "Финиш", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "move": "taxi", "note": "~3,5 км — такси"}]}], "evening": [{"id": "tamerlano", "name": "Опера «Тамерлан» в театре Навои", "when": "2, 3, 4 ноября, 19:00", "lat": 41.3092, "lon": 69.2715, "note": "Опера Генделя 1724 года о Тимуре — в городе Тимура; новая версия композитора Кирилла Рихтера с узбекскими народными инструментами и элементами макома (классической музыки Средней Азии), до Ташкента — Версаль, Вена, Мариинка. Билеты iticket.uz, 100–800 тыс. сум.", "gq": "Alisher Navoi Opera and Ballet Theatre"}, {"id": "ilkhom", "name": "«Ильхом»: открытие джазового сезона", "when": "3 ноября, 19:00", "lat": 41.31837, "lon": 69.26159, "note": "Первый негосударственный профессиональный театр СССР (основан режиссёром Марком Вайлем в 1976 году). Джаз-клуб открывает сезон: группа Jazzirama и Мансур Ташматов; в фойе фотовыставка Ермолая Солженицына, сына писателя. Касса +998 71 241-22-41.", "gq": "Ilkhom Theatre"}, {"id": "d4_humo", "name": "Вечер А (сб 7.11): Шеб Мами в «Хумо Арене»", "when": "суббота 7 ноября, 20:00", "lat": 41.30796, "lon": 69.25194, "note": "Шеб Мами — алжирский голос из хита «Desert Rose», спетого со Стингом, — живьём в «Хумо Арене», в 10 минутах пешком от замка Magic City. Только 7 ноября. Билеты afisha.uz / iticket.uz, 150 000–2 000 000 сум. Перед концертом — ужин в Magic City или в Tandiriy (тандырные блюда, бульвар Tashkent City); после — Caravan до 02:00. Площадка — угол улиц Афросиаб и Бешагач. Проверь, что концерт не перенесён.", "gq": "Humo Arena"}, {"id": "d4_ilkhom", "name": "Вечер Б (чт 5 / пт 6.11): театр «Ильхом»", "when": "5 или 6 ноября, 19:00", "lat": 41.31837, "lon": 69.26159, "note": "«Ильхом» — первый негосударственный театр СССР, и в эти дни здесь два очень разных вечера на выбор. Билеты от 120 000 сум (afisha.uz). Касса +998 71 241-22-41. Из Magic City такси ~15 мин, выезжай к 18:30. Возрастной ценз 18+ («Людка»); у «Танца Дели» не уточнён.", "gq": "Ilkhom Theatre"}, {"id": "d4_gabt", "name": "Вечер В (сб 7 / вс 8.11): ГАБТ им. Навои — «Жар-птица» и «Шехеразада» или «Травиата»", "when": "7 или 8 ноября, ~19:00", "lat": 41.30922, "lon": 69.27151, "note": "«Жар-птица» и «Шехеразада» — два балета, которые в 1910 году в Париже сделали мировой сенсацией «Русские сезоны» — гастроли труппы импресарио Сергея Дягилева. Билеты от 77 000 сум, iticket.uz, 12+. Касса +998 71 232-19-48. Время начала на iticket не указано; «Тамерлан» 2–4 ноября шёл в 19:00 — вероятно, так же. Проверь.", "gq": "Alisher Navoi Opera and Ballet Theatre"}, {"id": "d5_ilkhom", "name": "Театр «Ильхом» — вечерний спектакль", "when": "чт 5 или пт 6 ноября, 19:00", "lat": 41.3184, "lon": 69.2616, "note": "«Ильхом» — первый негосударственный театр Советского Союза и сегодня самый непредсказуемый театр Ташкента. ул. Пахтакорская, 5; от лагманной ~7 км, такси 15–20 мин. Приезжай к 18:30. Домой ~4 км. Только 5 и 6 ноября; на 7–8 ноября спектаклей «Ильхома» в афише нет. Билеты — afisha.uz / касса +998 71 241-22-41.", "gq": "Ilkhom Theatre"}, {"id": "d5_chebmami", "name": "Cheb Mami в Humo Arena (если суббота)", "when": "сб 7 ноября, 20:00", "lat": 41.308, "lon": 69.2519, "note": "Шеб Мами — алжирский певец, чей голос звучит рядом со Стингом в хите 1999 года «Desert Rose», — поёт живьём в «Хумо Арене». Пересечение ул. Афросиаб и Бешагач; от лагманной ~5 км, до дома ~3 км. Только 7 ноября. В тот же вечер — Валерия во Дворце «Дружба народов» (19:00, от 200 000 сум). Проверь, не перенесён ли концерт.", "gq": "Humo Arena"}], "optional": [{"id": "bq_glinka", "name": "Besh Qozon (филиал на Глинке) — плов у дома", "lat": 41.2849, "lon": 69.2644, "kind": "food", "note": "В 320 м от старта. Свадебный плов (тоёшь) из пяти казанов — удобно на ужин или в любой день.", "legend": false, "gq": "Besh Qozon", "ic": "🍚", "ig": "meal"}, {"id": "ichkari", "name": "ICHKARI — иммерсивный дом и аудиоспектакль", "lat": 41.2877, "lon": 69.2392, "kind": "sight", "interactive": true, "approx": true, "note": "Дом 1920-х, аудиоспектакль «Тени моего дома» в наушниках (2 ч, 60 000 сум, билеты afisha.uz). Прямой референс для твоего аудиогида. Возможно, в понедельник закрыт.", "gq": "Ichkari Tashkent"}, {"id": "caravan", "name": "Caravan (с 1999) — ужин у дома", "lat": 41.2852, "lon": 69.2576, "kind": "food", "note": "Интерьер караван-сарая; нарын с кониной, жареная чучвара. Средний чек 120–250 тыс. сум. Ресторан выставлен на продажу — проверь, открыт ли.", "legend": true, "gq": "Caravan restaurant", "ic": "🍽️", "ig": "meal", "lg": true}, {"id": "anjir", "name": "Anjir — плов «для местных»", "lat": 41.2946, "lon": 69.2659, "kind": "food", "note": "1 км от дома; плов 46 000 сум, нарын, тандыр-гушт; 09:00–23:00.", "legend": false, "gq": "Anjir restaurant Tashkent", "ic": "🍚", "ig": "meal"}, {"id": "brasserie", "name": "Brasserie Mirabad — круглосуточно", "lat": 41.2898, "lon": 69.2815, "kind": "food", "approx": true, "note": "Рядом с Успенским собором; ужин по пути домой после части 2A.", "legend": false, "gq": "Brasserie Mirabad", "ic": "🍽️", "ig": "meal"}, {"id": "lali", "name": "Lali — нарын и праздничный плов", "lat": 41.328, "lon": 69.2783, "kind": "food", "note": "Франшиза Новикова; плов «Праздничный» 11:00–18:00.", "legend": false, "gq": "Lali restaurant Tashkent", "ic": "🍚", "ig": "meal"}, {"id": "afsona", "name": "Afsona (Tashkent City)", "lat": 41.3153, "lon": 69.2451, "kind": "food", "note": "Тыквенные манты, ханум; 11:00–23:00.", "legend": false, "gq": "Afsona restaurant Tashkent City", "ic": "🥟", "ig": "meal"}, {"id": "botanic", "name": "Ботанический сад и зоопарк", "lat": 41.3445, "lon": 69.3153, "kind": "park", "list": 36, "note": "Полдня на северо-востоке.", "gq": "Tashkent Botanical Garden"}, {"id": "chimgan", "name": "Большой Чимган (92 км)", "lat": 41.55, "lon": 70.03, "kind": "nature", "list": 38, "approx": true, "gq": "Big Chimgan"}, {"id": "charvak", "name": "Чарвакское водохранилище (94 км)", "lat": 41.63, "lon": 69.98, "kind": "nature", "list": 39, "approx": true, "gq": "Charvak Reservoir"}, {"id": "urungach", "name": "Нефритовые озёра Урунгач (144 км)", "lat": 41.655, "lon": 70.2, "kind": "nature", "list": 40, "approx": true, "gq": "Urungach lakes"}], "dishes": [{"name": "Плов (ош)", "fact": "В 2016 году ЮНЕСКО внесло культуру плова в список нематериального наследия. Семь составляющих: лук, морковь, мясо, жир, соль, вода, рис; хрустящую корку со дна казана отдают ошпазу — мастеру плова; утренний свадебный плов зовут нахорги ош."}, {"name": "Нарын (норин)", "fact": "Тонко нарезанная домашняя лапша с варёной кониной и казы (конской колбасой), едят холодным, бульон — отдельно в пиале. Ташкентское блюдо."}, {"name": "Самса из тандыра", "fact": "Пирожки лепят на раскалённую стенку тандыра — глиняной печи; курдюк (бараний жир) делает начинку сочной."}, {"name": "Лагман", "fact": "Тянутая лапша уйгурского происхождения: один кусок теста вытягивают и складывают, пока он не станет пучком тонких нитей."}, {"name": "Нон (лепёшка)", "fact": "Узор в центре ставят чекичем — штампом с иглами, чтобы середина не вздувалась; лепёшку ломают, а не режут; упавший хлеб отдают птицам. CNN в 2025 году включил её в 50 лучших хлебов мира."}, {"name": "Шашлык", "fact": "Баранина с курдюком (бараньим жиром), люля, жигар (печень); с сырым луком и лепёшкой."}, {"name": "Чучвара", "fact": "Крошечные пельмени: чем мельче, тем больше уважения мастерице."}, {"name": "Манты", "fact": "На пару в многоярусной кастрюле-каскане; осенью — тыквенные (ошкавок)."}, {"name": "Казы", "fact": "Конская колбаса, которую кочевники заготавливали впрок; её кладут в нарын и свадебный плов."}, {"name": "Нават и парварда", "fact": "Нават — кристаллы сахара, выращенные на виноградном соке, их кладут в чай вместо сахара; парварда — тянутая карамель-«подушечка»."}, {"name": "Курт", "fact": "Сушёные солёные шарики из кисломолочного продукта — «вечная» еда кочевников и пастухов."}, {"name": "Зелёный чай", "fact": "Кайтарма (от «возвращаться»): заваренный чай трижды переливают из чайника в пиалу и обратно. Почётному гостю наливают немного — чтобы чаще ухаживать за ним."}, {"name": "Сумаляк", "fact": "Только к Наврузу, празднику весны в марте: пророщенную пшеницу варят всю ночь, на дно кладут камешки — кому попадётся, загадывает желание."}], "food": [{"id": "f_chorsu_sweets", "name": "Чорсу: кондитерский ряд и ряд сухофруктов", "cat": "dessert", "lat": 41.3262, "lon": 69.2369, "approx": true, "near": "chorsu", "day": "day1", "order": "Нават (лучше янтарный, «виноградный»), белая парварда, пашмак, кокандская или фисташковая халва, козинаки, арахис в сахаре и кунжуте, солёные абрикосовые косточки. Сначала попросите попробовать, потом торгуйтесь.", "why": "WE Project (03.09.2026): ряд сладостей стоит в продуктовом павильоне рядом с рядами сухофруктов и молочным под голубым куполом; ассортимент — нават, парварда, пашмак, халва, козинаки. Aviasales (14.11.2025) советует брать на Чорсу именно свежую халву и фисташки. Ориентир цен (travelto, 2026): нават 15–60 тыс., халва и парварда 20–150 тыс. сум.", "hook": "Здесь сахар не насыпают ложкой, а откалывают кристаллами, выращенными на нитке.", "hours": "базар ≈05:00–20:00 (неофициально)", "caution": "Названных лавок или династий халвачей источники не дают, точка ряда приблизительная. Ярко-оранжевая курага может быть обработана сернистым газом, натуральная темнее.", "legend": true, "near_days": {"day1": {"stop": "chorsu", "m": 0.0}, "day2": {"stop": "tcity", "m": 1440.0}, "day4": {"stop": "d4_afsona", "m": 1390.0}}, "gq": "Chorsu Bazaar", "ic": "🍬", "ig": "dessert", "lg": true}, {"id": "f_alay_sweets", "name": "Алайский базар: восточные сладости и сухофрукты", "cat": "dessert", "lat": 41.31878, "lon": 69.28511, "approx": false, "near": "alay", "day": "day3", "order": "Нават, парварда, кишмиш, орехи, курага. Сравните цены с Чорсу: Алай считается «чище и дороже».", "why": "Старейший базар «нового города»: продуктовые ряды с восточными сладостями описывают advantour и tonkosti. Конкретных культовых лавок в источниках 2025–2026 нет.", "hook": "Чорсу — базар старого города, Алай — базар нового; сладости одни и те же, публика разная.", "hours": "≈07:00–17:00, понедельник выходной (по одному гиду)", "caution": "Культовые лавки не задокументированы. Координаты — центр базара (Nominatim).", "legend": false, "near_days": {"day2": {"stop": "timurids_museum", "m": 760.0}, "day3": {"stop": "alay", "m": 0.0}}, "gq": "Alay Bazaar", "ic": "🍬", "ig": "dessert"}, {"id": "f_ganga", "name": "Мороженое «на Ганге» (у метро «Гафур Гулям»)", "cat": "dessert", "lat": 41.32747, "lon": 69.24842, "approx": true, "near": "circus", "day": "day1", "order": "Классическая пара — «малина + абрикос» или шоколадное в рожке, на улице, «по старинке». С 2024 года есть пломбир и вишня-банан. Рожок 8–20 тыс., стаканчик 11 тыс. сум (2024).", "why": "Afisha.uz называет его «классикой жанра» (2013, тогда это был киоск напротив выхода из метро с «огромными очередями»), «легендарным» (2019, «много лет собирает толпы») и включает в топ-10 мороженого (28.06.2024).", "hook": "Ташкентцы десятилетиями называют это мороженое по универмагу «Ганга», а не по бренду.", "hours": "летний сезон; часы не найдены", "caution": "Точка приблизительная (безымянный киоск мороженого в OSM рядом с «Гангой»). В ноябре может не работать. Бренд «Ganga by Shashleek» в 2GIS оценён низко (3,2 из 13 оценок), связь с оригиналом неясна.", "legend": true, "near_days": {"day1": {"stop": "circus", "m": 540.0}, "day2": {"stop": "sheikhantaur", "m": 1020.0}, "day4": {"stop": "d4_afsona", "m": 1380.0}}, "gq": "Ganga ice cream", "ic": "🍦", "ig": "dessert", "lg": true}, {"id": "f_ganga_broadway", "name": "Киоск Ganga ice cream на Бродвее", "cat": "dessert", "lat": 41.312354, "lon": 69.275295, "approx": false, "near": "broadway", "day": "day2", "order": "Рожок с мороженым на прогулку по Сайилгох.", "why": "Киоски под тем же именем «Ganga» стоят на Сайилгох, 5/7 (2GIS). Это продолжение легенды «на Ганге» или просто тёзка, не подтверждено.", "hook": "Мороженое на Бродвее — такой же ташкентский ритуал, как семечки у стадиона.", "hours": "летом 09:00–23:00 (2GIS)", "caution": "Оценок нет. В 2GIS часы указаны только на летний период, в ноябре киоск может быть закрыт.", "legend": false, "near_days": {"day2": {"stop": "broadway", "m": 60.0}}, "gq": "Ganga ice cream", "ic": "🍦", "ig": "dessert"}, {"id": "f_dolce_italia", "name": "Dolce Italia у «Голубых куполов»", "cat": "dessert", "lat": 41.307072, "lon": 69.268422, "approx": false, "near": "blue_domes", "day": "day2", "order": "Фисташковое или «страчателла» джелато. 100 г ≈ 20 тыс. сум (2024).", "why": "Первое в Ташкенте кафе итальянского джелато, открыто в апреле 2013 года (Afisha 2013 и 2019). Есть в подборках Afisha 2024 и WE Project (09.04.2025).", "hook": "Десерт после лагмана из «Голубых куполов» прямо через бульвар.", "hours": "с ≈12:00", "caution": "Это не узбекская традиция, а местная классика джелато. Оценки по 12 филиалам сети разные (от 1 до 5 в 2GIS).", "legend": false, "near_days": {"day1": {"stop": "metro_kosmo", "m
