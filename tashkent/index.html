/* Layout: one-screen app — map fills, route panel docks right (desktop) or below (phone); player bar at the bottom. */
:root {
  --bg: #f6f3ee; --panel: #fffdf9; --fg: #1f1b16; --muted: #6e655a; --line: #e4ddd2;
  --day1: #b4472a; --day2: #12708f; --day3: #6b4fa0; --day4: #c0397a; --day5: #2f7d4f; --sk: #1f6fb2;
  --food: #c98a12; --dessert: #d6589a; --fast: #3b3a46; --drink: #7b4a2a; --hist: #7a5c2e; --opt: #8a8176; --chip: #efe8dd; --me: #1a73e8;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16130f; --panel: #1e1a15; --fg: #f1ebe2; --muted: #a79d90; --line: #332d25;
  --day1: #e2714f; --day2: #3fa9c9; --day3: #a58ad8; --day4: #e568a3; --day5: #5bb07f; --sk: #5aa2e0;
  --food: #e0a93a; --dessert: #e77bb2; --fast: #5a5966; --drink: #b07a55; --hist: #c9a46a; --opt: #9b9285; --chip: #2a251e; --me: #5b9cff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16130f; --panel: #1e1a15; --fg: #f1ebe2; --muted: #a79d90; --line: #332d25;
  --day1: #e2714f; --day2: #3fa9c9; --day3: #a58ad8; --day4: #e568a3; --day5: #5bb07f; --sk: #5aa2e0;
  --food: #e0a93a; --dessert: #e77bb2; --fast: #5a5966; --drink: #b07a55; --hist: #c9a46a; --opt: #9b9285; --chip: #2a251e; --me: #5b9cff; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto minmax(0, 1fr) auto; }
.app > * { min-width: 0; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0; font: 700 18px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
h1 small { display: block; font: 400 12px/1.4 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 3px; }
h1 a { color: inherit; text-decoration: none; }
.tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; min-width: 0; }
.tabs button, .btn { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--chip); color: var(--fg); padding: 7px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
#map { min-height: 0; background: #e8e2d8; }
aside { min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 4px 16px 24px; }
.day { padding-top: 14px; }
.day h2 { margin: 0 0 4px; font: 500 14px/1.3 var(--display); display: flex; align-items: center; gap: 8px; }
.day .meta { color: var(--muted); font-size: 12px; line-height: 1.45; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.stops { list-style: none; margin: 0; padding: 0; }
.stop details { border-radius: 8px; }
.stop details[open] { background: var(--chip); }
.stop summary { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 6px; border-radius: 8px; cursor: pointer; list-style: none; }
.stop summary::-webkit-details-marker { display: none; }
.stop summary:hover { background: var(--chip); }
.num { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 600 11px/24px var(--body); text-align: center; }
.num.food { border-radius: 6px; background: var(--food); }
.num.hist { background: var(--hist); font-style: italic; font-family: Georgia, serif; font-size: 13px; }
.stop .name { line-height: 1.35; font-weight: 500; }
.stop.history .name { font-weight: 400; font-style: italic; }
.stop .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stop.played .name::after { content: " ✓"; color: var(--muted); font-weight: 400; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; font-size: 12px; line-height: 1; display: grid; place-items: center; }
.play:hover { border-color: var(--fg); }
.play.on { background: var(--fg); color: var(--panel); }
.body { padding: 0 10px 10px 42px; font-size: 13px; line-height: 1.5; }
.body .hook { font-style: italic; margin: 0 0 6px; }
.body ul { margin: 0 0 6px; padding-left: 18px; }
.body li { margin-bottom: 4px; }
.body .lbl { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.body .warn { color: var(--muted); font-size: 12px; }
.body a, .note a { color: var(--me); }
.block { padding: 12px 6px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
.block .bt { font: 500 12px/1.3 var(--display); letter-spacing: 0.02em; }
.block .bs { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 2px; }
.move { color: var(--muted); font-size: 11.5px; padding: 0 0 2px 42px; }
.intro { margin: 2px 0 8px; }
.tag { display: inline-block; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 4px; vertical-align: 1px; font-weight: 500; font-style: normal; }
details[open] .tag { background: var(--panel); }
.tag.unesco { color: var(--day2); }
.tag.inter { color: var(--day3); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; padding: 12px 0 0; border-top: 1px solid var(--line); margin-top: 14px; }
.legend svg { vertical-align: middle; margin-right: 4px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dishes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.dishes li { font-size: 13px; line-height: 1.45; }
.dishes b { font-weight: 600; }
.player { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); }
.player .t { min-width: 0; }
.player .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .hint { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player input[type=range] { width: 100%; accent-color: var(--fg); margin: 4px 0 0; }
.player .big { width: 44px; height: 44px; font-size: 16px; }
.player .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; color: #fff; font: 600 11px/22px var(--body); text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); box-sizing: border-box; }
.pin.food { border-radius: 7px; background: var(--food); width: 22px; height: 22px; line-height: 18px; }
.pin.hist { width: 20px; height: 20px; line-height: 16px; background: var(--hist); font: italic 600 12px/16px Georgia, serif; }
.pin.home { font-size: 14px; background: #1f1b16; }
.pin.opt { width: 18px; height: 18px; line-height: 14px; font-size: 9px; background: var(--opt); }
.pin.optfood { width: 18px; height: 18px; line-height: 14px; font-size: 9px; background: var(--food); border-radius: 5px; opacity: .85; }
.pin.fi { background: var(--food); color: #000; border: 2px solid #fff; border-radius: 50%; width: 100%; height: 100%; box-sizing: border-box; font: 13px/1 system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; display: grid; place-items: center; padding: 0; box-shadow: 0 1px 5px rgba(0,0,0,.45); }
.pin.fi.small { font-size: 11px; border-width: 1.5px; }
.num.fi { width: 24px; height: 24px; background: var(--food); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.12); box-sizing: border-box; font: 12px/20px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
.fi { position: relative; overflow: visible; }
.fi .lg { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: #e0241b; color: #fff; border: 1.5px solid #fff; font: 800 9px/10px system-ui, sans-serif; text-align: center; box-sizing: border-box; }
.fi.dessert { background: var(--dessert); } .fi.fast { background: var(--fast); } .fi.drink { background: var(--drink); }
.pin.eve { width: 22px; height: 22px; line-height: 18px; font-size: 11px; background: #1f1b16; }
.me { width: 18px; height: 18px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25); box-sizing: border-box; }
.locate { width: 34px; height: 34px; display: grid; place-items: center; background: #fff; color: #1f1b16; border: 0; cursor: pointer; font-size: 18px; }
.locate.on { color: #1a73e8; }
.leaflet-popup-content { font: 13px/1.45 var(--body); margin: 12px 14px; max-width: 280px; }
.leaflet-popup-content b { font-weight: 600; }
.leaflet-popup-content a { color: #12708f; }
.leaflet-popup-content .play { display: inline-grid; vertical-align: middle; margin-right: 6px; background: #fff; color: #1f1b16; border-color: #ccc; }
.leaflet-container { font-family: var(--body); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 45% minmax(0, 1fr) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { margin-left: 0; overflow-x: auto; flex-wrap: nowrap; max-width: 100%; }
  .tabs button { flex: none; }
  .player .time { display: none; }
}
@media (prefers-reduced-motion: reduce) { .leaflet-fade-anim .leaflet-popup, .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style></head><body>
<div class="app">
  <header>

<script>
const PLAN = {"city": "Tashkent", "version": 2, "start": "~11:00", "home": {"id": "home", "name": "Старт", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true}, "days": [{"id": "day5", "order": 0, "title": "Последний день — ICHKARI, Анхор и закат на телебашне", "short": "Последний день", "date": "2026-11-08", "color": "#2f7d4f", "summary": "Иммерсивный дом ICHKARI → такси к монументу «Мужество» → белая мечеть Минор → гондолы по Анхору → Японский сад → мемориал Шахидлар → плов в Besh Qozon → закат на телебашне → ужин на гастроулице Шевченко и пешком домой. Это 2B с точки №9 до конца.", "blocks": [{"title": "ICHKARI", "from": "m_ichkari", "summary": "Дом 1920-х, комнаты как этапы жизни и аудиоспектакль в наушниках."}, {"title": "Землетрясение и Минор", "from": "m_courage", "summary": "Монумент «Мужество» и белая мечеть над каналом."}, {"title": "Вдоль Анхора", "from": "m_anhor_boat", "summary": "Гондола по Анхору, Японский сад и тихий мемориал жертв репрессий."}, {"title": "Плов и закат", "from": "m_beshqozon", "summary": "Главный плов-центр города и смотровая телебашни на закате."}, {"title": "Ужин на Шевченко", "from": "m_shevchenko", "summary": "Гастроулица с ночной жизнью и прогулка домой."}], "stops": [{"id": "home5", "name": "Старт", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "when": "~10:45, такси ~10 мин"}, {"id": "m_ichkari", "name": "ICHKARI — иммерсивный дом и аудиоспектакль", "lat": 41.2877, "lon": 69.2392, "kind": "sight", "interactive": true, "approx": true, "move": "taxi", "hook": "Иммерсивный дом-музей в семейном доме 1920-х: комнаты как этапы одной жизни и аудиоспектакль в наушниках.", "facts": ["Открыт 26 сентября 2026 года; основная экспозиция бесплатная, 11:00–20:00.", "Аудиоспектакль «Тени моего дома» — 2 часа, 60 000 сум, билеты на afisha.uz (на каждый день ноября).", "Во дворе кафе «Darcha» — одно домашнее блюдо в день."], "caution": "Заложено 2 часа под аудиоспектакль. Время начала не нашёл, проверь на afisha.uz. Если по времени не совпадает, осмотри дом (~45 мин) и смело иди дальше: запас останется на Японский сад и плов. Адрес: ул. Беларык, 30А, точка примерная.", "stay": 120, "when": "~11:00–13:00, открыт с 11:00", "gq": "ICHKARI Tashkent Belarik 30A"}, {"id": "m_h_rashidov", "name": "Минутка истории: Рашидов и хлопковое дело", "hook": "Шараф Рашидов четверть века руководил советским Узбекистаном и отстраивал Ташкент после землетрясения 1966 года, а после смерти из-за «хлопкового дела» его прах убрали из могилы в центре города.", "facts": ["Шараф Рашидов — первый секретарь ЦК Компартии Узбекистана, то есть фактический руководитель республики, с 15 марта 1959 года до смерти 31 октября 1983 года; ещё и писатель.", "В 1976 году Рашидов заявлял о сборе 4 млн тонн хлопка и обещал 5 млн; часть урожая существовала только на бумаге — это были приписки.", "Расследование приписок Политбюро поручило в феврале 1983 года; «хлопковое дело» — около 800 уголовных дел, более 4000 осуждённых (следственную группу возглавляли Тельман Гдлян и Николай Иванов).", "В 1984 году прах Рашидова перенесли из центра Ташкента на кладбище Чигатай; в независимом Узбекистане ему ставят памятники, его имя носят улицы."], "kind": "history", "approx": true, "move": "walk", "lat": 41.299285, "lon": 69.260288}, {"id": "m_courage", "name": "Монумент «Мужество» (землетрясение 1966)", "lat": 41.3239, "lon": 69.2724, "kind": "sight", "list": 29, "move": "taxi", "stay": 10, "hook": "Магнитуда ташкентского землетрясения 1966 года была всего около пяти, но очаг лежал прямо под центром города — на глубине нескольких километров.", "facts": ["26 апреля 1966 года, 5:23 утра; в эпицентре 8–9 баллов, трясло 10–12 секунд. Без крова остались больше 300 тысяч человек.", "Как город отстраивали после землетрясения — «В пути: Город, который отстроила вся страна» (следующий отрезок).", "Памятник 1976 года, скульптор Дмитрий Рябичев — он же автор головы Маркса, стоявшей в сквере Темура. Перед фигурами мужчины, заслоняющего женщину с ребёнком, — чёрный куб, расколотый трещиной, с циферблатом."], "look": ["Трещину через куб и стрелки на циферблате."], "when": "~13:10, такси ~15 мин", "gq": "Courage Monument Tashkent"}, {"id": "m_h_rebuild", "name": "В пути: Город, который отстроила вся страна", "hook": "После землетрясения 1966 года каждая республика строила в Ташкенте свои кварталы — на домах Чиланзара до сих пор написано «Киев — Ташкенту!».", "facts": ["Без крова остались больше 300 тысяч человек — примерно каждый пятый житель полуторамиллионного города. Постановлением от 14 июня 1966 года только РСФСР должна была построить 660 тысяч м² жилья.", "Приехали больше 25 тысяч строителей со всего СССР; москвичи строили микрорайоны Ц-1, 2, 4, 5, 6, Ц-7 — «украинский квартал».", "В Чиланзаре сохранились дома с надписями «Киев — Ташкенту!», «Саратов — Ташкенту!», «Сибирь — Ташкенту!», белорусские, литовские, эстонские, таджикские дома; проспект Бунёдкор тогда назывался проспектом Дружбы народов.", "К 1969 году построили больше 60 тысяч квартир; город восстановили примерно за три с половиной года."], "kind": "history", "approx": true, "move": "walk", "lat": 41.329832, "lon": 69.272988}, {"id": "m_minor", "name": "Мечеть Минор («Белая мечеть»)", "lat": 41.33545, "lon": 69.27504, "kind": "sight", "list": 31, "move": "walk", "stay": 15, "hook": "Мечеть Минор в народе зовут Белой мечетью — и её построили всего примерно за 15 месяцев.", "facts": ["Стройка с лета 2013 года, открытие 1 октября 2014-го, накануне Курбан-хайита — праздника жертвоприношения.", "Белый мрамор, бирюзовый купол, два минарета; зал на 2400 человек; тёплые полы.", "Стоит на набережной канала Анхор; «минор» и значит «минарет»."], "when": "~13:40", "gq": "Minor Mosque"}, {"id": "m_h_water", "name": "В пути: Вода Ташкента", "hook": "Ташкент — оазис: Чирчик, древний канал Бозсу и Анхор решили, где быть городу и где прошла граница между старым и новым Ташкентом.", "facts": ["Чирчик рождается при слиянии Чаткала и Пскема, длина 155 км, — крупнейший правый приток Сырдарьи.", "Бозсу — древний канал, отведённый от Чирчика, один из старейших в оазисе: 138–159 км, питает 23–25 каналов, в черте Ташкента орошает около 19 тысяч гектаров.", "Анхор («большой канал») — ветка Бозсу длиной около 23 км; в конце XIX — начале XX века граница: старый город на правом берегу, русский — на левом.", "Каналов в Ташкенте около 412 км, не считая мелких арыков — оросительных канавок вдоль улиц."], "kind": "history", "approx": true, "move": "walk", "lat": 41.336675, "lon": 69.274894}, {"id": "m_anhor_boat", "name": "Гондолы на Анхоре (Anhor Cruises), по желанию", "lat": 41.337957, "lon": 69.275831, "kind": "sight", "optional": true, "interactive": true, "move": "walk", "stay": 25, "hook": "По каналу, который полтора века делил Ташкент на старый и русский город, можно проплыть на гондоле.", "facts": ["Точка катания Anhor Cruises (2GIS: 4,0 по 73 оценкам): по отзывам 60 000 сум с человека, катание 7–10 минут — до моста и обратно.", "Анхор — ветка древнего канала Бозсу; в конце XIX — начале XX века по нему шла граница: старый город на правом берегу, русский — на левом."], "look": ["Белую мечеть Минор с воды."], "caution": "2GIS: ежедневно 09:00–23:00, но в отзывах бывает «закрыты на ремонт» и «сегодня выходной»; ноябрьский сезон не подтверждён. Позвони +998 99 789 00 77 или проверь @anhorcruise. Кататься лучше до заката.", "when": "~14:00, по желанию", "gq": "Anhor Cruises Tashkent"}, {"id": "m_japan", "name": "Японский сад", "lat": 41.339, "lon": 69.282, "kind": "sight", "list": 32, "move": "walk", "stay": 25, "hook": "Японский сад — знак дружбы и примирения в городе, где после Второй мировой японские военнопленные строили театр Навои.", "facts": ["Открыт 25 августа 2001 года, к 10-летию независимости, при участии посольства Японии; пруд с карпами, мостики, чайный павильон, сад камней.", "Связка с театром Навои: там в 1945–1947 годах работали пленные японские солдаты Квантунской армии, а здесь — сад дружбы."], "caution": "10:00–22:00, ~30 000 сум.", "when": "~14:30", "gq": "Japanese Garden Tashkent"}, {"id": "m_h_repressions", "name": "Минутка истории: Тридцать восьмой год", "hook": "За две недели октября 1938 года, в разгар сталинских репрессий, в Ташкенте приговорили к расстрелу около пятисот человек: от поэтов до министров.", "facts": ["В марте 1938 года на показательном процессе в Москве вместе с видным большевиком Николаем Бухариным осуждены и расстреляны Файзулла Ходжаев (глава правительства Узбекской ССР, ранее — Бухарской народной республики, сменившей эмират) и Акмаль Икрамов (первый секретарь компартии республики).", "4–15 октября 1938 года в Ташкенте выездная коллегия Верховного суда СССР приговорила к расстрелу около 500 человек.", "Писатель Абдулла Кадыри (автор первого узбекского романа), учёный и драматург Фитрат и поэт Чулпан расстреляны 4 октября 1938 года; Чулпан — у реки Бозсу.", "Фитрат реабилитирован в 1956-м, Кадыри — в 1957-м, Ходжаев — в 1966 году."], "kind": "history", "approx": true, "move": "walk", "lat": 41.340644, "lon": 69.285488}, {"id": "m_shahidlar", "name": "Мемориал «Шахидлар хотираси» (сад и ротонда)", "lat": 41.34742, "lon": 69.28799, "kind": "sight", "list": 34, "move": "walk", "stay": 10, "hook": "Тихий парк у телебашни — место расстрелов 1920–30-х годов. Здесь погибли писатели Абдулла Кадыри, Фитрат и Чулпан, классики узбекской литературы.", "facts": ["С 1920-х до войны здесь расстреливали; на территории три места захоронений. Кадыри, Фитрата и Чулпана расстреляли 4 октября 1938 года.", "Мемориал «Память шахидов» (мучеников) создан в 2000 году; 31 августа стало Днём памяти жертв репрессий. Музей внутри обычный — смотрим сад и бирюзовую ротонду."], "look": ["Бирюзовый купол-ротонду."], "when": "~15:15", "gq": "Shahidlar Xotirasi memorial"}, {"id": "m_beshqozon", "name": "Besh Qozon — Центр плова (флагман)", "lat": 41.3476, "lon": 69.2852, "kind": "food", "list": 33, "move": "walk", "stay": 45, "order": "Чайханский плов на тёмном рисе девзира — для сравнения со свадебным из части 1; ачичук (салат из помидоров с луком), сюзьма (густой кислый творог). ~53 000 сум.", "hook": "В Центре плова Besh Qozon («пять казанов») каждый казан рассчитан на 50 килограммов риса, и плов варят под открытым небом.", "facts": ["Все пять казанов видно примерно с 11 до 15 часов; к вечеру работает один. Если хочешь шоу — меняй порядок и иди сюда раньше.", "Начинался во дворе, теперь двухэтажный зал примерно на 500 мест."], "caution": "Все пять казанов видно примерно до 15:00; ближе к вечеру работает один — плов будет, шоу меньше.", "legend": true, "when": "~15:30 — к вечеру работает меньше казанов, плов есть", "gq": "Besh Qozon Central Asian Plov Centre", "ic": "🍚", "ig": "meal", "lg": true}, {"id": "m_tvtower", "name": "Ташкентская телебашня — смотровая", "lat": 41.3456, "lon": 69.2847, "kind": "sight", "list": 30, "move": "walk", "stay": 50, "hook": "Телебашню высотой 375 метров построили в сейсмической зоне — через 12 лет после того, как землетрясение 1966 года разрушило город.", "facts": ["Строили с 1978 года, открыта 15 января 1985-го; 220 метров из 375 — металлическая антенна. Третья по высоте в СССР после Останкино и Киева.", "Смотровая площадка — около 97 метров, лифт поднимается за 21 секунду.", "Вращающийся ресторан «Коинот» — оборот примерно за 45 минут; отзывы — «привет из 90-х», ночью из-за бликов вида почти нет."], "caution": "Нужен паспорт. Цена для иностранцев ~100 000 сум; часы 10–20 (уточни: +998 71 202 35 70). Закат около 17:00.", "when": "~16:20, закат около 17:05", "look": ["После заката — подсвеченную башню снизу, от Японского сада или у Besh Qozon."], "gq": "Tashkent TV Tower"}, {"id": "m_h_aral", "name": "Минутка истории: Шевченко, Арал и белое золото", "hook": "Украинский поэт Тарас Шевченко, в честь которого названа улица, где ты ужинаешь, рисовал Аральское море, когда оно ещё было морем.", "facts": ["Шевченко, в 1847 году сосланный солдатом в Оренбургский край, участвовал в экспедиции Алексея Бутакова на шхуне «Константин» (1848–1849) и делал зарисовки Арала.", "В 1960 году Арал — около 68 тысяч кв. км, четвёртое по площади озеро мира; с 1960-х питавшие его Амударью и Сырдарью разобрали на орошение хлопка — «белого золота».", "К 2007 году осталось около 10% площади; в 2014 году восточная чаша высохла, на дне — новая пустыня Аралкум; порт Муйнак (около 30 тысяч рабочих мест в рыбной отрасли) теперь в 30–90 км от воды.", "Плотина Кокарал (2005) подняла уровень Малого (Северного) Арала в Казахстане на 12 м к 2008 году."], "kind": "history", "approx": true, "move": "walk", "lat": 41.3129, "lon": 69.279933}, {"id": "m_shevchenko", "name": "Гастроулица Тараса Шевченко — ужин и вечерняя прогулка", "lat": 41.2996, "lon": 69.278, "kind": "food", "move": "taxi", "stay": 90, "when": "~17:30, ужин", "order": "Выбирай по настроению: второй зал Afsona (Шевченко, 28/30 — тыквенные манты, ханум), Tim's Coffee & Roastery (Шевченко, 40), десерты.", "hook": "Улица Тараса Шевченко стала первой в Ташкенте гастрономической улицей: кафе вынесли столы на тротуар, и город начал жить ночью.", "facts": ["Запущена в октябре 2024 года в Мирабадском районе; дальше по её образцу открыли гастроулицу на Бунёдкоре (июль 2025, 90 заведений) и задумали семикилометровую в Алмазаре на 250 мест.", "Идея гастроулиц — ночная экономика: заведения работают допоздна, часть круглосуточно."], "legend": false, "gq": "Taras Shevchenko street Tashkent", "ic": "🍽️", "ig": "meal"}, {"id": "m_h_plov", "name": "В пути: Утренний плов", "hook": "ЮНЕСКО внесло в список наследия не рецепт плова, а обычаи вокруг него — главный из них плов на рассвете.", "facts": ["В 2016 году «Культура и традиции плова» Узбекистана внесены в Репрезентативный список нематериального наследия ЮНЕСКО.", "Нахорги ош — утренний плов к свадьбе или поминкам: накануне соседи-мужчины вместе режут морковь (сабзи тўграр), огонь разводят после полуночи, гостей зовут на рассвете после утренней молитвы — к 7 утра всё заканчивается.", "Классический плов — семь составляющих: лук, морковь, мясо, жир, соль, вода, рис. Хрустящую корку со дна казана по обычаю отдают ошпазу (повару) и его помощникам.", "Легенда: пловом угощали Александра Македонского на свадьбе с Роксаной."], "kind": "history", "approx": true, "move": "walk", "lat": 41.292783, "lon": 69.279049}, {"id": "home5b", "name": "Финиш", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "move": "walk", "when": "~19:00, 15 мин пешком"}]}, {"id": "day1", "title": "Часть 1 — Исторический Ташкент", "short": "Часть 1 · история", "date": "2026-11-02", "color": "#b4472a", "summary": "Сеульский парк → медресе Абулкасым → модернизм ЮНЕСКО (Дворец Дружбы, цирк) → Кукельдаш и Чорсу → махалли → Хаст-Имам и Центр исламской цивилизации → метро домой → по желанию ужин в «Караване».", "blocks": [{"title": "Корейский сад и мастерские", "from": "seoul", "summary": "Корейский сад и мастерские медресе Абулкасым; Magic City и парк Навои — мимо, они в части 3. Первая еда — на Чорсу."}, {"title": "Советский модернизм", "from": "dustlik", "summary": "Дворец Дружбы народов и цирк-«летающая тарелка» — Ташкент, отстроенный после 1966 года."}, {"title": "Кукельдаш и Чорсу", "from": "kukeldash", "summary": "Медресе-крепость, пятничная мечеть и базар под куполом — перекус."}, {"title": "Махалли", "from": "mahalla", "summary": "Переулки старого города: глухие стены, резные ворота, чайханы."}, {"title": "Хаст-Имам", "from": "kaffal", "summary": "Мавзолей святого покровителя Ташкента, медресе XVI века, Коран Усмана и лагман."}, {"title": "Домой на метро и ужин", "from": "metro_chorsu", "summary": "Станции-дворцы «Алишер Навои» и «Космонавтлар», от «Ойбека» пешком; по желанию ужин в «Караване» рядом с финишем."}], "stops": [{"id": "home1", "name": "Старт", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "when": "~11:00"}, {"id": "h_uzbekistan", "day": "day1", "after": "home1", "name": "Минутка истории: Узбекистан за полторы минуты", "hook": "Узбекистан — одна из двух стран мира (вторая — Лихтенштейн), откуда до океана нужно пересечь две границы. Три тысячи лет его истории — за полторы минуты, пока идёшь к плову.", "facts": ["Согд, Бактрия и Хорезм — древние земли-оазисы между реками Амударьёй и Сырдарьёй; через них шёл Великий шёлковый путь; в 328 году до н. э. сюда дошёл Александр Македонский.", "VIII век — арабы приносят ислам; при Саманидах, династии со столицей в Бухаре, край стал центром учёности: аль-Хорезми, Бируни, Ибн Сина; 1219–1225 — нашествие монголов Чингисхана; с 1370 года Тимур правит огромной державой из Самарканда.", "К XIX веку здесь три государства — Бухарский эмират, Хивинское и Кокандское ханства; Российская империя берёт Ташкент в 1865-м, а в 1876-м упраздняет Кокандское ханство.", "1924 — создана Узбекская ССР, республика в составе СССР; 31 августа 1991 — провозглашение независимости."], "kind": "history", "approx": true, "move": "walk", "lon": 69.256751, "lat": 41.289726}, {"id": "seoul", "name": "Сеульский парк (Seul bog'i)", "lat": 41.2898, "lon": 69.2525, "kind": "sight", "extra": true, "move": "walk", "stay": 30, "hook": "Корейский сад в Ташкенте — эхо 1937 года: Сталин приказал выселить всех корейцев с советского Дальнего Востока в Среднюю Азию, и около 172 тысяч человек за два месяца привезли сюда в товарных вагонах.", "facts": ["Сад — подарок Сеула: договорились в 2010-м, во время визита президента Ислама Каримова в Сеул, открыли 1 сентября 2014 года. В 2017-м добавили Колокол Мира — к 80-летию жизни корейцев в Узбекистане.", "Памятник депортации: вагон с цифрой «1937», корейская семья с узлами и узбекский аксакал (старейшина), протягивающий им руку. Надпись на узбекском, корейском и русском — благодарность узбекскому народу.", "Постановление советского правительства и ЦК партии о выселении корейцев с Дальнего Востока подписано 21 августа 1937 года; официальный повод — «пресечение японского шпионажа». За два месяца вывезли ~172 тысячи человек; первую зиму многие провели в землянках, и многие её не пережили.", "Корейский колхоз «Полярная звезда» под Ташкентом (председатель Ким Пен Хва) дал 24 Героя Социалистического Труда. А «корейская морковка» — изобретение советских корейцев (корё-сарам): в самой Корее такого блюда нет."], "look": ["Бронзовую руку аксакала на памятнике.", "Изогнутые черепичные крыши — в Средней Азии таких не строят."], "caution": "Вход может быть платным.", "gq": "Seoul Park Tashkent"}, {"id": "h_tashkent", "day": "day1", "after": "seoul", "name": "Минутка истории: Каменный город", "hook": "Чач, Шаш, Бинкет, Ташкент: у города четыре имени и спорный, но официальный возраст в две тысячи двести лет.", "facts": ["Старые имена: Чач, Шаш, Бинкет; имя «Ташкент» впервые — в XI веке у учёных Бируни и Махмуда Кашгари («таш» — камень, «кент» — город).", "2200-летие отмечено в 2009 году по резолюции 34-й Генеральной конференции ЮНЕСКО (2007); дата опирается на раскопки древних городищ в черте города (Мингурюк, Шаштепа), так что это скорее возраст оазиса, чем точный день рождения.", "1219 — город разорил Чингисхан; затем Тимуриды (потомки Тимура) и Шейбаниды (узбекская династия XVI века); с 1808/1809 — Кокандское ханство из Ферганской долины; 1865 — взятие русскими войсками генерала Черняева.", "После 1865 года за каналом Анхор вырос европейский «новый город»; с 1930 года Ташкент — столица Узбекистана; сегодня больше 3 млн жителей."], "kind": "history", "approx": true, "move": "walk", "lon": 69.250823, "lat": 41.292367}, {"id": "h_timurids", "day": "day1", "after": "h_tashkent", "name": "Минутка истории: Тимуриды и внук из Ташкента", "hook": "У Тадж-Махала есть ташкентский след: здесь жил и умер дед Бабура — основателя индийской империи Великих Моголов, чей потомок и построил Тадж-Махал.", "facts": ["С 1370 года завоеватель Тимур правит державой из Самарканда; в 1391 году он выступил из Ташкента в поход на Тохтамыша, хана Золотой Орды; умер в 1405 году; его потомков называют Тимуридами.", "Юнус-хан, потомок Чингисхана, занял Ташкент в 1484 году и умер здесь в 1487-м; его дочь — мать Бабура.", "Бабур (род. 1483, Андижан) — по отцу потомок Тимура; потеряв родную Фергану, искал приюта в Ташкенте; в 1526 году, победив в битве при Панипате в Индии, основал империю Великих Моголов.", "Мемуары «Бабур-наме» написаны по-тюркски, на чагатайском языке — том самом, на котором писал и за который заступался поэт Алишер Навои, живший при дворе Тимуридов."], "kind": "history", "approx": true, "move": "walk", "lon": 69.248885, "lat": 41.29985}, {"id": "h_jadids", "day": "day1", "after": "h_timurids", "name": "Минутка истории: Джадиды, люди нового метода", "hook": "В медресе (исламской школе), куда ты идёшь, учились Абдулла Кадыри и Мунаввар-кары — джадиды, мусульманские реформаторы начала XX века, которые хотели заново изобрести школу, газету и роман.", "facts": ["Слово — от «усули джадид», «новый метод» обучения: чтение по звукам вместо заучивания наизусть, светские предметы; первую такую школу открыл крымский татарин Исмаил Гаспринский в 1884 году.", "Мунаввар-кары открыл школу нового метода в Ташкенте у себя дома в 1901 году, в 1906-м основал газету «Хуршид»; расстрелян по приговору ОГПУ (советской госбезопасности) в 1931 году.", "Бухарец Фитрат выпустил книгу «Спор бухарского учителя с европейцем» (1911); Абдулла Кадыри написал «Минувшие дни», первый узбекский роман.", "Многие джадиды поддержали Туркестанскую (Кокандскую) автономию — местную власть в Коканде (1917–1918), разгромленную красными через три месяца; позже советская власть объявила джадидов врагами, сегодня их чтят как национальных героев."], "kind": "history", "approx": true, "move": "walk", "lon": 69.246301, "lat": 41.304699}, {"id": "abulkasim", "name": "Медресе Абулкасым (мастерские ремесленников)", "lat": 41.3067, "lon": 69.24, "kind": "sight", "extra": true, "move": "walk", "stay": 25, "hook": "Медресе (исламскую школу) Абулкасым построил переплётчик книг — и сегодня здесь снова работают руками: режут дерево, пишут миниатюры, чеканят металл.", "facts": ["Основатель — ташкентский суфий (мусульманский мистик) Абулкасимхан-ишан, переплётчик по профессии, вкладывал заработок в медресе. Дата спорная: хронограмма (дата, зашифрованная буквами надписи) даёт 1849 год, русская Википедия — 1864.", "Здесь учились джадиды (мусульманские реформаторы-просветители) Абдулла Кадыри и Мунаввар-кары — о них минутка истории по дороге сюда.", "Почти весь старый комплекс с мечетью и баней снесли в советское время, медресе уцелело. Сейчас в его 20 худжрах — бывших кельях студентов — мастерские: миниатюра, резьба, ювелирка — можно смотреть, как работают."], "look": ["Контраст: медресе XIX века между модернистским Дворцом Дружбы и парламентом."], "gq": "Abulkasim Madrasah"}, {"id": "h_bread_city", "day": "day1", "after": "abulkasim", "name": "Минутка истории: Ташкент — город хлебный", "hook": "«Ташкент — город хлебный»: название повести 1923 года стало поговоркой, а во Вторую мировую войну, когда сюда эвакуировали людей и заводы, сбылось всерьёз.", "facts": ["Повесть Александра Неверова «Ташкент — город хлебный» (1923): мальчик Мишка в голод в Поволжье едет сюда за хлебом; фильм 1967 года снял Шухрат Аббасов по сценарию Андрея Кончаловского и Андрея Тарковского.", "Оценки числа эвакуированных в Узбекистан в войну расходятся: от ~0,5 млн (ООН) до 1,5 млн (посольство Узбекистана).", "В республику перевезли больше сотни предприятий; 20 ноября 1941 года в Ташкент пришёл первый эшелон авиазавода из подмосковных Химок.", "Поэтесса Анна Ахматова жила в Ташкенте в эвакуации с ноября 1941 по май 1944 года."], "kind": "history", "approx": true, "move": "walk", "lon": 69.239882, "lat": 41.308638}, {"id": "dustlik", "name": "Площадь Дружбы народов: Дворец + памятник Шамахмудовым", "lat": 41.3095, "lon": 69.2414, "kind": "sight", "list": 13, "unesco": true, "move": "walk", "stay": 20, "hook": "У ташкентского кузнеца Шаахмеда Шамахмудова и его жены не было своих детей. За войну их стало четырнадцать — и все разных национальностей.", "facts": ["Шамахмудов и его жена Бахри Акрамова в годы Второй мировой усыновили сирот, эвакуированных в Ташкент: русских, белорусов, татар, евреев, молдаван, казахов. По их истории снят фильм «Ты не сирота» (1962).", "Памятник семье поставили в 1982 году; в 2008-м его ночью без объявлений увезли на окраину, где он ветшал. В 2017-м его поставили в парке Дружбы (рядом с Сеульским садом), а 9 мая 2018-го вернули сюда — тогда же площади вернули имя «Дружба народов».", "Дворец Дружбы народов (1981, архитектор Евгений Розанов) — зал почти на 4000 мест; ламели фасада — солнцезащитные пластины — дают тень и тягу воздуха. С июля 2026 года — в списке Всемирного наследия ЮНЕСКО (подробнее — «В пути: Ташкентский модернизм»)."], "look": ["Лица детей в скульптуре — попробуй угадать национальности.", "«Жалюзи» фасада дворца."], "caution": "Число детей: 14 по семье, 15 по некоторым источникам.", "gq": "Palace of Friendship of Peoples"}, {"id": "h_modernism", "day": "day1", "after": "dustlik", "name": "В пути: Ташкентский модернизм", "hook": "Почему советский Ташкент такой — бетон, решётки, бирюза и орнамент — и за что ЮНЕСКО в 2026 году внесло в список сразу десять его построек.", "facts": ["26 апреля 1966 года, в 5:23 утра, очаг землетрясения оказался прямо под центром Ташкента; сильнее всего пострадали глинобитные дома старого города, без крова остались сотни тысяч человек.", "Новый город строили из бетона с расчётом на толчки и на жару: солнцезащитные ламели, бетонные решётки, тень и сквозняки; снаружи и внутри — узбекский орнамент, мозаика, ганч (резной алебастр).", "26 июля 2026 года на 48-й сессии Комитета всемирного наследия в Пусане «Модернистскую архитектуру Ташкента» (постройки 1960-х — начала 1990-х) внесли в список ЮНЕСКО — первый новый объект Узбекистана за 25 лет.", "Десять объектов: Дворец Дружбы народов, цирк, Чорсу, станция «Космонавтлар», Музей истории, Музей искусств, дом «Жемчуг», Центральный выставочный зал, Дворец кино «Панорама» и гелиокомплекс «Солнце» в Паркентском районе (~45 км от Ташкента)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.243054, "lat": 41.319127}, {"id": "circus", "name": "Ташкентский цирк — «летающая тарелка»", "lat": 41.3248, "lon": 69.243, "kind": "sight", "list": 7, "unesco": true, "move": "walk", "stay": 15, "hook": "После землетрясения 1966 года ташкентский цирк десять лет жил в шапито. Потом над площадью Хадра опустилась бирюзовая «летающая тарелка» — новое здание цирка.", "facts": ["Первое здание цирка 1914 года разрушило землетрясение 1966-го. Новое открыли в 1976-м — проект ташкентского городского проектного института Ташгипрогор, рассчитанный на сейсмику.", "Купол диаметром около 77 метров сравнивают с перевёрнутой пиалой; опоры вынесены наружу, поэтому внутри нет ни одной колонны.", "Узбекский цирковой коллектив 1942 года — первый национальный цирк в СССР; династии канатоходцев-дорбозов Ташкенбаевых и Зариповых выступают до сих пор."], "look": ["«Чешую» купола — и то, что под ним нет колонн."], "food_near": "Гумма (жареные пирожки) в столовой Xadra milliy taomlari в 100 м — копейки.", "gq": "Tashkent State Circus"}, {"id": "h_kokand", "day": "day1", "after": "circus", "name": "Минутка истории: Кокандское ханство", "hook": "Полвека, с 1808/1809 по 1865 год, Ташкентом правили из Коканда — столицы ханства в Ферганской долине, и за этот богатый город воевали все соседи.", "facts": ["Кокандское ханство основано в Ферганской долине: в 1709 году вождь племени минг Шахрух-бий заложил крепость под Кокандом.", "Кокандский правитель Алим-хан взял Ташкент в 1808 или 1809 году (источники расходятся); городом правил наместник из Коканда — бекларбеги.", "1842 — эмир соседней Бухары Насрулла вторгся в Коканд и казнил кокандского правителя Мадали-хана; Ташкент на время перешёл к Бухаре.", "Кокандский полководец Алимкул погиб в бою с русскими под Ташкентом в мае 1865 года; в 1876 году Россия упразднила ханство, его земли стали Ферганской областью."], "kind": "history", "approx": true, "move": "walk", "lon": 69.242196, "lat": 41.322643}, {"id": "kukeldash", "name": "Медресе Кукельдаш", "lat": 41.3234, "lon": 69.2363, "kind": "sight", "list": 11, "move": "walk", "stay": 25, "hook": "Медресе (исламская школа) Кукельдаш успело побывать караван-сараем, крепостью и музеем атеизма, а по преданию с его стены сбрасывали неверных жён.", "facts": ["Построено около 1570 года, при Шейбанидах — узбекской династии XVI века, — визирем Кульбабой по прозвищу Кукельдаш, то есть «молочный брат» правителя. Крупнейшее из 23 медресе старого Ташкента; стоит на остатках стены древнего шахристана — укреплённого ядра города.", "В 1830-х часть здания разобрали на кирпич для соседнего медресе Беклярбеги. Землетрясение 1966 года оно пережило — одно из немногих старых культовых зданий.", "Предание: около 1860 года, при кокандцах — Ташкент тогда входил в Кокандское ханство с центром в Ферганской долине, — с верхнего парапета в мешках сбрасывали жён, уличённых в измене."], "look": ["Портал из жёлтого жжёного кирпича и угловые башенки-гульдасты, с которых звали на молитву."], "gq": "Kukeldash Madrasah"}, {"id": "juma", "name": "Джума-мечеть Ходжи Ахрора Вали", "lat": 41.32375, "lon": 69.23714, "kind": "sight", "list": 10, "move": "walk", "stay": 10, "hook": "Ремонт этой мечети в 1880-х оплатили деньгами, которые бухарский эмир подарил русскому царю Александру III на коронацию.", "facts": ["Первую пятничную (главную) мечеть здесь построили в 1451 году на средства шейха Ходжи Ахрора — главы суфийского (мистического) ордена Накшбандия и одного из богатейших людей своего времени.", "После землетрясения 1868 года на ремонт пустили 15 000 рублей из дара эмира Бухары Музаффара Александру III на коронацию 1883 года. Ремонт вели русские инженеры — отсюда стрельчатые, почти готические арки; мечеть открыли вновь в 1888 году.", "В советское время здесь были учреждения и даже кинотеатр; в 2003 году мечеть отстроили заново — уже с тремя куполами вместо одного."], "look": ["Стрельчатые арки входа — след ремонта 1888 года."], "gq": "Khoja Akhror Vali Jome Mosque"}, {"id": "chorsu", "name": "Базар Чорсу — перекус", "lat": 41.3262, "lon": 69.2369, "kind": "sight", "list": 9, "unesco": true, "move": "walk", "stay": 60, "order": "Норин (холодная лапша с кониной) с казы (конской колбасой), самса из тандыра (глиняной печи), горячая лепёшка, в молочном ряду — курт (сушёные солёные шарики) и сюзьма (густой кислый творог), в кондитерском — нават (кристаллы сахара), парварда (тянутая карамель), халва. Наличные, торг уместен. Плов здесь брать не советуют.", "hook": "Под этим куполом продают мясо и специи — и с июля 2026 года это объект Всемирного наследия ЮНЕСКО, наравне с дворцами.", "facts": ["«Чорсу» по-персидски — «четыре стороны», перекрёсток четырёх дорог. В советское время рынок назывался «Октябрьский».", "Купол спроектировали в 1980 году, строили вместе с метро «Чорсу»; рынок открыли в 1990-м. Главный купол — около 80 метров, вокруг семь малых.", "В мае 2022 года один из малых куполов попытались снести; после шума в прессе Агентство культурного наследия подтвердило, что все купола охраняются.", "Нон ломают руками, а не режут; класть лепёшку лицом вниз — неуважение. Узор в центре ставят чекичем — штампом с иглами, чтобы середина не вздувалась."], "look": ["Галерею специй второго этажа — оттуда виден весь круг.", "Радиальные рёбра купола изнутри."], "gq": "Chorsu Bazaar"}, {"id": "h_conquest", "day": "day1", "after": "chorsu", "name": "Минутка истории: Штурм 1865 года", "hook": "В 1865 году русский генерал Михаил Черняев, которому запретили штурмовать Ташкент, всё же взял город, где защитников было в десятки раз больше, чем солдат в его отряде.", "facts": ["Ташкентом тогда владело Кокандское ханство; глинобитная стена старого города — около 24–25 км, с десятком с лишним ворот.", "Военный министр запретил штурм из-за нехватки сил, но Черняев пошёл вопреки запрету; отряд — от ~1000–1300 до ~2000 человек против, по разным данным, 15–30 тысяч защитников.", "Ночь на 15 (27) июня 1865 — штурм через Камаланские ворота (даты по старому и новому стилю); 17 (29) июня старейшины сдали город; русские потери — 25 убитых.", "1867 — Российская империя создаёт Туркестанское генерал-губернаторство (наместничество в Средней Азии) со столицей в Ташкенте; первый генерал-губернатор — Константин Петрович фон Кауфман."], "kind": "history", "approx": true, "move": "walk", "lon": 69.239437, "lat": 41.329422}, {"id": "mahalla", "name": "Махалли Старого города (Эски Шахар)", "lat": 41.3335, "lon": 69.239, "kind": "sight", "list": 1, "approx": true, "move": "walk", "stay": 30, "hook": "Раньше границу махалли — соседского квартала — определяли на слух: она кончалась там, где переставал быть слышен азан (призыв на молитву) своей мечети.", "facts": ["Махалля — соседская община с самоуправлением; свадьбы, похороны, уборку улиц делают сообща — такая общая бесплатная работа называется хашар.", "Центр махалли — гузар: перекрёсток с мечетью, чайханой и лавками. Чайхана — мужской клуб квартала, старший — аксакал («белая борода»).", "Старого города осталось мало: землетрясение 1966 года сильнее всего ударило по глинобитным домам, и при восстановлении на месте многих махаллей проложили проспекты. Кварталы у площади Хаст-Имам — то, что уцелело."], "look": ["Глухие стены и резные ворота: дом развёрнут внутрь, во двор-ховли с айваном (крытой террасой на столбах) и виноградником.", "Скамейку у ворот и чайхану на перекрёстке."], "note": "Идти переулками, а не по проспекту."}, {"id": "kaffal", "name": "Мавзолей Каффаля Шаши", "lat": 41.33818, "lon": 69.23808, "kind": "sight", "list": 6, "move": "walk", "stay": 15, "hook": "Святой покровитель Ташкента в юности был слесарем: «каффаль» по-арабски — «мастер замков».", "facts": ["Абу Бакр аль-Каффаль аш-Шаши (903–976) родился в Шаше — так тогда звался Ташкент. Учился в Багдаде, Сирии и Хиджазе (запад Аравии с Меккой и Мединой) и принёс в Мавераннахр — земли между Амударьёй и Сырдарьёй — шафиитскую школу исламского права.", "В народе его звали «Хазрати Имам» — «Святой Имам»; отсюда название всей площади, Хаст-Имам.", "Нынешнее здание 1541–1542 годов строил ханский зодчий Гулям Хусейн — его имя написано над дверью.", "Предания: знал 72 языка, перевёл Тору на арабский, и за это освободили 10 тысяч пленных мусульман; в награду попросил у халифа денег на арыки (оросительные каналы) Шаша."], "look": ["Надпись над дверью с именем зодчего."], "gq": "Kaffal Shashi Mausoleum"}, {"id": "barakhan", "name": "Медресе Барак-хана", "lat": 41.33696, "lon": 69.23894, "kind": "sight", "list": 2, "move": "walk", "stay": 15, "hook": "Медресе носит имя Барак-хана, которого здесь нет: он похоронен в Самарканде, а одна из усыпальниц так и зовётся «Безымянной».", "facts": ["Медресе (исламская школа) закончено в 1531–1532 годах при Наурузе Ахмад-хане из Шейбанидов — узбекской династии XVI века, — прозванном Барак-ханом («удачливым»). Строил ханский зодчий Гулям Хусейн, автор мавзолея Каффаля Шаши.", "Купол мавзолея Суюнидж-хана, первого шейбанидского правителя Ташкента, был покрыт голубой плиткой — отсюда «Кок гумбаз» («Голубой купол»); он рухнул при землетрясении 1868 года.", "Здесь были общежитие, общество слепых, склад, а до 2007 года — муфтият, Управление мусульман Узбекистана."], "look": ["Тимпан — полукруглое поле над входной аркой: шестигранные майоликовые (глазурованные) плитки складываются в один узор — лучший шейбанидский декор Ташкента."], "gq": "Barak Khan Madrasah"}, {"id": "tilla", "name": "Мечеть Тилля Шейх", "lat": 41.33675, "lon": 69.2399, "kind": "sight", "list": 3, "move": "walk", "stay": 10, "hook": "«Мечеть Золотого шейха» одной из первых в СССР снова открылась в 1943 году — в разгар войны.", "facts": ["Построена в середине XIX века, перестроена на рубеже XIX–XX веков; в 1930-х советская власть её закрыла и отдала ремесленной артели.", "В 1943-м, когда власть в войну ослабила антирелигиозный курс, её вновь открыли. Одно время здесь в библиотеке хранили Коран Усмана — одну из древнейших рукописей Корана."], "look": ["Зимний и летний молельные залы во дворе."], "gq": "Tilla Sheikh Mosque"}, {"id": "muyi", "name": "Медресе Муйи Муборак («Священный волос»)", "lat": 41.33706, "lon": 69.24032, "kind": "sight", "list": 4, "move": "walk", "stay": 10, "hook": "Название значит «Священный волос» — по преданию, здесь хранили волос пророка Мухаммада. А древнейший Коран Усмана, лежавший здесь, в 2025 году переехал через дорогу.", "facts": ["Медресе (исламская школа) 1856–1857 годов; здесь была библиотека на ~20 тысяч рукописей.", "Здесь долго хранился Коран Усмана — рукопись, которую предание связывает с халифом Усманом (VII век). В ноябре 2025-го его перенесли через дорогу, в Центр исламской цивилизации, — его история там."], "gq": "Muyi Muborak Madrasah"}, {"id": "hazrati", "name": "Мечеть Хазрати Имам и площадь Хаст-Имам", "lat": 41.33747, "lon": 69.24126, "kind": "sight", "list": 5, "move": "walk", "stay": 20, "hook": "В 2007 году Ташкент объявили столицей исламской культуры, и к этому по инициативе президента Ислама Каримова построили главную пятничную мечеть страны — с колоннами из индийского сандала.", "facts": ["Два минарета по ~53 метра; один строили хорезмские мастера, другой — самаркандские.", "Колонны айвана — открытой галереи на столбах — резной индийский сандал высотой 8,6 метра; говорят, дерево до сих пор пахнет.", "Ансамбль Хаст-Имам сложился вокруг могилы Каффаля Шаши — богослова X века, святого покровителя Ташкента, — и пережил землетрясение 1966 года."], "look": ["Резьбу сандаловых колонн вблизи.", "Сравни два минарета."], "note": "К закату (~17:00) площадь самая красивая.", "gq": "Hazrati Imam Mosque"}, {"id": "icc", "name": "Центр исламской цивилизации — Коран Усмана, VR", "lat": 41.3352, "lon": 69.2404, "kind": "sight", "extra": true, "interactive": true, "move": "walk", "stay": 90, "hook": "Коран Усмана — одна из древнейших рукописей Корана — объехал Самарканд, Петербург и Уфу и теперь лежит под бронестеклом в здании, которое Книга рекордов Гиннесса назвала крупнейшим музеем исламской цивилизации.", "facts": ["Открыт в марте 2026 года: купол 65 метров, здание 161 × 118 метров. Внутри VR-очки, цифровые аватары исторических личностей, OLED-стены — не классический музей.", "Путь рукописи: по преданию её привёз в Самарканд Тимур (Тамерлан); в 1869 году её увезли в Петербург; в 1918-м передали мусульманам в Уфу; в 1924-м спецпоездом вернули в Ташкент. В 1997 году внесена в реестр ЮНЕСКО «Память мира».", "Предание связывает её с халифом Усманом (VII век); анализ почерка (палеография) и радиоуглерод дают VIII–IX века — всё равно одна из древнейших.", "Посмотри, как огромны листы пергамента и что над буквами нет точек — так выглядело раннее письмо."], "caution": "Иностранцы: ~$25 (групповой вход ~2 ч) или $45–50 (день), iticket.uz или касса. Часы по разным данным 9–18 или 9–22 — лучше прийти до 17:00. Фото Корана запрещено.", "gq": "Center of Islamic Civilization in Uzbekistan"}, {"id": "qorasaroy", "name": "Лагманная «Карасарай»", "lat": 41.3405, "lon": 69.2424, "kind": "food", "move": "walk", "stay": 30, "optional": true, "order": "Лагман, блюда из конины. Бюджетно, 10:00–22:00.", "hook": "В этой лагманной лапшу тянут вручную: мастер вытягивает и складывает тесто, пока один кусок не превратится в пучок тонких нитей.", "facts": ["Лагманная на улице Карасарай — «чёрный дворец» — работает около 15 лет; городское издание WE Project включило её в подборку мест, «куда ходят ради еды, а не интерьера».", "Лагман — уйгурское по происхождению блюдо, давно ставшее ташкентским."], "legend": false, "gq": "Qorasaroy lagmon", "ic": "🍜", "ig": "meal"}, {"id": "h_hujum", "day": "day1", "after": "qorasaroy", "name": "Минутка истории: Худжум, наступление на паранджу", "hook": "Почти сто лет назад на этих улицах женщины публично сжигали паранджу, и многие заплатили за это жизнью.", "facts": ["Советская власть официально начала кампанию «худжум» («наступление») за снятие паранджи 8 марта 1927 года.", "Женщины публично снимали и сжигали паранджу (халат, накинутый на голову) и чачван (сетку из конского волоса на лицо); партия отчитывалась о сотне тысяч «раскрывшихся» за несколько месяцев.", "По наиболее цитируемой оценке, в 1927–1930 годах убито около 2500 снявших паранджу женщин, нередко — родственниками и соседями (данные о периоде расходятся).", "Историки спорят, чем был худжум — освобождением или насилием сверху."], "kind": "history", "approx": true, "move": "walk", "lon": 69.242782, "lat": 41.330499}, {"id": "metro_chorsu", "name": "Метро «Чорсу»", "lat": 41.327, "lon": 69.2392, "kind": "metro", "list": 12, "move": "walk", "stay": 5, "hook": "До 2018 года за фотографию в ташкентском метро можно было попасть в полицию: подземка считалась военным объектом и бомбоубежищем.", "facts": ["Запрет на съёмку держался 41 год и снят 1 июня 2018-го — на волне реформ и развития туризма.", "Едем по Узбекистанской линии без пересадок: Гафур Гулям → Алишер Навои → Узбекистан → Космонавтлар → Ойбек. Можно выйти на платформу и сесть в следующий поезд — без новой оплаты."], "gq": "Chorsu metro station"}, {"id": "metro_navoi", "name": "Станция «Алишер Навои» (выйти на платформу)", "lat": 41.3199, "lon": 69.2542, "kind": "metro", "move": "metro", "stay": 7, "hook": "Станция-дворец: под золочёными куполами — бирюзовые панно по поэмам Алишера Навои, поэта XV века.", "facts": ["Открыта 8 декабря 1984 года; пересадка на «Пахтакор».", "Попробуй узнать на панно сюжеты из «Хамсы» («Пятерицы») — цикла из пяти поэм Навои."], "gq": "Alisher Navoi metro station"}, {"id": "metro_kosmo", "name": "Станция «Космонавтлар» (выйти на платформу)", "lat": 41.3052, "lon": 69.2647, "kind": "metro", "unesco": true, "move": "metro", "stay": 7, "hook": "Станция, где астроном XV века Улугбек соседствует с Гагариным, — с 2026 года в списке ЮНЕСКО.", "facts": ["Стены переходят от светло-голубого внизу к тёмно-синему наверху — атмосфера, переходящая в космос; на потолке Млечный Путь из стеклянных «звёзд».", "На медальонах Икар, Улугбек, Гагарин, Терешкова, Джанибеков."], "look": ["Медальон с Улугбеком — астрономом XV века, единственным «докосмическим» героем среди космонавтов."], "gq": "Kosmonavtlar metro station"}, {"id": "metro_oybek", "name": "Метро «Ойбек»", "lat": 41.299, "lon": 69.2727, "kind": "metro", "move": "metro", "stay": 0, "gq": "Oybek metro station"}, {"id": "h_metro", "day": "day1", "after": "metro_oybek", "name": "В пути: Ойбек и ташкентское метро", "hook": "Станция, где ты вышел, названа в честь писателя, написавшего роман о Навои, — а само метро как раз в эти дни празднует день рождения.", "facts": ["Писатель Ойбек (1905–1968) родился в Ташкенте; роман «Навои» написан в годы войны, Сталинская премия 1946 года. На станции «Ойбек» (1984) — панели в виде книжных страниц и портрет писателя.", "«Ойбек» — станция мелкого заложения (около 8 м), первая в Ташкенте с монолитными сейсмостойкими колоннами.", "Метро открыто 6 ноября 1977 года — первое в Средней Азии, седьмое в СССР; строили после землетрясения 1966 года с расчётом на 9 баллов. Первый участок — 12,2 км и 9 станций.", "Сегодня 4 линии и 50 станций; жетоны отменены в 2020 году, можно платить ладонью или лицом; 16 декабря 2024 года впервые перевезли больше миллиона пассажиров за день."], "kind": "history", "approx": true, "move": "walk", "lon": 69.266663, "lat": 41.294858}, {"id": "caravan", "name": "Caravan — ужин в караван-сарае (с 1999), по желанию", "lat": 41.2852, "lon": 69.25762, "kind": "food", "move": "walk", "stay": 60, "when": "вечером, по пути к финишу: ~2 км от «Ойбека», ~1 км до финиша; открыт допоздна", "order": "Нарын (тонко нарезанная холодная лапша) с кониной, жареная чучвара (крошечные пельмени), свадебный «Байрам ош» или бухарский «оши софи» из медного казана, фирменный лаваш «Караван».", "hook": "Caravan — один из первых ресторанов национальной кухни в независимом Ташкенте, оформленный как старый караван-сарай — постоялый двор для торговых караванов.", "facts": ["Открыт в 1999 году; интерьер — двор, айваны (крытые террасы на колоннах), ковры, галерея. Та же компания, Caravan Group, потом открыла «Музей плова».", "Travellers' Choice Tripadvisor 2025; в 2GIS — 4,9 почти по семистам оценкам."], "caution": "В апреле 2026 владелец выставил ресторан на продажу; по 2GIS на 01.11.2026 работает 11:00–02:00. Средний чек ~200 000 сум. До дома 1 км пешком.", "alt": "Если вечер у Magic City или после «Хумо»: Tandiriy (бульвар Tashkent City, тандыр-гушт — мясо из тандыра, глиняной печи; 2GIS 4,8) или Afsona там же (5,0 в Яндексе, 11:00–23:00). Ночью — чайхана Navvat, круглосуточно.", "optional": true, "legend": true, "gq": "Caravan restaurant", "ic": "🍽️", "ig": "meal", "lg": true}, {"id": "home1b", "name": "Финиш", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "move": "walk", "note": "~2 км пешком или такси"}]}, {"id": "day2", "title": "Часть 2A — Современный центр и Tashkent City", "short": "2A · центр и сити", "date": null, "color": "#12708f", "summary": "Модернизм ЮНЕСКО («Жемчуг», Космонавтлар) → обед в советской пельменной → дом Половцова → театр Навои → Мустакиллик → дворец Романова → Бродвей → сквер Темура → CCA в трамвайном депо → вечером Шейхантаур и «Панорама» → небоскрёбы и бульвар Tashkent City → огни и фонтан у озера → пешком на набережную Seoul Mun.", "blocks": [{"title": "Космонавтлар и обед", "from": "zhemchug", "summary": "Дом «Жемчуг», сквер космонавтов, советская «Пельменная» и лагман под бирюзовыми куполами."}, {"title": "Ганч и модернизм", "from": "applied", "summary": "Восточный дворец дома Половцова и строгий Выставочный зал из списка ЮНЕСКО."}, {"title": "Театр и площадь Независимости", "from": "theatre", "summary": "Опера Щусева, кофе, музей истории и главная площадь страны."}, {"title": "Князь, Бродвей и Тимур", "from": "romanov", "summary": "Дворец опального Романова, улица художников, белые дворцы улицы Навои, бирюзовый купол Тимуридов, сквер Тимура с курантами и цыплёнок табака."}, {"title": "Депо и Политех", "from": "cca", "summary": "Дворец форумов, современное искусство в трамвайном депо 1912 года, музей, где всё можно трогать, и алюминиевый музей искусств из списка ЮНЕСКО."}, {"title": "Шейхантаур и «Панорама»", "from": "sheikhantaur", "summary": "Мавзолеи старого даха, по желанию колесо «Звезда Анхора», кинодворец 1964 года и консерватория."}, {"title": "Огни Tashkent City", "from": "tc_towers", "summary": "Небоскрёбы, бульвар и озеро на месте снесённых махаллей, потом пешком к фонтанам набережной Seoul Mun — и домой."}], "stops": [{"id": "home2", "name": "Старт", "lat": 41.2855, "lon": 69.2682, "kind": "home", "approx": true, "when": "~11:00"}, {"id": "h_two_cities", "day": "day2", "after": "home2", "name": "Минутка истории: Два Ташкента", "hook": "Когда в 1865 году русские войска взяли Ташкент, старый город перестраивать не стали: рядом, за каналом Анхор, выстроили второй, европейский.", "facts": ["Осенью 1865 года на Анхоре построили крепость генерала Черняева, взявшего город; с 1867 года здесь резиденция Константина фон Кауфмана, первого генерал-губернатора Туркестана (русского наместника в Средней Азии).", "Новый город — регулярная планировка, широкие улицы, арыки и деревья; центр — сквер на перекрёстке главных улиц (ныне сквер Амира Темура), где в 1882 году похоронили Кауфмана.", "Граница двух городов шла по каналу Анхор; на стыке вырос Алайский базар.", "В 1897 году в Ташкенте жило около 156 тысяч человек."], "kind": "history", "approx": true, "move": "walk", "lon": 69.266839, "lat": 41.294684}, {"id": "zhemchug", "name": "Дом «Жемчуг» (снаружи)", "lat": 41.3034, "lon": 69.2663, "kind": "sight", "extra": true, "unesco": true, "move": "walk", "stay": 10, "hook": "Экспериментальный жилой дом, придуманный после землетрясения 1966 года: вместо коридоров — висячие дворы высотой в три этажа.", "facts": ["Придуман в 1973 году (архитектор Офелия Айдинова), достроен в 1985-м: 16 этажей, через каждые три этажа — общий «висячий двор» высотой около 10 метров.", "Имя получил от ювелирного магазина «Жемчуг» на первом этаже.", "Туристов стало так много, что жители закрыли вход; смотрим снаружи. В списке ЮНЕСКО с 2026 года."], "gq": "Жемчуг дом Ташкент"}, {"id": "kosmo2", "name": "Сквер «Космонавтлар»", "lat": 41.3052, "lon": 69.2647, "kind": "sight", "move": "walk", "stay": 10, "hook": "Наверху станции — каменная история пути к звёздам: от Улугбека через Циолковского и Королёва к Гагарину.", "facts": ["Композиция «Космос» и бюст космонавта Владимира Джанибекова, родившегося под Ташкентом (1984). Если вчера не выходил на платформу станции «Космонавтлар» с медальонами Улугбека и Гагарина — спустись сейчас."], "gq": "Kosmonavtlar square"}, {"id": "pelmennaya", "name": "«Пельменная» (с 1969 года) — обед", "lat": 41.3045, "lon": 69.2683, "kind": "food", "move": "walk", "stay": 35, "order": "Мелкая чучвара с тонким тестом; иногда машхурда. Дёшево, в обед бывает очередь.", "hook": "Единственная сохранившаяся в Ташкенте пельменная советского формата — и её владелец стоит здесь уже 56 лет.", "facts": ["Открыта в 1969 году; бессменный хозяин Нигматулла Абдуллаев.", "Чучвара — крошечные пельмени: чем мельче лепит хозяйка, тем больше ей уважения."], "alt": "В 200 м — кафе «Голубые купола» (1970): лагман (тянутую лапшу) тянут в стеклянном павильоне посреди зала. В июле 2026 там был спорный ремонт крыши — проверь, открыто ли.", "legend": true, "gq": "Пельменная Ташкент", "ic": "🥟", "ig": "meal", "lg": true}, {"id": "blue_domes", "name": "Кафе «Голубые купола» (1970)", "lat": 41.3068, "lon": 69.267, "kind": "food", "move": "walk", "stay": 10, "optional": true, "order": "Лагман — лапшу, которую тянут на глазах.", "hook": "Бирюзовые купола над павильоном у ЦУМа (центрального универмага) — символ позднесоветского Ташкента.", "facts": ["Работает с 1970 года, архитектор Виль Муратов; здание в реестре культурного наследия."], "legend": true, "gq": "Голубые купола кафе", "ic": "🍜", "ig": "meal", "lg": true}, {"id": "h_muradov", "day": "day2", "after": "blue_domes", "name": "В пути: Мастер Ширин Мурадов", "hook": "Бухарский резчик по ганчу, чью работу ты сегодня увидишь трижды: в доме Половцова, в театре Навои и на курантах.", "facts": ["Уста (мастер) Ширин Мурадов родился в Бухаре (1879 или 1880), учился у отца и деда; умер в Ташкенте в 1957 году.", "Ганч — смесь гипса с глиной: её кладут в два слоя и режут ещё мягкий верхний слой ножами и скребками по рисунку, потом часто расписывают. Узоры — геометрический гирих и растительный ислими.", "В 1912–1914 годах Мурадов руководил отделкой Белого зала дворца Ситораи Мохи Хоса бухарского эмира: ганчевое кружево на зеркальных стенах.", "За Бухарское фойе театра Навои получил Сталинскую премию 1948 года; резал ганч и на ташкентских курантах (1947)."], "kind": "history", "approx": true, "move": "walk", "lon": 69.263726, "lat": 41.305111}, {"id": "applied", "name": "Дом Половцова (Музей прикладного искусства)", "lat": 41.301, "lon": 69.2596, "kind": "sight", "list": 15, "move": "walk", "stay": 40, "hook": "Купец построил этот дом рядом со своим пивзаводом, дипломат Александр Половцов превратил его в восточный дворец — и теперь это самый узорчатый интерьер Ташкента.", "facts": ["Сюда идут ради дома, а не витрин: центральный зал целиком в резном и расписном ганче (резном алебастре), потолки расписаны, колонны резные.", "Дом построил в конце XIX века купец Николай Иванов. В 1896 году его купил дипломат Александр Половцов, ценитель местного искусства, и перестроил с мастерами из Ташкента, Бухары, Хивы и Риштана.", "Среди мастеров — бухарец Ширин Мурадов (о нём — «В пути: Мастер Ширин Мурадов»): сегодня его ганч встретится трижды — здесь, в Бухарском фойе театра Навои и на курантах.", "В Первую мировую тут жили пленные австрийские офицеры, в 1920–30-х — детдом для казахских детей; музей с 1937 года."], "look": ["Ганчевую нишу, похожую на михраб — молитвенную нишу мечети.", "Старый дуб во дворе."], "caution": "9:00–18:00, около 30 000 сум.", "gq": "State Museum of Applied Arts of Uzbekistan"}, {"id": "h_crafts", "day": "day2", "after": "applied", "name": "В пути: Шёлк, сюзане и Риштан", "hook": "Витрины музея прикладного искусства мы пропустили — вот три ремесла, которыми знаменит Узбекистан.", "facts": ["Атлас — целиком шёлковая ткань, адрас — шёлк с хлопковым утком, поэтому рубчатый. Узор делают техникой абр («облако»): пучки нитей перевязывают и красят по очереди до ткачества — края узора размыты.", "Маргиланский центр развития ремёсел (основан в 2007 году) в 2017 году внесён ЮНЕСКО в Реестр передовых практик сохранения нематериального наследия.", "Сюзане (от персидского «игла») — вышитые покрывала; девушки вышивали их в приданое, ими застилали постель молодых.", "Риштанская керамика: бирюзовые тона даёт глазурь ишкор из золы растения, глубокий синий — кобальт."], "kind": "history", "approx": true, "move": "walk", "lon": 69.263726, "lat": 41.305111}, {"id": "exhall", "name": "Центральный выставочный зал (снаружи)", "lat": 41.3089, "lon": 69.2664, "kind": "sight", "extra": true, "unesco": true, "move": "walk", "stay": 5, "hook": "Центральный выставочный зал — один из десяти модернистских объектов Ташкента в списке ЮНЕСКО: 2 500 м² под световыми фонарями.", "facts": ["Построен в 1972–1974 годах: массивные колонны и мрамор снаружи, выставочные залы под световыми фонарями (застеклёнными проёмами в крыше) внутри. Входит в объект ЮНЕСКО «Модернистская архитектура Ташкента» (2026)."], "gq": "Central Exhibition Hall Tashkent"}, {"id": "theatre", "name": "Театр оперы и балета им. Навои", "lat": 41.3092, "lon": 69.2715, "kind": "sight", "list": 18, "move": "walk", "stay": 20, "hook": "Театр спроектировал Алексей Щусев, автор Мавзолея Ленина, достраивали японские военнопленные, а по легенде землетрясение 1966 года его не тронуло.", "facts": ["Щусев выиграл конкурс в 1934 году; театр открыли в ноябре 1947-го, к 30-летию революции, на месте Воскресенского базара.", "В 1945–1947 годах отделку вели сотни японских военнопленных из Квантунской армии; работу им не оплачивали. Местные вспоминали, что пленные были «маленькие, молодые и плакали», и носили им яблоки и хлеб. Доска об этом появилась в 1996 году.", "Шесть фойе — шесть региональных школ резьбы и росписи: ташкентское, ферганское, бухарское (ганч — резной алебастр — наложен на зеркала), самаркандское, хивинское, термезское.", "2–4 ноября в 19:00 здесь идёт «Тамерлан» Генделя — опера 1724 года о Тимуре, с узбекскими инструментами в оркестре."], "look": ["Мемориальную доску японцам сбоку здания.", "Бассейн-фонтан перед входом — по образцу хауза, традиционного водоёма."], "caution": "Билеты на «Тамерлан» — iticket.uz, 100–800 тыс. сум; касса +998 71 232 19 48.", "gq": "Alisher Navoi Opera and Ballet Theatre"}, {"id": "shavi", "name": "Shavi Coffee Roasters — кофе", "lat": 41.3106, "lon": 69.27, "kind": "food", "move": "walk", "stay": 15, "optional": true, "order": "Флэт уайт (~38 000 сум). Своя обжарка, 08:00–20:00.", "legend": false, "gq": "Shavi Coffee Roasters", "ic": "☕", "ig": "drink"}, {"id": "h_turkestan", "day": "day2", "after": "shavi", "name": "Минутка истории: Бурные годы, 1917–1930", "hook": "1917–1930: местную автономию в Коканде разгромили за три месяца, в Ташкенте провозгласили советскую республику, а в Ферганской долине годами шла война.", "facts": ["Ноябрь 1917 — съезд в Коканде провозгласил Туркестанскую (Кокандскую) автономию в ответ на власть ташкентского Совета, где сидели в основном русские рабочие и солдаты; в феврале 1918 года красные отряды её разгромили, Коканд разорён, погибли тысячи жителей.", "30 апреля 1918 — провозглашена Туркестанская АССР (автономная советская республика) со столицей в Ташкенте.", "Басмачество (от «басмачи» — «налётчики», так его называла советская власть) — вооружённое сопротивление советской власти в Фергане и Восточной Бухаре; основные силы разбиты к 1926 году, отдельные отряды — до 1930-х; сегодня в Узбекистане его чаще называют национально-освободительным движением.", "1924 — национальное размежевание: Среднюю Азию поделили на национальные республики; столица Узбекской ССР — Самарканд (1925–1930), с 1930 года — Ташкент."], "kind": "history", "approx": true, "move": "walk", "lon": 69.269489, "lat": 41.311012}, {"id": "history", "name": "Музей истории (здание-модерн, снаружи)", "lat": 41.3115, "lon": 69.2693, "kind": "sight", "list": 17, "unesco": true, "move": "walk", "stay": 5, "hook": "Белый куб построили в 1970 году как филиал музея Ленина, а в 2026-м он стал объектом всемирного наследия.", "facts": ["Здание задумано как филиал Центрального музея Ленина. Внутри — классический археологический музей (после ремонта 2026 года), так что смотрим архитектуру снаружи."], "gq": "State Museum of History of Uzbekistan"}, {"id": "h_independence", "day": "day2", "after": "history", "name": "Минутка истории: Как пришла независимость", "hook": "Узбекистан объявил независимость на волне августовского путча 1991 года в Москве: решение — 31 августа, праздник — 1 сентября.", "facts": ["31 августа 1991 года Верховный совет (парламент) республики провозгласил независимость; праздник — 1 сентября, впервые отмечен в 1992 году вечером на площади Мустакиллик (Независимости).", "29 декабря 1991 года — референдум (по официальным данным, 98,2% за независимость) и избрание первым президентом Ислама Каримова.", "Каримов руководил страной до смерти в 2016 году.", "Алфавит: в 1929 году узбекский язык уже переходил на латиницу, в 1940-м — на кириллицу; новый латинский алфавит принят в 1993-м и пересмотрен в 1995-м; переход не завершён, оба алфавита в ходу до сих пор."], "kind": "history", "approx": true, "move": "walk", "lon": 69.269356, "lat": 41.313997}, {"id": "mustaqillik", "name": "Площадь Мустакиллик + арка Эзгулик", "lat": 41.3154, "lon": 69.2674, "kind": "sight", "list": 16, "move": "walk", "stay": 25, "hook": "На этом постаменте до 1992 года стоял Ленин — после независимости там поставили золотой глобус, где Узбекистан крупнее всех стран.", "facts": ["Мустакиллик — «Независимость». До революции здесь была резиденция генерал-губернатора Туркестана; в советское время — Красная площадь, потом площадь Ленина. Ленинов было три подряд: двух первых увезли в Ургенч и Самарканд, третьего сняли в 1992-м.", "Глобус с картой Узбекистана в народе зовут «Шарик». «Счастливая мать» — шестиметровая фигура матери с ребёнком у глобуса — добавлена в 2006 году.", "Арка Эзгулик — «добрые устремления»: 16 колонн и аисты наверху. Рядом «Скорбящая мать» и металлические «Книги памяти» с именами погибших во Второй мировой."], "look": ["Контур Узбекистана на глобусе.", "Посчитай аистов на арке."], "gq": "Mustaqillik Square"}, {"id": "romanov", "name": "Дворец великого князя Романова (снаружи)", "lat": 41.3143, "lon": 69.2706, "kind": "sight", "extra": true, "move": "walk", "stay": 10, "hook": "Великий князь Николай Константинович, внук Николая I, которого семья объявила сумасшедшим, построил в Ташкенте каналы, первый кинотеатр и этот дворец, а себя называл Искандером.", "facts": ["В 1874 году из оклада семейной иконы пропали бриллианты; следствие решило, что их взял 24-летний Николай Константинович для американской танцовщицы Фанни Лир. Император Александр II объявил его душевнобольным — единственного Романова в истории, — а в 1881-м Александр III сослал его в Ташкент.", "Он держал мыловарню, фотоателье, бильярдные, торговал квасом, на доходы построил первый кинотеатр «Хива». Его каналы в Голодной степи оросили земли для сотни посёлков.", "Жён было три, младшим — 15 и 16 лет. Умер в 1918 году от пневмонии; на похоронах кричали «прощай, благодетель».", "Дворец 1891 года на реставрации; будет филиалом музея искусств. Смотрим через ограду, которую князь поставил на свои деньги."], "gq": "Romanov Palace Tashkent"}, {"id": "broadway", "name": "Бродвей (улица Сайилгох)", "lat": 41.3126, "lon": 69.2746, "kind": "sight", "list": 19, "move": "walk", "stay": 20, "hook": "Улица трижды сменила имя: вела к собору, носила имя Маркса, а теперь её зовут американским словом «Бродвей».", "facts": ["До революции — Соборная, при СССР — улица Карла Маркса, сейчас официально — Сайилгох, «место гуляний». «Бродвей» — народное прозвище, откуда оно, точно неизвестно.", "Художники-портретисты, шахматисты, сувениры; в 2026 году объявлена реконструкция с обещанием оставить художников."], "food_near": "Чайхана Navvat (ковры, топчаны; проверь, работает ли) и Uzbekona — в 100 м.", "gq": "Sayilgoh street"}, {"id": "hyatt_library", "name": "Белые дворцы на улице Навои: Национальная библиотека и Hyatt (снаружи)", "lat": 41.31709, "lon": 69.27443, "kind": "sight", "extra": true, "move": "walk", "stay": 10, "hook": "Два белоснежных здания с колоннадами и куполами — новый «парадный» Ташкент 2010-х рядом со сквером Тимура.", "facts": ["Национальная библиотека им. Навои — белое здание с колоннадой и куполом; постановление о его эксплуатации — 2011 год (lex.uz). В «Новом Ташкенте» достраивают ещё одно здание библиотеки (Afisha, 28.07.2026).", "Рядом Hyatt Regency: белый П-образный «дворец» с восточной колоннадой и куполом, стены на гранитном цоколе, голубоватое стекло; стройку завершили в 2016 году (tashkent.uz)."], "look": ["Колоннады обоих зданий вечером, в подсветке."], "gq": "National Library of Uzbekistan Tashkent"}, {"id": "timurids_museum", "name": "Музей истории Тимуридов (снаружи) — бирюзовый купол", "lat": 41.31368, "lon": 69.27899, "kind": "sight", "extra": true, "move": "walk", "stay": 5, "hook": "Ребристый бирюзовый купол музея — прямая цитата мавзолея Гур-Эмир в Самарканде, где похоронен Тимур.", "facts": ["Открыт 18 октября 1996 года, к 660-летию Амира Темура. Круглое здание, по кругу парапеты, у входа айван — открытая терраса на стройных колоннах; внутри белый мрамор и резной ганч с позолотой (orexca, tonkosti)."], "look": ["Рёбра купола — сравнишь с Гур-Эмиром в Самарканде."], "gq": "Amir Timur Museum Tashkent"}, {"id": "timur", "name": "Сквер Амира Темура + куранты + отель «Узбекистан»", "lat": 41.3113, "lon": 69.2797, "kind": "sight", "extra": true, "move": "walk", "stay": 25, "hook": "Пьедестал в центре сквера сменил больше хозяев, чем любой другой в Средней Азии: генерал-губернатор Кауфман, серп и молот, Ленин, Сталин, Маркс — и Тимур.", "facts": ["Памятник генерал-губернатору Туркестана Кауфману (1913) → серп и молот → Ленин → Сталин (снят в 1961-м) → голова Маркса в виде пламени (1968–1993) → конный Амир Темур — Тимур, завоеватель XIV века (31 августа 1994-го, надпись «Сила в справедливости»).", "Куранты 1947 года: механизм, по одной версии, сняли с ратуши немецкого Алленштайна (ныне польский Ольштын); его привёз часовщик Александр Айзенштейн, ставший смотрителем курантов, — он служил в одном полку с Солженицыным. Легенда: у города не было денег, и стройку оплатил пивзавод — с условием поставить пивной ларёк под башней. В 2009-м рядом построили точную копию.", "В ноябре 2009 года за неделю вырубили все чинары сквера — некоторым было 120 лет; причины власти так и не объяснили. Свежие срезы были красными, «словно от крови».", "Отель «Узбекистан» (1974) с бетонной решёткой-панджарой — самое узнаваемое модернистское здание города, но в список ЮНЕСКО он не попал."], "look": ["Надпись на постаменте на четырёх языках.", "Две одинаковые башни курантов."], "food_near": "«Уголок» (с 1964 года, в 200 м): цыплёнок табака с белым хлебом и домашним томатным соусом — подают больше 60 лет.", "gq": "Amir Timur Square"}, {"id": "ugolok", "name": "Кафе «Уголок» (с 1964) — цыплёнок табака", "lat": 41.3128, "lon": 69.2785, "kind": "food", "move": "walk", "stay": 40, "optional": true, "order": "Цыплёнок табака с белым хлебом и томатным соусом.", "hook": "Цыплёнка табака здесь подают одинаково больше 60 лет.", "facts": ["Открыто в 1964 году; внизу буфет, наверху ресторан. Архитектор — Нузет Заидов, автор Дворца пионеров на Хадре."], "legend": true, "gq": "Уголок кафе Ташкент", "ic": "🍗", "ig": "meal", "lg": true}, {"id": "h_tram", "day": "day2", "after": "ugolok", "name": "Минутка истории: Конка, трамвай и снова трамвай", "hook": "Ташкентский транспорт на рельсах начался в 1901 году с конки, где вагоны тянули лошади, потом пришло электричество, а в 2016 году трамвай исчез совсем.", "facts": ["30 марта (ст. ст.) 1901 года — открыта конка (конная железная дорога) бельгийского акционерного общества от вокзала к базару старого города.", "Первый пробный электровагон — октябрь 1912 года; к 1913 году сеть переведена на электротягу; депо построено в 1912 году (сейчас в нём Центр современного искусства, CCA).", "К 1940 году — около 100 км путей; с 2008 года линии закрывали, последние сняты в 2016 году.", "В 2022 году президент Шавкат Мирзиёев объявил о планах вернуть трамвай в Ташкент."], "kind": "history", "approx": true, "move": "walk", "lon": 69.279651, "lat": 41.311038}, {"id": "forums", "name": "Дворец международных форумов «Узбекистан» (снаружи)", "lat": 41.30954, "lon": 69.28258, "kind": "sight", "extra": true, "move": "walk", "stay": 10, "hook": "Белый мраморный дворец с куполом построили к 2200-летию Ташкента — а внутри висит хрустальная люстра длиной около 21 метра.", "facts": ["Открыт в сентябре 2009 года, к 2200-летию города; зал на 2000 мест. Подсветку снаружи и внутри делало мюнхенское бюро pfarré lighting design (ArchDaily, 2012).", "Люстра в главном фойе — около 21 м длиной и около 15 т весом. Внутрь пускают только на мероприятия; площадь перед дворцом открыта."], "look": ["Колоннаду и купол в вечерней подсветке.", "Ансамбль: дворец, куранты и отель «Узбекистан»."], "gq": "Palace of International Forums Uzbekistan Tashkent"}, {"id": "cca", "name": "CCA — Центр современного искусства в трамвайном депо 1912 года", "lat": 41.3065, "lon": 69.28, "kind": "sight", "extra": true, "interactive": true, "move": "walk", "stay": 50, "hook": "Депо первого ташкентского трамвая стало Центром современного искусства (CCA) — его реставрировали авторы музея Ива Сен-Лорана в Марракеше.", "facts": ["Здание 1912 года (архитектор Вильгельм Гейнцельман): депо первой трамвайной линии, потом дизельная электростанция, которая её питала.", "Реставрация — французская Studio KO; открыт 6 сентября 2026 года.", "Сейчас идёт выставка HIKMAH («Мудрость») — с инсталляцией из Гуггенхайма, впервые в Узбекистане."], "caution": "Вход бесплатный по регистрации на ccat.uz; понедельник выходной; закрыт 10–20 ноября.", "gq": "Centre for Contemporary Arts Tashkent"}, {"id": "polytech", "name": "Политехнический музей — интерактив", "lat": 41.3073, "lon": 69.2785, "kind": "sight", "extra": true, "interactive": true, "optional": true, "move": "walk", "stay": 60, "hook": "В Политехническом музее перевёрнутая комната, комната Эймса, зеркальный лабиринт и катушка Тесла — всё можно трогать.", "facts": ["Внизу ретро-машины: «Жук», «Чайка» ГАЗ-13, «Москвич-400», трактор «Фордзон» 1924 года."], "caution": "Вт–Вс 10–18. Свежих подтверждений работы нет — позвонить +998 71 232-34-30.", "gq": "Polytechnic Museum Tashkent"}, {"id": "art_museum", "name": "Музей искусств (снаружи) — алюминиевый фасад, ЮНЕСКО", "lat": 41.30282, "lon": 69.27797, "kind": "sight", "unesco": true, "extra": true, "move": "walk", "stay": 5, "hook": "Здание без окон, обшитое алюминиевыми панелями, — один из десяти объектов ташкентского модернизма в списке ЮНЕСКО.", "facts": ["Достроено в 1974 году: геометрический фасад из алюминиевых панелей и стекла, рассеивающего свет — картинам нужен ровный свет без прямого солнца.", "С июля 2026 года — в объекте ЮНЕСКО «Архитектура ташкентского модернизма» вместе с «Жемчугом», музеем истории, выставочным залом и «Панорамой» (WE Project 12.08.2026, Daryo 27.07.2026)."], "look": ["Фактуру алюминиевых панелей — днём, пока светло."], "gq": "State Museum of Arts of Uzbekistan Tashkent"}, {"id": "h_dahas", "day": "day2", "after": "art_museum", "name": "Минутка истории: Четыре части старого города", "hook": "Район Шейхантаур, куда ты едешь, в XVIII веке был одной из четырёх враждовавших частей Ташкента, и именно отсюда вышел человек, объединивший город.", "facts": ["Старый Ташкент делился на четыре даха (части города): Шейхантаур, Бешагач, Кукча и Себзар, у каждой — свой
