о ресторана.", "hours": "ежедневно 10:00–23:00 (WE Project, 2026)", "caution": "Это банкетный ресторан на 250 мест: в дни свадеб зал может быть закрыт — лучше позвонить. В правой части здания работает книжное кафе, рестораны — слева и сзади (tashkent.uz).", "legend": true, "sources": ["https://tashkent.uz/en/city/interesting-places/67", "https://weproject.media/articles/detail/kafe-i-restorany-tashkenta-kotorye-pomnyat-sovetskiy-tashkent/", "https://weproject.media/articles/detail/18-legendarnykh-zavedeniy-tashkenta-mesta-kuda-khodyat-mestnye-i-opytnye-turisty/"], "near_days": {"day5": {"stop": "m_shevchenko", "m": 1000.0}, "day1": {"stop": "metro_oybek", "m": 1290.0}, "day2": {"stop": "forums", "m": 180.0}, "day3": {"stop": "kirha", "m": 890.0}}, "near": "forums", "gq": "Bahor Restaurant", "ic": "🍽️", "ig": "meal", "lg": true}, {"id": "f_kazirabad_lagman", "name": "Лагманная «Казирабад» на Чиланзаре", "cat": "cult", "lat": 41.27828, "lon": 69.21744, "approx": false, "hook": "Советская лагманная в махалле Казирабад на Чиланзаре: сюда ходили ещё студенты 1970-х, а теперь приводят своих детей.", "why": "По OSM — «Лагманная «Казирабад»», ул. Чўпонота, 1. В СМИ статей о ней не найдено, но десятки отзывов на Яндекс.Картах (946 оценок, 4,9, ноябрь 2026) описывают её как советскую институцию: плов-блогер Юлий Клеблеев (@plovdosh, март 2026) — «Легенда Чиланзара: Лагманная, где время остановилось… кормит город с 1962 года»; другие — «работает здесь ещё с советских времён, с 1966 года», «старейшая лагманка в городе», воспоминания об отцах-студентах 1970-х.", "order": "Лагман «по советской рецептуре», лепёшка, чай, компот. 0,7 порции лагмана — около 38 000 сум (отзывы 2025–2026).", "hours": "примерно до 21:00 (Яндекс); тел. +998 90 948 25 29", "caution": "Доказательства — только отзывы постоянных гостей, не СМИ; год (1962 или 1966) не подтверждён документально. Есть отзывы, что «качество уже не то».", "legend": true, "sources": ["https://yandex.uz/maps/org/lag_monxona/15200892224/", "https://yandex.com.tr/maps/user/plovdosh"], "near_days": {}, "gq": "Lag'monxona (Чўпонота, 1)", "ic": "🍜", "ig": "meal", "lg": true}, {"id": "f_elephant_kuksi", "name": "Кукси у Куйлюкского моста: «Элефант» и «Островок»", "cat": "cult", "lat": 41.24462, "lon": 69.32635, "approx": false, "hook": "Кукси — холодная лапша ташкентских корейцев, депортированных сюда в 1937 году; лучшей в городе её называют здесь, в семейном кафе «Элефант».", "why": "Afisha.uz (12.07.2019): «Про это заведение знают если не все любители кукси, то очень многие»; там же соседний «Островок» — «так же популярен». В народном рейтинге кукси канала «Потребитель.уз» среди 85 заведений Elephant — 1-е место, «Островок» — 3-е (Kursiv, 20.06.2023). Zira.uz (17.08.2026): «семейная история с тридцатилетним стажем, где сын бережно продолжает дело своего отца»; лёд для кукси замораживают прямо из бульона. WE Project включает «Элефант» в «18 легендарных заведений» (28.08.2026): длинная очередь в обед. Kursiv (20.05.2026): «одно из старейших заведений корейской кухни в городе».", "order": "Кукси (обычный или «спец»), пигоди. Кукси 34 000–36 000 сум + 15% обслуживание (Zira, 08.2026).", "hours": "не найдены; «Островок» — до 23:00 (Яндекс)", "caution": "Окраина Мирабадского района (Фарғона йўли), далеко от маршрутов — только на такси. Кукси — блюдо скорее летнее, но кафе работает круглый год. «Островок» в 50 м: 41.24419, 69.32614.", "legend": true, "sources": ["https://www.afisha.uz/ru/restaurants/2019/07/12/kuksi", "https://uz.kursiv.media/2023-06-20/nazvany-restorany-tashkenta-gde-gotovyat-samyj-vkusnyj-kuksi/", "https://zira.uz/ru/2026/08/17/vkusomer-5-zavedeniy-s-kuk-si-v-tashkent/", "https://weproject.media/articles/detail/18-legendarnykh-zavedeniy-tashkenta-mesta-kuda-khodyat-mestnye-i-opytnye-turisty/", "https://uz.kursiv.media/?p=2022652"], "near_days": {}, "gq": "Elephant (2-й проезд Бадахшон, 786А)", "ic": "🍜", "ig": "meal", "lg": true}, {"id": "f_chigatai_patyr", "name": "Чигатайский лепёшечный базар (чигатайский патыр)", "cat": "bakery", "lat": 41.338, "lon": 69.2228, "approx": true, "hook": "На улице Чигатай в старом городе пекут самую сложную лепёшку Ташкента — килограммовый чигатайский патыр, который выпекается целый час.", "why": "Gazeta.uz (Ригина Маджитова, 23.09.2022): «в столице есть знаменитая Чагатайская улица, где выпекают местный патыр»; «самым сложным видом считается чагатайский патыр, так как он непросто готовится и выпекается час». Fergana (08.09.2021): на Чигатае «представлены абсолютно все виды ташкентских лепёшек. Точнее — патыра», лепёшечный базар на улице Чигатай-Дарвоза «тонет в тени огромного супермаркета «Макро»». Afisha.uz (16.03.2026) называет «чиғатой» отдельным видом лепёшки местного обжорного базара.", "order": "Чигатайский патыр (~1 кг, с кунжутом): простой 18 000, с орехами и изюмом 20 000 сум (2022). Бывает джизза-патыр со шкварками.", "hours": "лепёшки — с утра; обжорный базар Чигатая работает примерно с 3–4 утра до полуночи (Afisha, 2026)", "caution": "Точка приблизительная: напротив ворот кладбища Чигатай, у «Макро» (41.33794, 69.22353). Конкретные пекарни не названы. Рядом — шашлычные Чигатая (f_chigatai).", "legend": true, "sources": ["https://www.gazeta.uz/ru/2022/09/23/bread/", "https://fergana.agency/photos/122940/", "https://www.afisha.uz/uz/gorod/2026/03/16/chigatoy"], "near_days": {"day1": {"stop": "kaffal", "m": 1280.0}}, "near": "kaffal", "gq": "Chig'atoy (Чигатай-Дарвоза)", "ic": "🫓", "ig": "meal", "lg": true}, {"id": "f_chorsu_aziza_somsa", "name": "Самса «Азиза-опа» в обжорном ряду Чорсу", "cat": "cult", "lat": 41.32687, "lon": 69.23639, "approx": true, "hook": "Семья Кодировых печёт самсу на Чорсу с 1991 года: в лучшие годы продавали по полторы тысячи штук в день.", "why": "Gazeta.uz, серия «Портреты символов Ташкента: гастрономические ряды на Чорсу» (Жахонгир Азимов, 11.10.2022): дело начал около 30 лет назад Нурилла Кодиров вместе с матерью Азизой; «в день реализовывали по 1,5 тысячи штук»; «самса Азизы Кодировой круглая, размером с ладонь… отличается своим хрустящим, слегка солоноватым тестом». После смерти Нуриллы (2014) дело ведут племянник Абдулазиз и Даврон Усмонов. Daryo.uz (23.08.2025): «34 yildan buyon yashayotgan oilaviy tadbirkorlik — Toshkentdagi eng mashhur somsa» («семейное дело, живущее 34 года, — самая известная самса Ташкента»).", "order": "Тандырная самса с мясом и курдюком; около 25 000 сум за штуку (Daryo, 2025 — по анонсу статьи).", "hours": "по часам рынка, с утра", "caution": "Точная стойка в ряду не геокодирована — спросите «Азиза опа сомсаси». Цена 2025 года взята из анонса Daryo (страница недоступна). Площадь Чорсу готовят к реконструкции (концепция по указу от 27.07.2026), но купола сохраняются; сноса ряда в новостях нет.", "legend": true, "sources": ["https://www.gazeta.uz/ru/2022/10/11/chorsu/", "https://daryo.uz/2025/08/23/34-yildan-buyon-yashayotgan-oilaviy-tadbirkorlik-toshkentdagi-eng-mashhur-somsa-va-xorijlik-mijozlar-haqida-video", "https://www.gazeta.uz/oz/2026/07/30/tashkent/"], "near_days": {"day1": {"stop": "chorsu", "m": 90.0}, "day4": {"stop": "d4_afsona", "m": 1480.0}}, "near": "chorsu", "gq": "Chorsu ovqat bozori", "ic": "🥧", "ig": "meal", "lg": true}, {"id": "f_chorsu_mamura_osh", "name": "Утренний плов Мамуры-опы на Чорсу", "cat": "breakfast", "lat": 41.32675, "lon": 69.23665, "approx": true, "hook": "Мамура Эргашева 45 лет варит плов в обжорном ряду Чорсу: её муж ставит казан в два часа ночи, к половине седьмого утра плов готов.", "why": "Gazeta.uz (11.10.2022, «Портреты символов Ташкента»): «за 45 лет работы на Чорсу женщина преуспела в приготовлении культового блюда»; единственная женщина-ошпаз ряда; «плов Мамуры Эргашевой умеренно жирный». Семья выходит на рынок в 7 утра и работает до 8 вечера; в меню ещё лагман, шурпа, нарын, нухат. Это лучший ответ на ташкентскую традицию утреннего плова.", "order": "Утренний плов, нарын (норин). В ряду в 2024 году: плов ~30 000, норин и хасип ~35 000 сум (Afisha, 20.07.2024).", "hours": "≈07:00–20:00 (gazeta.uz, 2022); плов лучше брать утром", "caution": "Свежих (2025–2026) подтверждений, что стойка работает, не найдено — источник 2022 года; спрашивайте на месте «Мамура опа оши».", "legend": true, "sources": ["https://www.gazeta.uz/ru/2022/10/11/chorsu/", "https://www.afisha.uz/uz/gorod/2024/07/20/chorsu"], "near_days": {"day1": {"stop": "chorsu", "m": 60.0}, "day4": {"stop": "d4_afsona", "m": 1460.0}}, "near": "chorsu", "gq": "Chorsu ovqat bozori", "ic": "🍚", "ig": "meal", "lg": true}, {"id": "f_chorsu_shermatov_kabob", "name": "Шашлык Шерматовых на Чорсу (бывшая точка «под гостиницей «Москва»»)", "cat": "cult", "lat": 41.32663, "lon": 69.23639, "approx": true, "hook": "Семья потомственных поваров Шерматовых жарит шашлык у Чорсу с 1980-х: сначала под гостиницей «Москва», после независимости — в обжорном ряду.", "why": "Gazeta.uz (11.10.2022): «Своё призвание этот немногословный мужчина нашёл 40 лет назад»; «в 80-е семейная точка Шерматовых, потомственных ошпазов, находилась под бывшей гостиницей «Москва»», а после обретения независимости бизнес переехал в «овкат бозори».", "order": "Кийма-кабоб (рубленый) и жаз; палочка — 14 000 сум (2022).", "hours": "по часам ряда", "caution": "Источник 2022 года; свежих подтверждений нет. Сама гостиница (позже «Чорсу») снесена в 2025 году (spot.uz).", "legend": true, "sources": ["https://www.gazeta.uz/ru/2022/10/11/chorsu/", "https://www.spot.uz/ru/2025/09/24/chorsu-demolition/"], "near_days": {"day1": {"stop": "chorsu", "m": 60.0}, "day4": {"stop": "d4_afsona", "m": 1450.0}}, "near": "chorsu", "gq": "Chorsu ovqat bozori", "ic": "🍢", "ig": "meal", "lg": true}, {"id": "f_malysh_somsa", "name": "«Самса на Дружбе» — самсовая «Малыш» на Бешагаче", "cat": "cult", "lat": 41.30662, "lon": 69.23673, "approx": false, "hook": "«Самса на Дружбе» — тандырная самсовая у бывшего дворца «Дружбы народов», которую ташкентцы в 2017 году признали одной из двух лучших в городе.", "why": "Podrobno.uz (02.03.2017): в народном рейтинге группы «Потребитель.уз» (50 мест, 580 голосов) «самса на Дружбе» и «самса на Миноре» — «абсолютные лидеры». Блогер rifat (ЖЖ, 13.09.2014) описывает её: за дворцом «Дружбы народов» (ныне «Истиклол») поворот к Чиланзару, «небольшая пристройка на углу» девятиэтажки, три больших тандыра, «человек 10 стоит в очереди». BFM.ru (28.07.2023): самсу «Малыш» местные «указали… как одно из старейших» мест.", "order": "Тандырная самса с мясом, к ней зелёный чай (чай — на отдельной кассе). 7 000 сум за штуку (BFM, 2023).", "hours": "не найдены; самса — с утра до распродажи", "caution": "То, что «самса на Дружбе» из рейтинга 2017 года — это именно «Малыш» (OSM: Бунёдкор, дублёр, Бешагач; 2ГИС: «Drujba malish somsa», Бешагач, 6а), — наш вывод по адресу и описанию, напрямую в источниках не сказано. В 130 м — плов-центр «Камолон Дружба» (d4_kamolon).", "legend": true, "sources": ["https://podrobno.uz/cat/obchestvo/potrebiteli-vybrali-luchshuyu-samsu-v-tashkente-/", "https://rifat.livejournal.com/297593.html", "https://www.bfm.ru/news/530493", "https://2gis.uz/tashkent/search/%D1%81%D0%B0%D0%BC%D1%81%D0%B0%20%D0%BD%D0%B0%20%D0%B4%D1%80%D1%83%D0%B6%D0%B1%D0%B5"], "near_days": {"day1": {"stop": "abulkasim", "m": 270.0}, "day2": {"stop": "seoulmun", "m": 1140.0}, "day4": {"stop": "d4_magic_museum", "m": 670.0}}, "near": "abulkasim", "gq": "Malish somsa (Бешагач, 6А)", "ic": "🥧", "ig": "meal", "lg": true}, {"id": "f_angels", "name": "Angel's (Angel's Drive) у метро «Ойбек»", "cat": "fastfood", "lat": 41.2999, "lon": 69.2742, "approx": true, "hook": "Angel's Food открылся в 2001 году как один из первых фастфудов Ташкента — и стал так известен, что станцию «Ойбек» называли «метро у Энджелса».", "why": "Spot.uz (20.01.2018): открыт в 2001 году на углу Афросиаб и Шахрисабз, «одно из первых фастфуд-заведений Ташкента»; около 2002 года появился первый в городе формат «драйв» (Angel's Drive); станцию метро горожане называли «метро у Angel's Food». В 2010 году сменил формат на кафе, в 2017 пережил пожар. WE Project (31.07.2026) вспоминает его в подборке «15 мест, которых нам до сих пор не хватает»: «одно из первых заведений быстрого питания в Ташкенте».", "order": "Бургер из окна драйва (45 000–50 000 сум по Wolt, 2026).", "hours": "10:00–01:00 (Golden Pages, отзывы июль 2026)", "caution": "Легенда — прежний Angel's Food; сейчас по адресу Афросиаб, 16 работает Angel's Drive (бургеры навынос), прежнего кафе как в 2000-х нет. Точка приблизительная (перекрёсток Афросиаб/Шахрисабз у «Ойбека»).", "legend": true, "sources": ["https://www.spot.uz/ru/2018/01/20/angels-food/", "https://www.weproject.media/articles/detail/15-mest-tashkenta-kotorykh-nam-do-sikh-por-ne-khvataet/", "https://www.goldenpages.uz/company/?Id=90227", "https://wolt.com/en/uzb/tashkent/restaurant/angels-drive"], "near_days": {"day5": {"stop": "m_shevchenko", "m": 320.0}, "day1": {"stop": "metro_oybek", "m": 160.0}, "day2": {"stop": "art_museum", "m": 450.0}, "day3": {"stop": "shevchenko", "m": 320.0}}, "near": "metro_oybek", "gq": "Angel's Drive", "ic": "🍔", "ig": "fast", "lg": true}, {"id": "f_dostlar", "name": "Столовая «Дустлар» у ЦУМа", "cat": "cult", "lat": 41.30777, "lon": 69.27069, "approx": false, "hook": "«Дустлар» у ЦУМа — столовая в духе СССР с подносами и очередью в обед, которую ташкентцы знают десятилетиями.", "why": "Aviasales (Анна Пронина, 24.01.2022): «Культовый статус имеет столовая «Дустлар» около ЦУМа». В отзывах на Яндексе (4,9 при ~1 200 оценках) — «атмосфера столовой СССР», «знаю это место больше 15 лет», очередь с 12:45 до 14:00.", "order": "Комплексный обед с подноса; гости хвалят сырники и печёную айву. Цены не опубликованы (бюджетно).", "hours": "обеденная столовая; точные часы не найдены", "caution": "Советское происхождение не доказано; источник «культового статуса» — один (Aviasales). Адрес в источниках расходится: Чимкентская, 1 или 17А. В 400 м — «Пельменная».", "legend": true, "sources": ["https://www.aviasales.ru/psgr/article/toshkent-hidoyat"], "near_days": {"day5": {"stop": "m_shevchenko", "m": 1090.0}, "day1": {"stop": "metro_kosmo", "m": 580.0}, "day2": {"stop": "theatre", "m": 170.0}, "day3": {"stop": "shevchenko", "m": 1090.0}}, "near": "theatre", "gq": "Do'stlar (Чимкентская улица)", "ic": "🥗", "ig": "meal", "lg": true}, {"id": "f_sazanchik", "name": "«Сазанчик» на Лабзаке — жареный сазан и чебуреки", "cat": "cult", "lat": 41.33627, "lon": 69.26652, "approx": false, "hook": "«Сазанчик» — хорезмская едальня у канала на Лабзаке, куда весь Ташкент ездит за жареным сазаном и чебуреками.", "why": "Блог-путеводитель «Дарсик» включает его в «5 культовых блюд Ташкента»: «„Сазанчик“ славится ещё и чебуреками, которые стали городской легендой». Afisha.uz (уз.) называет его «одним из довольно известных ресторанов Ташкента», WE Project — местом, «куда приходят ради еды, а не интерьера» (06.04.2026). По справочнику Golden Pages, раньше на этом месте был ресторан «Аист»; карточка существует 23 года (то есть с начала 2000-х). Яндекс: 5,0 при ~5 700 оценках.", "order": "Сазан на мангале, чебуреки, хорезмские блюда.", "hours": "11:00–23:00 (Яндекс)", "caution": "Доказательства средние: легендой чебуреки называет блог, а не газета; год основания не найден. Адрес по одним источникам Лабзак, 114, по OSM — 118а (координаты по OSM). У сети есть филиалы — культовым считается именно Лабзак.", "legend": true, "sources": ["https://list.darsik.com/kultovye-blyuda-tashkenta-kotorye-nuzhno-znat/", "https://www.goldenpages.uz/company/?Id=40276", "https://weproject.media/articles/detail/10-zavedeniy-tashkenta-kuda-prikhodyat-radi-edy-a-ne-radi-interera-chast-2/", "https://yandex.uz/maps/org/sazanchik/189013487961/"], "near_days": {"day5": {"stop": "m_minor", "m": 720.0}, "day2": {"stop": "anhor_wheel", "m": 1270.0}, "day3": {"stop": "minor", "m": 720.0}}, "near": "m_minor", "gq": "Sazanchik", "ic": "🍽️", "ig": "meal", "lg": true}], "desserts": [{"name": "Нават (новвот)", "fact": "Сахар, который не варят, а выращивают: крупные кристаллы оседают на нитях или стенках посуды в остывающем сиропе. Исходный сироп варили на виноградном соке, поэтому нават бывает от белого до янтарного; его сосут вприкуску с чаем или растворяют в пиале вместо сахара."}, {"name": "Парварда", "fact": "Белые «подушечки» из сахарного сиропа с лимонным соком: горячую массу много раз вытягивают руками, пока она не побелеет, режут и обваливают в муке. Свежая парварда тает во рту, засохшая превращается в карамель; настоящая — белая или молочная, цветная появилась позже."}, {"name": "Нишолда", "fact": "Белоснежное облако из яичных белков, взбитых с сахаром и отваром корня солодки («мыльного корня»); на базарах её продают прямо из огромных казанов. Это сладость Рамадана, её едят на ифтар с лепёшкой и зелёным чаем, поэтому в ноябре её может не оказаться: спросите в кондитерском ряду Чорсу."}, {"name": "Холвайтар", "fact": "«Жидкая халва»: мука, обжаренная в масле до орехового цвета и уваренная с сахарным сиропом. Её несут соседям при новоселье и готовят в память об умерших, часто по четвергам."}, {"name": "Халва (холва)", "fact": "Узбекская халва бывает кунжутной, подсолнечной, ореховой, фисташковой, мучной и молочной; лучшей считают кокандскую, самаркандскую и бухарскую. В июле 2026 года «Кокандская халва» получила официальный статус географического указания, как шампанское или пармезан."}, {"name": "Пашмак", "fact": "Тончайшие сладкие нити, похожие на сахарную вату, но из муки и сахара, обжаренных в масле. Название от персидского «пашм» — «шерсть» (отсюда же «пашмина»), родина — персидский Йезд."}, {"name": "Козинаки и пахлава", "fact": "Козинаки — орехи или кунжут на меду, спрессованные в пласт; пахлава — слоёное тесто с мёдом и орехами. Обе продаются в кондитерском ряду Чорсу рядом с наватом и халвой."}, {"name": "Бугирсок и урама", "fact": "Жаренные во фритюре кусочки теста к чаю и свадебному столу: урама — спирали в сахарной пудре, бугирсок — пышные «пончики» к дастархану."}, {"name": "Сушёная дыня, курага и кишмиш", "fact": "Узбекская дыня — гордость страны, её сушат длинными полосками. Совет с базара: натуральная курага тёмная, ярко-оранжевую обычно обрабатывают сернистым газом."}, {"name": "Андижанское мороженое", "fact": "Легендарное «мороженое с рук», которое летом продают с тележек и вёдер. Ностальгия опасная: в мае 2024 года в Алмазарском районе уничтожили 250 кг такого мороженого, а СЭС в 2025 году прямо предупреждала об отравлениях, так что берите мороженое в киосках."}]};

function tags(s) {
  return (s.unesco ? '<span class="tag unesco">ЮНЕСКО</span>' : "") + (s.interactive ? '<span class="tag inter">интерактив</span>' : "") +
    (s.optional ? '<span class="tag">по желанию</span>' : s.extra ? '<span class="tag">доп.</span>' : "");
}
const playBtn = id => audioUrl(id) ? `<button class="play" data-play="${id}" aria-label="Слушать">▶</button>` : "";
function storyHtml(s, { short = false } = {}) {
  const out = [];
  if (s.hook) out.push(`<p class="hook">${esc(s.hook)}</p>`);
  if (s.order) out.push(`<div class="lbl">Что заказать</div><div>${esc(s.order)}</div>`);
  if (!short && s.facts?.length) out.push(`<div class="lbl">${s.kind === "history" ? "Коротко" : "Рассказать"}</div><ul>${s.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`);
  if (!short && s.look?.length) out.push(`<div class="lbl">Посмотри на</div><ul>${s.look.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`);
  if (s.food_near) out.push(`<div class="lbl">Поесть рядом</div><div>${esc(s.food_near)}</div>`);
  if (s.alt) out.push(`<div class="lbl">Вариант</div><div>${esc(s.alt)}</div>`);
  if (s.note) out.push(`<div class="warn">${esc(s.note)}</div>`);
  if (s.caution) out.push(`<div class="warn">⚠ ${esc(s.caution)}</div>`);
  if (s.approx && s.kind !== "history") out.push(`<div class="warn">Координата примерная.</div>`);
  if (s.kind !== "history") out.push(`<a href="${gmaps(s)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a>`);
  return out.join("");
}
function popupHtml(s) {
  const meta = [s.when, s.stay ? `~${s.stay} мин` : null, s.list ? `№${s.list} из списка` : null].filter(Boolean).join(" · ");
  return `${playBtn(s.id)}<b>${esc(s.name)}</b>${meta ? `<br><span style="color:#6e655a">${meta}</span>` : ""}<div style="margin-top:6px">${storyHtml(s, { short: true })}</div>`;
}
function pin(cls, text, color, size = 26) {
  return L.divIcon({ className: "", html: `<div class="pin ${cls}" style="${color ? `background:${color}` : ""}">${text}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
}

const layers = {}, markers = {};
const FOODCAT = { cult: "Культовые места", dessert: "Десерты и сладости", bakery: "Пекарни и выпечка", fastfood: "Местный фастфуд", breakfast: "Завтраки", night: "Поздно вечером и ночью" };
const FOOD = (PLAN.food || []).filter(f => wide.contains([f.lat, f.lon]));
const foodNote = f => [f.why && `Почему: ${f.why}`, f.order && `Что взять: ${f.order}`, f.hours, f.caution && `⚠ ${f.caution}`].filter(Boolean).join("<br>");
const foodMarker = f => (markers[f.id] = L.marker([f.lat, f.lon], { icon: foodPin(f, 22), title: f.name, zIndexOffset: f.lg ? 0 : -200 })
  .bindPopup(`<b>${esc(f.name)}</b>${f.hook ? `<br><i>${esc(f.hook)}</i>` : ""}<br>${foodNote(f)}<br><a href="${gmaps(f)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a>`, { maxWidth: 300 }));
function drawDay(day) {
  const g = L.featureGroup(), color = dayColor(day.id);
  LEGS[day.id].forEach(l => {
    if (!l.coords || l.coords.length < 2) return;
    const ll = l.coords.map(([x, y]) => [y, x]);
    L.polyline(ll, { color: "#fff", weight: 8, opacity: 0.8, dashArray: DASH[l.mode] }).addTo(g);
    L.polyline(ll, { color, weight: 4.5, opacity: 0.95, dashArray: DASH[l.mode], lineCap: "round" }).addTo(g);
  });
  let n = 0;
  day.stops.forEach((s, i) => {
    if (s.kind === "home") return;
    const food = s.kind === "food", hist = s.kind === "history";
    if (!food && !hist) s._n = ++n;
    const icon = food ? foodPin(s) : hist ? pin("hist", "i", null, 20) : pin("", s._n, color);
    markers[s.id] = L.marker([s.lat, s.lon], { icon, title: s.name, riseOnHover: true, zIndexOffset: food && s.lg ? 50 : food || hist ? -100 : 0 }).bindPopup(popupHtml(s), { maxWidth: 300 }).addTo(g);
  });
  FOOD.filter(f => (f.near_days || {})[day.id]).forEach(f => foodMarker(f).addTo(g));
  layers[day.id] = g;
}
PLAN.days.forEach(drawDay);
const home = PLAN.home;
const homeMarker = home ? L.marker([home.lat, home.lon], { icon: pin("home", "⌂"), zIndexOffset: 1000, title: home.name }).bindPopup(`<b>${esc(home.name)}</b>`).addTo(map) : null;
const extras = (PLAN.evening || []).map(e => ({ ...e, _eve: true })).concat(PLAN.optional || []).filter(o => wide.contains([o.lat, o.lon]));
layers.extra = L.featureGroup(extras.map(o => {
  const m = L.marker([o.lat, o.lon], { icon: o._eve ? pin("eve", "♪", null, 22) : o.kind === "food" ? foodPin(o, 22) : pin("opt", "+", null, 18), title: o.name })
    .bindPopup(`${playBtn(o.id)}<b>${esc(o.name)}</b>${o.when ? `<br>${esc(o.when)}` : ""}<br>${esc(o.note || "")}<br><a href="${gmaps(o)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a>`, { maxWidth: 300 });
  markers[o.id] = m; return m;
}).concat(FOOD.filter(f => !Object.keys(f.near_days || {}).length).map(foodMarker)));

function panel() {
  let html = "";
  PLAN.days.forEach(day => {
    const legs = LEGS[day.id];
    const walk = legs.filter(l => l.mode === "walk").reduce((a, l) => a + (l.distance_m || 0), 0);
    const intro = `${day.id}_intro`;
    html += `<section class="day" data-day="${day.id}"><h2><span class="dot" style="background:${dayColor(day.id)}"></span>${esc(day.title)}</h2>
      <div class="meta">${esc(day.summary)}<br>Пешком ≈ ${fmtKm(walk)} км${PLAN.start ? ` · старт ${esc(PLAN.start)}` : ""}</div>
      ${audioUrl(intro) ? `<div class="intro"><button class="btn" data-play="${intro}">▶ Вступление</button></div>` : ""}<ol class="stops">`;
    const blockAt = Object.fromEntries((day.blocks || []).map((b, k) => [b.from, { ...b, n: k + 1 }]));
    day.stops.forEach((s, i) => {
      const blk = blockAt[s.id];
      if (blk) html += `<li class="block"><div class="bt">${blk.n}. ${esc(blk.title)}</div>${blk.summary ? `<div class="bs">${esc(blk.summary)}</div>` : ""}</li>`;
      if (i > 0) {
        const l = legs[i - 1];
        if (l && s.kind !== "history") html += `<li class="move">↓ ${MODE[l.mode] || l.mode}${l.distance_m ? ` · ${fmtKm(l.distance_m)} км, ~${Math.round(l.duration_s / 60)} мин` : ""}</li>`;
      }
      if (s.kind === "home") {
        html += `<li class="stop"><details data-key="home"><summary><span class="num" style="background:var(--fg)">⌂</span><div><div class="name">${esc(s.name)}</div>${s.note || s.when ? `<div class="sub">${esc(s.when || s.note)}</div>` : ""}</div></summary></details></li>`;
        return;
      }
      const food = s.kind === "food", hist = s.kind === "history";
      const sub = hist ? "минутка истории, пока идёшь" : [s.when, s.stay ? `~${s.stay} мин` : "", s.list ? `№${s.list} из списка` : ""].filter(Boolean).join(" · ");
      html += `<li class="stop ${hist ? "history" : ""} ${played.has(s.id) ? "played" : ""}" data-stop="${s.id}"><details data-key="${s.id}"><summary>
        ${food ? foodBadge(s) : `<span class="num ${hist ? "hist" : ""}" style="${hist ? "" : `background:${dayColor(day.id)}`}">${hist ? "i" : s._n}</span>`}
        <div><div class="name">${esc(s.name)}${tags(s)}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${playBtn(s.id)}</summary>
        <div class="body">${storyHtml(s)}</div></details></li>`;
      FOOD.filter(f => ((f.near_days || {})[day.id] || {}).stop === s.id).forEach(f => {
        const m = f.near_days[day.id].m, dist = m < 150 ? "рядом" : m < 1000 ? `${Math.round(m / 50) * 50} м` : `${(m / 1000).toFixed(1).replace(".", ",")} км`;
        html += `<li class="stop"><details data-key="${f.id}"><summary>${foodBadge(f, "opacity:.85")}<div><div class="name" style="font-weight:400">${esc(f.name)}</div><div class="sub">поесть · ${dist} · ${esc(FOODCAT[f.cat] || "")}</div></div></summary><div class="body">${f.hook ? `<p class="hook">${esc(f.hook)}</p>` : ""}${foodNote(f)}<br><a href="${gmaps(f)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a></div></details></li>`;
      });
    });
    html += "</ol></section>";
  });
  if (PLAN.train) {
    const t = PLAN.train;
    html += `<section class="day"><h2><span class="dot" style="background:var(--fg)"></span>Поезд</h2><div class="meta">${[t.out && `Туда: ${esc(t.out)}`, t.back && `Обратно: ${esc(t.back)}`, t.tickets && `Билеты: ${esc(t.tickets)}`, t.note && esc(t.note)].filter(Boolean).join("<br>")}</div></section>`;
  }
  if ((PLAN.evening || []).length) {
    html += `<section class="day extra"><h2><span class="dot" style="background:var(--fg)"></span>Вечером</h2><ol class="stops">`;
    PLAN.evening.forEach(e => {
      html += `<li class="stop"><details data-key="${e.id}"><summary><span class="num" style="background:var(--fg)">♪</span><div><div class="name">${esc(e.name)}</div><div class="sub">${esc(e.when || "")}</div></div>${playBtn(e.id)}</summary><div class="body"><div>${esc(e.note || "")}</div><a href="${gmaps(e)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a></div></details></li>`;
    });
    html += `</ol></section>`;
  }
  if ((PLAN.optional || []).length) {
    html += `<section class="day extra"><h2><span class="dot" style="background:var(--opt)"></span>Если останется время</h2><ol class="stops">`;
    PLAN.optional.forEach(o => {
      const food = o.kind === "food";
      html += `<li class="stop"><details data-key="${o.id}"><summary>${food ? foodBadge(o) : `<span class="num" style="background:var(--opt)">+</span>`}<div><div class="name">${esc(o.name)}${tags(o)}</div>${o.list ? `<div class="sub">№${o.list} из списка</div>` : ""}</div></summary><div class="body">${o.note ? `<div>${esc(o.note)}</div>` : ""}<a href="${gmaps(o)}" target="_blank" rel="noopener">${wide.contains([o.lat, o.lon]) ? "Google Maps: отзывы и фото" : "За городом — Google Maps: отзывы и фото"}</a></div></details></li>`;
    });
    html += `</ol></section>`;
  }
  if ((PLAN.food || []).length) {
    html += `<section class="day extra"><h2><span class="dot" style="background:var(--food)"></span>Где поесть</h2>`;
    Object.entries(FOODCAT).forEach(([cat, label]) => {
      const items = PLAN.food.filter(f => (f.cat || "cult") === cat); if (!items.length) return;
      html += `<div class="meta" style="margin-top:8px">${label}</div><ol class="stops">`;
      items.forEach(f => {
        const near = f.near && byId[f.near] ? `рядом: ${byId[f.near].s.name}` : "";
        html += `<li class="stop"><details data-key="${f.id}"><summary>${foodBadge(f)}<div><div class="name">${esc(f.name)}</div>${near ? `<div class="sub">${esc(near)}</div>` : ""}</div></summary><div class="body">${f.hook ? `<p class="hook">${esc(f.hook)}</p>` : ""}${f.why ? `<div class="lbl">Почему сюда</div><div>${esc(f.why)}</div>` : ""}${f.order ? `<div class="lbl">Что взять</div><div>${esc(f.order)}</div>` : ""}${f.hours ? `<div class="warn">${esc(f.hours)}</div>` : ""}${f.caution ? `<div class="warn">⚠ ${esc(f.caution)}</div>` : ""}${f.approx ? `<div class="warn">Координата примерная.</div>` : ""}<a href="${gmaps(f)}" target="_blank" rel="noopener">Google Maps: отзывы и фото</a></div></details></li>`;
      });
      html += `</ol>`;
    });
    html += `</section>`;
  }
  if ((PLAN.dishes || []).length || (PLAN.desserts || []).length) {
    html += `<section class="day"><h2><span class="dot" style="background:var(--food)"></span>Что попробовать</h2><ul class="dishes">
      ${(PLAN.dishes || []).concat(PLAN.desserts || []).map(d => `<li><b>${esc(d.name)}.</b> ${esc(d.fact)}</li>`).join("")}</ul></section>`;
  }
  const mb = Object.values(AUDIO).reduce((a, t) => a + (t.bytes || 0), 0) / 1e6;
  html += `<div class="legend">
      <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="3"/></svg>пешком</span>
      <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round"/></svg>метро</span>
      <span><svg width="26" height="6"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="3" stroke-dasharray="7 5"/></svg>такси</span>
      <span><span class="num fi meal" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">🍜</span>еда</span>
      <span><span class="num fi dessert" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">🍦</span>десерты</span>
      <span><span class="num fi fast" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">🌯</span>фастфуд</span>
      <span><span class="num fi meal" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:6px">🍚<b class="lg">!</b></span>легендарное — не пропусти</span>
      <span><span class="num fi drink" style="display:inline-block;width:16px;height:16px;line-height:12px;font-size:9px;vertical-align:middle;margin-right:4px">☕</span>кофе, чай</span>
      <span><span class="num hist" style="display:inline-block;width:14px;height:14px;line-height:14px;font-size:10px;vertical-align:middle;margin-right:4px">i</span>минутка истории</span>
    </div>
    <div class="tools">${CFG.offline ? `<button class="btn" id="dl">Скачать аудио для офлайна${mb ? ` (${Math.round(mb)} МБ)` : ""}</button>` : ""}<button class="btn" id="reset">Сбросить «прослушано»</button></div>
    <p class="note" id="dlnote"></p>
    <p class="note">Нажми на точку — раскроется история, ▶ — включит рассказ. Кнопка ◎ на карте показывает, где ты, и подсказывает, когда ты рядом с точкой.${CFG.links ? " " + CFG.links : ""}</p>`;
  document.getElementById("panel").innerHTML = html;
}
panel();

/* ---------- audio player ---------- */
const audio = new Audio();
audio.preload = "none";
let current = null;
const $ = id => document.getElementById(id);
function nextAfter(id) {
  const ref = byId[id]; if (!ref) return null;
  return ref.day.stops.slice(ref.i + 1).find(s => audioUrl(s.id)) || null;
}
function titleOf(id) {
  if (byId[id]) return byId[id].s.name;
  const d = PLAN.days.find(d => `${d.id}_intro` === id); if (d) return `Вступление · ${d.title}`;
  const e = (PLAN.evening || []).find(e => e.id === id); return e ? e.name : id;
}
function play(id) {
  const url = audioUrl(id); if (!url) return;
  if (current === id) { audio.paused ? audio.play() : audio.pause(); return; }
  current = id; audio.src = url; audio.play().catch(() => {});
  $("player").hidden = false; $("ptitle").textContent = titleOf(id);
  const nx = nextAfter(id); $("phint").textContent = nx ? `Дальше: ${nx.name}` : "";
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: titleOf(id), artist: CFG.title || "Аудиогид", album: byId[id]?.day.title || "" });
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("nexttrack", () => { const n = nextAfter(current); n && play(n.id); });
  }
  map.invalidateSize();
}
function syncButtons() {
  document.querySelectorAll("[data-play]").forEach(b => { const on = b.dataset.play === current && !audio.paused; b.classList.toggle("on", on); if (b.classList.contains("btn")) return; b.textContent = on ? "❚❚" : "▶"; });
  $("pp").textContent = audio.paused ? "▶" : "❚❚";
  $("pp").setAttribute("aria-label", audio.paused ? "Играть" : "Пауза");
}
audio.addEventListener("play", syncButtons);
audio.addEventListener("pause", syncButtons);
audio.addEventListener("timeupdate", () => {
  if (audio.duration) { $("pseek").value = (audio.currentTime / audio.duration) * 100; $("ptime").textContent = `${fmtT(audio.currentTime)} / ${fmtT(audio.duration)}`; }
});
audio.addEventListener("ended", () => {
  played.add(current); store.set("played", [...played]);
  document.querySelector(`[data-stop="${current}"]`)?.classList.add("played");
  const nx = nextAfter(current); $("phint").textContent = nx ? `Готово. Дальше: ${nx.name} — нажми ⏭, когда дойдёшь` : "Готово.";
  syncButtons();
});
$("pp").addEventListener("click", () => current && (audio.paused ? audio.play() : audio.pause()));
$("pnext").addEventListener("click", () => { const n = nextAfter(current); n && play(n.id); });
$("pseek").addEventListener("input", e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-play]"); if (!b) return;
  e.preventDefault(); e.stopPropagation(); play(b.dataset.play);
}, true);
$("reset")?.addEventListener("click", () => { played.clear(); store.set("played", []); document.querySelectorAll(".played").forEach(x => x.classList.remove("played")); });

/* ---------- offline ---------- */
if (CFG.offline && "serviceWorker" in navigator) navigator.serviceWorker.register(CFG.sw || "../sw.js").catch(() => {});
$("dl")?.addEventListener("click", async () => {
  const note = $("dlnote");
  if (!("caches" in window)) { note.textContent = "Этот браузер не умеет сохранять для офлайна."; return; }
  const urls = Object.keys(AUDIO).map(audioUrl);
  const cache = await caches.open("audio-v1");
  let done = 0;
  for (const u of urls) {
    try { if (!(await cache.match(u))) await cache.add(u); } catch (_) {}
    note.textContent = `Сохранено ${++done} из ${urls.length}…`;
  }
  note.textContent = `Готово: ${done} треков сохранены, рассказы будут играть без интернета.`;
});

/* ---------- geolocation ---------- */
let meMarker = null, meCircle = null, watchId = null, firstFix = true;
const dismissed = new Set();
const Locate = L.Control.extend({ options: { position: "topleft" }, onAdd() {
  const b = L.DomUtil.create("button", "locate leaflet-bar"); b.id = "locate"; b.title = "Где я"; b.setAttribute("aria-label", "Показать, где я"); b.textContent = "◎";
  L.DomEvent.on(b, "click", e => { L.DomEvent.stop(e); toggleLocate(); }); return b; } });
map.addControl(new Locate());
function toggleLocate() {
  const b = $("locate");
  if (watchId !== null) { if (meMarker) map.flyTo(meMarker.getLatLng(), Math.max(map.getZoom(), 16)); return; }
  if (!("geolocation" in navigator)) { hint("Геолокация недоступна в этом браузере."); return; }
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    hint(err.code === 1 ? "Нет доступа к геолокации: разреши её для сайта в настройках браузера." : "Не удалось определить местоположение.");
    navigator.geolocation.clearWatch(watchId); watchId = null; b.classList.remove("on");
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  b.classList.add("on");
}
function hint(text, playId) {
  $("player").hidden = false;
  if (!current) { $("ptitle").textContent = text; $("phint").textContent = ""; }
  else $("phint").textContent = text;
  if (playId) { $("phint").innerHTML = `${esc(text)} <button class="btn" data-play="${playId}" style="padding:2px 10px;margin-left:6px">▶ Слушать</button>`; }
  map.invalidateSize();
}
function onPos(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  if (!meMarker) {
    meCircle = L.circle(ll, { radius: p.coords.accuracy, color: "#1a73e8", weight: 1, fillOpacity: 0.08 }).addTo(map);
    meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000, interactive: false }).addTo(map);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(p.coords.accuracy); }
  if (firstFix) { firstFix = false; map.flyTo(ll, 16); }
  const here = L.latLng(ll);
  let best = null, bestD = Infinity;
  PLAN.days.forEach(d => { if (!map.hasLayer(layers[d.id])) return; d.stops.forEach(s => {
    if (s.kind === "home" || !audioUrl(s.id) || played.has(s.id) || dismissed.has(s.id) || s.id === current) return;
    const dist = here.distanceTo([s.lat, s.lon]); if (dist < bestD) { bestD = dist; best = s; } }); });
  const radius = best && best.kind === "history" ? 80 : 60;
  if (best && bestD <= Math.max(radius, Math.min(p.coords.accuracy, 120))) {
    dismissed.add(best.id);
    hint(`Ты рядом: ${best.name}`, best.id);
    if (navigator.vibrate) navigator.vibrate(120);
  }
}

/* ---------- tabs & focus ---------- */
document.getElementById("panel").addEventListener("toggle", e => {
  const d = e.target; if (!d.open || !d.dataset) return;
  const key = d.dataset.key;
  if (key === "home") { homeMarker && map.flyTo(homeMarker.getLatLng(), 16); return; }
  const m = markers[key]; if (!m) return;
  const ref = byId[key];
  if (ref && !map.hasLayer(layers[ref.day.id])) show(ref.day.id, false);
  map.flyTo(m.getLatLng(), 17);
}, true);

const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = (PLAN.days.length > 1 ? `<button data-show="all" aria-pressed="true">Всё</button>` : "") +
  PLAN.days.map(d => `<button data-show="${d.id}" aria-pressed="false"><span class="dot" style="background:${dayColor(d.id)}"></span>${esc(d.short)}</button>`).join("");
function show(which, fit = true) {
  PLAN.days.forEach(d => {
    const on = which === "all" || which === d.id;
    on ? layers[d.id].addTo(map) : layers[d.id].remove();
    document.querySelector(`section[data-day="${d.id}"]`).hidden = !on;
  });
  which === "all" ? layers.extra.addTo(map) : layers.extra.remove();
  document.querySelectorAll("section.extra").forEach(sec => { sec.hidden = which !== "all" && PLAN.days.length > 1; });
  tabsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.show === which)));
  if (fit) {
    const fg = which === "all" ? L.featureGroup(PLAN.days.map(d => layers[d.id])) : layers[which];
    const bb = fg.getBounds(); if (homeMarker) bb.extend(homeMarker.getLatLng());
    map.fitBounds(bb, { padding: [24, 24] });
  }
  store.set(CFG.key + "-tab", which);
}
tabsEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => show(b.dataset.show)));
let start = store.get(CFG.key + "-tab", PLAN.days.length > 1 ? "all" : PLAN.days[0].id);
const hashDay = location.hash.slice(1);
if (layers[hashDay]) start = hashDay;
if (start !== "all" && !layers[start]) start = PLAN.days.length > 1 ? "all" : PLAN.days[0].id;
show(start);
</script>
</body></html>
